<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="52" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Geometric Mean vs Arithmetic Mean (p = 4, q = 9)</text>
  <rect x="100" y="140" width="144" height="324" fill="#ffffff" fill-opacity="0.05" stroke="#f1c97d" stroke-width="6"/>
  <text x="172" y="306" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">4 × 9</text>
  <text x="172" y="502" font-size="22" fill="#a3a3a3" text-anchor="middle">Area = 36</text>
  <text x="312" y="318" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">=</text>
  <rect x="380" y="248" width="216" height="216" fill="#ffffff" fill-opacity="0.05" stroke="#4ade80" stroke-width="6"/>
  <text x="488" y="360" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">6 × 6</text>
  <text x="488" y="502" font-size="22" fill="#a3a3a3" text-anchor="middle">Area = 36</text>
  <line x1="700" y1="560" x2="1140" y2="560" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="700" y1="552" x2="700" y2="568" stroke="#ffffff" stroke-width="3"/>
  <text x="700" y="592" font-size="20" fill="#a3a3a3" text-anchor="middle">4</text>
  <line x1="788" y1="552" x2="788" y2="568" stroke="#ffffff" stroke-width="3"/>
  <text x="788" y="592" font-size="20" fill="#a3a3a3" text-anchor="middle">5</text>
  <line x1="876" y1="552" x2="876" y2="568" stroke="#ffffff" stroke-width="3"/>
  <text x="876" y="592" font-size="20" fill="#a3a3a3" text-anchor="middle">6</text>
  <line x1="964" y1="552" x2="964" y2="568" stroke="#ffffff" stroke-width="3"/>
  <text x="964" y="592" font-size="20" fill="#a3a3a3" text-anchor="middle">7</text>
  <line x1="1052" y1="552" x2="1052" y2="568" stroke="#ffffff" stroke-width="3"/>
  <text x="1052" y="592" font-size="20" fill="#a3a3a3" text-anchor="middle">8</text>
  <line x1="1140" y1="552" x2="1140" y2="568" stroke="#ffffff" stroke-width="3"/>
  <text x="1140" y="592" font-size="20" fill="#a3a3a3" text-anchor="middle">9</text>
  <line x1="920.0" y1="554" x2="920.0" y2="566" stroke="#a3a3a3" stroke-width="2"/>
  <circle cx="876" cy="560" r="9" fill="#f1c97d"/>
  <text x="830" y="528" font-size="22" font-weight="700" fill="#f1c97d" text-anchor="end">6 = geometric mean = h</text>
  <circle cx="920.0" cy="560" r="9" fill="#a3a3a3"/>
  <text x="1150" y="528" font-size="22" font-weight="700" fill="#a3a3a3" text-anchor="end">6.5 = arithmetic mean</text>
  <line x1="1046" y1="536" x2="924.0" y2="552" stroke="#a3a3a3" stroke-width="2"/>
</svg>
