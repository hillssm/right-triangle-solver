<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Worked example: arccos(4/5)</title>
<desc>Step by step calculation of angle A from adjacent side 4 and hypotenuse 5.</desc>
<rect x="0" y="0" width="1200" height="630" fill="#131313"/>
<text x="600" y="70" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" fill="#f5eeda" text-anchor="middle" font-weight="bold">Worked example: b = 4, c = 5</text>
<rect x="45" y="150" width="240" height="200" rx="14" fill="#1c1b1b" stroke="#38bdf8" stroke-width="2"/>
<text x="165" y="195" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#a3a3a3" text-anchor="middle">Step 1</text>
<text x="165" y="230" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" fill="#f5eeda" text-anchor="middle">Write the formula</text>
<text x="165" y="295" font-family="Noto Serif, Georgia, serif" font-size="27" fill="#38bdf8" text-anchor="middle" font-style="italic">A = arccos(b/c)</text>
<rect x="315" y="150" width="240" height="200" rx="14" fill="#1c1b1b" stroke="#38bdf8" stroke-width="2"/>
<text x="435" y="195" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#a3a3a3" text-anchor="middle">Step 2</text>
<text x="435" y="230" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" fill="#f5eeda" text-anchor="middle">Substitute values</text>
<text x="435" y="295" font-family="Noto Serif, Georgia, serif" font-size="27" fill="#38bdf8" text-anchor="middle" font-style="italic">A = arccos(4/5)</text>
<rect x="585" y="150" width="240" height="200" rx="14" fill="#1c1b1b" stroke="#f1c97d" stroke-width="2"/>
<text x="705" y="195" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#a3a3a3" text-anchor="middle">Step 3</text>
<text x="705" y="230" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" fill="#f5eeda" text-anchor="middle">Divide for ratio</text>
<text x="705" y="295" font-family="Noto Serif, Georgia, serif" font-size="27" fill="#f1c97d" text-anchor="middle" font-style="italic">A = arccos(0.8)</text>
<rect x="855" y="150" width="240" height="200" rx="14" fill="#1c1b1b" stroke="#4ade80" stroke-width="2"/>
<text x="975" y="195" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#a3a3a3" text-anchor="middle">Step 4</text>
<text x="975" y="230" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" fill="#f5eeda" text-anchor="middle">Apply arccos</text>
<text x="975" y="295" font-family="Noto Serif, Georgia, serif" font-size="27" fill="#4ade80" text-anchor="middle" font-style="italic">A ~ 36.87 deg</text>
<text x="300" y="265" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" fill="#a3a3a3" text-anchor="middle">-&gt;</text>
<text x="570" y="265" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" fill="#a3a3a3" text-anchor="middle">-&gt;</text>
<text x="840" y="265" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" fill="#a3a3a3" text-anchor="middle">-&gt;</text>
<rect x="150" y="400" width="900" height="150" rx="14" fill="#1c1b1b" stroke="#4ade80" stroke-width="2"/>
<text x="600" y="445" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#4ade80" text-anchor="middle" font-weight="bold">Verify: cos(36.87 deg) ~ 0.8 = 4/5</text>
<text x="600" y="490" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#f5eeda" text-anchor="middle">B = 90 - 36.87 = 53.13 deg (complement check passes)</text>
<text x="600" y="525" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#a3a3a3" text-anchor="middle">Round-trip confirms the angle is correct</text>
</svg>
