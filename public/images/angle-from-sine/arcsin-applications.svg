<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Four practical arcsin examples</title>
<desc>Roof rafter, ladder, ramp, and surveying triangles with measured sides and resulting angles.</desc>
<rect x="0" y="0" width="1200" height="630" fill="#131313"/>
<text x="600" y="55" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" fill="#f5eeda" text-anchor="middle" font-weight="bold">Arcsin in real life: four worked examples</text>
<!-- Panel 1: Roof -->
<g>
<rect x="30" y="90" width="550" height="240" rx="14" fill="#1c1b1b" stroke="#f1c97d" stroke-width="2"/>
<text x="305" y="125" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#f1c97d" text-anchor="middle" font-weight="bold">Roof rafter</text>
<polygon points="120,300 480,300 120,160" fill="rgba(241,201,125,0.08)"/>
<line x1="120" y1="300" x2="480" y2="300" stroke="#38bdf8" stroke-width="5"/>
<line x1="120" y1="300" x2="120" y2="160" stroke="#f1c97d" stroke-width="6"/>
<line x1="480" y1="300" x2="120" y2="160" stroke="#f472b6" stroke-width="6"/>
<text x="105" y="235" font-family="system-ui, sans-serif" font-size="22" fill="#f1c97d" text-anchor="middle">4 m</text>
<text x="300" y="240" font-family="system-ui, sans-serif" font-size="22" fill="#f472b6" text-anchor="middle">6.5 m</text>
<text x="170" y="290" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle">37.98 deg</text>
<text x="305" y="355" font-family="Noto Serif, Georgia, serif" font-size="24" fill="#ffffff" text-anchor="middle" font-style="italic">A = arcsin(4 / 6.5)</text>
</g>
<!-- Panel 2: Ladder -->
<g>
<rect x="620" y="90" width="550" height="240" rx="14" fill="#1c1b1b" stroke="#f1c97d" stroke-width="2"/>
<text x="895" y="125" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#f1c97d" text-anchor="middle" font-weight="bold">Ladder</text>
<polygon points="710,300 1070,300 710,150" fill="rgba(241,201,125,0.08)"/>
<line x1="710" y1="300" x2="1070" y2="300" stroke="#38bdf8" stroke-width="5"/>
<line x1="710" y1="300" x2="710" y2="150" stroke="#f1c97d" stroke-width="6"/>
<line x1="1070" y1="300" x2="710" y2="150" stroke="#f472b6" stroke-width="6"/>
<text x="695" y="230" font-family="system-ui, sans-serif" font-size="22" fill="#f1c97d" text-anchor="middle">4.5 m</text>
<text x="890" y="235" font-family="system-ui, sans-serif" font-size="22" fill="#f472b6" text-anchor="middle">5.5 m</text>
<text x="760" y="290" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle">54.90 deg</text>
<text x="895" y="355" font-family="Noto Serif, Georgia, serif" font-size="24" fill="#ffffff" text-anchor="middle" font-style="italic">A = arcsin(4.5 / 5.5)</text>
</g>
<!-- Panel 3: Ramp -->
<g>
<rect x="30" y="360" width="550" height="240" rx="14" fill="#1c1b1b" stroke="#f1c97d" stroke-width="2"/>
<text x="305" y="395" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#f1c97d" text-anchor="middle" font-weight="bold">Ramp</text>
<polygon points="120,560 500,560 120,520" fill="rgba(241,201,125,0.08)"/>
<line x1="120" y1="560" x2="500" y2="560" stroke="#38bdf8" stroke-width="5"/>
<line x1="120" y1="560" x2="120" y2="520" stroke="#f1c97d" stroke-width="6"/>
<line x1="500" y1="560" x2="120" y2="520" stroke="#f472b6" stroke-width="6"/>
<text x="105" y="545" font-family="system-ui, sans-serif" font-size="22" fill="#f1c97d" text-anchor="middle">0.75 m</text>
<text x="310" y="548" font-family="system-ui, sans-serif" font-size="22" fill="#f472b6" text-anchor="middle">9.5 m</text>
<text x="175" y="585" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle">4.53 deg</text>
<text x="305" y="470" font-family="Noto Serif, Georgia, serif" font-size="24" fill="#ffffff" text-anchor="middle" font-style="italic">A = arcsin(0.75 / 9.5)</text>
</g>
<!-- Panel 4: Surveying -->
<g>
<rect x="620" y="360" width="550" height="240" rx="14" fill="#1c1b1b" stroke="#f1c97d" stroke-width="2"/>
<text x="895" y="395" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#f1c97d" text-anchor="middle" font-weight="bold">Surveying</text>
<polygon points="710,560 1070,560 710,400" fill="rgba(241,201,125,0.08)"/>
<line x1="710" y1="560" x2="1070" y2="560" stroke="#38bdf8" stroke-width="5"/>
<line x1="710" y1="560" x2="710" y2="400" stroke="#f1c97d" stroke-width="6"/>
<line x1="1070" y1="560" x2="710" y2="400" stroke="#f472b6" stroke-width="6"/>
<text x="695" y="485" font-family="system-ui, sans-serif" font-size="22" fill="#f1c97d" text-anchor="middle">30 m</text>
<text x="890" y="490" font-family="system-ui, sans-serif" font-size="22" fill="#f472b6" text-anchor="middle">50 m</text>
<text x="760" y="550" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle">36.87 deg</text>
<text x="895" y="470" font-family="Noto Serif, Georgia, serif" font-size="24" fill="#ffffff" text-anchor="middle" font-style="italic">A = arcsin(30 / 50)</text>
</g>
</svg>
