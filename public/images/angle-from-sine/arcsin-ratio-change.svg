<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>How the sine ratio changes the angle</title>
<desc>Fixed hypotenuse of 10 units; larger opposite side gives a larger angle.</desc>
<rect x="0" y="0" width="1200" height="630" fill="#131313"/>
<text x="600" y="60" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" fill="#f5eeda" text-anchor="middle" font-weight="bold">Fixed hypotenuse c = 10: watch the angle grow</text>
<!-- Panel A -->
<g>
<rect x="30" y="100" width="350" height="480" rx="14" fill="#1c1b1b" stroke="#38bdf8" stroke-width="2"/>
<text x="205" y="145" font-family="system-ui, sans-serif" font-size="26" fill="#38bdf8" text-anchor="middle" font-weight="bold">Panel A</text>
<polygon points="90,520 330,520 90,470" fill="rgba(241,201,125,0.08)"/>
<line x1="90" y1="520" x2="330" y2="520" stroke="#38bdf8" stroke-width="5"/>
<line x1="90" y1="520" x2="90" y2="470" stroke="#f1c97d" stroke-width="6"/>
<line x1="330" y1="520" x2="90" y2="470" stroke="#f472b6" stroke-width="5"/>
<text x="205" y="200" font-family="system-ui, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">a = 2, c = 10</text>
<text x="205" y="245" font-family="Noto Serif, Georgia, serif" font-size="28" fill="#f1c97d" text-anchor="middle" font-style="italic">a/c = 0.2</text>
<text x="205" y="300" font-family="system-ui, sans-serif" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="bold">A ~ 11.54 deg</text>
<text x="205" y="350" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" opacity="0.75">small ratio,</text>
<text x="205" y="380" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" opacity="0.75">small angle</text>
</g>
<!-- Panel B -->
<g>
<rect x="425" y="100" width="350" height="480" rx="14" fill="#1c1b1b" stroke="#f1c97d" stroke-width="2"/>
<text x="600" y="145" font-family="system-ui, sans-serif" font-size="26" fill="#f1c97d" text-anchor="middle" font-weight="bold">Panel B</text>
<polygon points="485,520 725,520 485,380" fill="rgba(241,201,125,0.08)"/>
<line x1="485" y1="520" x2="725" y2="520" stroke="#38bdf8" stroke-width="5"/>
<line x1="485" y1="520" x2="485" y2="380" stroke="#f1c97d" stroke-width="6"/>
<line x1="725" y1="520" x2="485" y2="380" stroke="#f472b6" stroke-width="5"/>
<text x="600" y="200" font-family="system-ui, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">a = 5, c = 10</text>
<text x="600" y="245" font-family="Noto Serif, Georgia, serif" font-size="28" fill="#f1c97d" text-anchor="middle" font-style="italic">a/c = 0.5</text>
<text x="600" y="300" font-family="system-ui, sans-serif" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="bold">A = 30 deg</text>
<text x="600" y="350" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" opacity="0.75">half the hypotenuse,</text>
<text x="600" y="380" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" opacity="0.75">special triangle</text>
</g>
<!-- Panel C -->
<g>
<rect x="820" y="100" width="350" height="480" rx="14" fill="#1c1b1b" stroke="#f472b6" stroke-width="2"/>
<text x="995" y="145" font-family="system-ui, sans-serif" font-size="26" fill="#f472b6" text-anchor="middle" font-weight="bold">Panel C</text>
<polygon points="880,520 1120,520 880,300" fill="rgba(241,201,125,0.08)"/>
<line x1="880" y1="520" x2="1120" y2="520" stroke="#38bdf8" stroke-width="5"/>
<line x1="880" y1="520" x2="880" y2="300" stroke="#f1c97d" stroke-width="6"/>
<line x1="1120" y1="520" x2="880" y2="300" stroke="#f472b6" stroke-width="5"/>
<text x="995" y="200" font-family="system-ui, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">a = 8, c = 10</text>
<text x="995" y="245" font-family="Noto Serif, Georgia, serif" font-size="28" fill="#f1c97d" text-anchor="middle" font-style="italic">a/c = 0.8</text>
<text x="995" y="300" font-family="system-ui, sans-serif" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="bold">A ~ 53.13 deg</text>
<text x="995" y="350" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" opacity="0.75">large ratio,</text>
<text x="995" y="380" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" opacity="0.75">large angle</text>
</g>
<text x="600" y="612" font-family="system-ui, sans-serif" font-size="22" fill="#f5eeda" text-anchor="middle">As the opposite side grows against a fixed hypotenuse, the angle opens wider.</text>
</svg>
