<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Arcsin two-step process</title>
<desc>Diagram showing the two steps of arcsin: divide a by c, then apply arcsin to get the angle.</desc>
<rect x="0" y="0" width="1200" height="630" fill="#131313"/>
<text x="600" y="70" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" fill="#f5eeda" text-anchor="middle" font-weight="bold">How arcsin finds the angle</text>

<!-- Step 1 box -->
<rect x="80" y="140" width="440" height="330" rx="16" fill="#1c1b1b" stroke="#38bdf8" stroke-width="3"/>
<text x="300" y="195" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#38bdf8" text-anchor="middle" font-weight="bold">Step 1: Divide</text>
<text x="300" y="260" font-family="Noto Serif, Georgia, serif" font-size="44" fill="#f5eeda" text-anchor="middle" font-style="italic">a / c</text>
<text x="300" y="320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#f5eeda" text-anchor="middle">opposite over hypotenuse</text>
<text x="300" y="365" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#f5eeda" text-anchor="middle">Example: 3 / 5 = 0.6</text>
<text x="300" y="420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#a0a0a0" text-anchor="middle">a ratio between 0 and 1</text>

<!-- Arrow -->
<text x="600" y="320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="60" fill="#f1c97d" text-anchor="middle" font-weight="bold">-&gt;</text>

<!-- Step 2 box -->
<rect x="680" y="140" width="440" height="330" rx="16" fill="#1c1b1b" stroke="#f1c97d" stroke-width="3"/>
<text x="900" y="195" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#f1c97d" text-anchor="middle" font-weight="bold">Step 2: Apply arcsin</text>
<text x="900" y="260" font-family="Noto Serif, Georgia, serif" font-size="44" fill="#f5eeda" text-anchor="middle" font-style="italic">arcsin(0.6)</text>
<text x="900" y="320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#f5eeda" text-anchor="middle">inverse sine of the ratio</text>
<text x="900" y="365" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#f5eeda" text-anchor="middle">Result: 36.87 degrees</text>
<text x="900" y="420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#a0a0a0" text-anchor="middle">the angle whose sine is 0.6</text>

<text x="600" y="550" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#f5eeda" text-anchor="middle">Arcsin asks: which angle has this sine value?</text>
</svg>
