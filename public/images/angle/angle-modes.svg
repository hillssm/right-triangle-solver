<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>How to find angle A step by step</title>
<desc>Four-step process: identify sides, pick the ratio, apply inverse trig, verify with complement.</desc>

<text x="600" y="55" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" fill="#f5eeda" text-anchor="middle" font-weight="bold">Finding Angle A in 4 Steps</text>


<circle cx="120" cy="180" r="42" fill="#38bdf8" opacity="0.9" />
<text x="120" y="192" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" fill="#1a1a1a" text-anchor="middle" font-weight="bold">1</text>
<text x="120" y="250" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">Label sides</text>
<text x="120" y="285" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#f5eeda" text-anchor="middle">Find hypotenuse c,</text>
<text x="120" y="312" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#f5eeda" text-anchor="middle">then opposite a</text>
<text x="120" y="339" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#f5eeda" text-anchor="middle">and adjacent b</text>


<circle cx="400" cy="180" r="42" fill="#fbbf24" opacity="0.9" />
<text x="400" y="192" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" fill="#1a1a1a" text-anchor="middle" font-weight="bold">2</text>
<text x="400" y="250" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">Pick the ratio</text>
<text x="400" y="285" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#f5eeda" text-anchor="middle">a and c -&gt; sine</text>
<text x="400" y="312" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#f5eeda" text-anchor="middle">b and c -&gt; cosine</text>
<text x="400" y="339" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#f5eeda" text-anchor="middle">a and b -&gt; tangent</text>


<circle cx="680" cy="180" r="42" fill="#f472b6" opacity="0.9" />
<text x="680" y="192" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" fill="#1a1a1a" text-anchor="middle" font-weight="bold">3</text>
<text x="680" y="250" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">Apply inverse</text>
<text x="680" y="285" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#f5eeda" text-anchor="middle">A = sin⁻¹(a/c)</text>
<text x="680" y="312" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#f5eeda" text-anchor="middle">A = cos⁻¹(b/c)</text>
<text x="680" y="339" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#f5eeda" text-anchor="middle">A = tan⁻¹(a/b)</text>


<circle cx="960" cy="180" r="42" fill="#4ade80" opacity="0.9" />
<text x="960" y="192" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" fill="#1a1a1a" text-anchor="middle" font-weight="bold">4</text>
<text x="960" y="250" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">Verify</text>
<text x="960" y="285" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#f5eeda" text-anchor="middle">B = 90° - A</text>
<text x="960" y="312" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#f5eeda" text-anchor="middle">Check 0° &lt; A &lt; 90°</text>
<text x="960" y="339" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#f5eeda" text-anchor="middle">Cross-check ratios</text>


<line x1="170" y1="180" x2="345" y2="180" stroke="#ffffff" stroke-width="3" opacity="0.5" />
<polygon points="345,180 330,172 330,188" fill="#ffffff" opacity="0.5" />
<line x1="450" y1="180" x2="625" y2="180" stroke="#ffffff" stroke-width="3" opacity="0.5" />
<polygon points="625,180 610,172 610,188" fill="#ffffff" opacity="0.5" />
<line x1="730" y1="180" x2="905" y2="180" stroke="#ffffff" stroke-width="3" opacity="0.5" />
<polygon points="905,180 890,172 890,188" fill="#ffffff" opacity="0.5" />


<rect x="200" y="400" width="800" height="180" rx="16" fill="#241c12" stroke="#f1c97d" stroke-width="2" />
<text x="600" y="445" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#f1c97d" text-anchor="middle" font-weight="bold">Worked example: 3, 4, 5 triangle</text>
<text x="600" y="490" font-family="Noto Serif, Georgia, serif" font-size="28" fill="#ffffff" text-anchor="middle">A = sin⁻¹(3/5) = sin⁻¹(0.6) ~ 36.87°</text>
<text x="600" y="535" font-family="Noto Serif, Georgia, serif" font-size="28" fill="#ffffff" text-anchor="middle">B = 90° - 36.87° = 53.13°</text>
</svg>