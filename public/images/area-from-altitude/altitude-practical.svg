  <text x="916" y="402" font-size="26" font-weight="700" fill="#ffffff">Machine bracket</text>
  <text x="916" y="444" font-size="22" fill="#f1c97d">c = 250 mm</text>
  <text x="916" y="478" font-size="22" fill="#4ade80">h = 120 mm</text>
  <text x="916" y="514" font-size="20" fill="#a3a3a3">K = (250 x 120) / 2</text>
  <text x="916" y="552" font-size="24" font-weight="700" fill="#ffffff">= 15000 mm²</text>
