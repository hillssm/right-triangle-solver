  <text x="316" y="444" font-size="22" fill="#f1c97d">c = 50 m</text>
  <text x="316" y="478" font-size="22" fill="#4ade80">h = 24 m</text>
  <text x="316" y="514" font-size="20" fill="#a3a3a3">K = (50 x 24) / 2</text>
  <text x="316" y="552" font-size="24" font-weight="700" fill="#ffffff">= 600 m²</text>
