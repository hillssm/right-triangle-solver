  <text x="316" y="142" font-size="26" font-weight="700" fill="#ffffff">Garden bed</text>
  <text x="316" y="184" font-size="22" fill="#f1c97d">c = 10 m</text>
  <text x="316" y="218" font-size="22" fill="#4ade80">h = 4.8 m</text>
  <text x="316" y="254" font-size="20" fill="#a3a3a3">K = (10 x 4.8) / 2</text>
  <text x="316" y="292" font-size="24" font-weight="700" fill="#ffffff">= 24 m²</text>
