<text x="410" y="420" fill="#f1c97d" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">I</text>
<text x="483" y="500" fill="#f1c97d" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">K₁ = ar/2</text>
<text x="337" y="390" fill="#7db8f1" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">K₂ = br/2</text>
<text x="470" y="360" fill="#90d090" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">K₃ = cr/2</text>
<text x="560" y="372" fill="#f5f0e6" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle">r</text>
<text x="418" y="500" fill="#f5f0e6" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle">r</text>
