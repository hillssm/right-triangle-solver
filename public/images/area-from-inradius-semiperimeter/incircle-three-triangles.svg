<text x="520" y="558" fill="#9a958a" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">a</text>
<text x="272" y="365" fill="#9a958a" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">b</text>
<text x="590" y="300" fill="#9a958a" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">c</text>
<text x="600" y="592" fill="#f5f0e6" font-size="21" font-family="Manrope,Arial,sans-serif" text-anchor="middle">K = ar/2 + br/2 + cr/2 = rs</text>
