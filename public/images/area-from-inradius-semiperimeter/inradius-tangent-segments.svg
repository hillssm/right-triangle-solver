<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
<rect width="1200" height="630" fill="#111412"/>
<text x="60" y="55" fill="#f1c97d" font-size="26" font-family="Georgia,serif" font-weight="bold">Finding the Inradius From the Three Sides (3-4-5 Triangle)</text>
<polygon points="330,100 660,540 330,540" fill="none" stroke="#f1c97d" stroke-width="3.5"/>
<circle cx="440" cy="430" r="110" fill="none" stroke="#f5f0e6" stroke-width="3"/>
<circle cx="528.0" cy="364.0" r="5" fill="#f5f0e6"/>
<circle cx="440" cy="540" r="5" fill="#f5f0e6"/>
<circle cx="330" cy="430" r="5" fill="#f5f0e6"/>
<polygon points="330,540 440,540 440,430 330,430" fill="none" stroke="#7db8f1" stroke-width="2"/>
<circle cx="440" cy="430" r="6" fill="#f1c97d"/>
<text x="300" y="265" fill="#7db8f1" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">x = 330</text>
<text x="560" y="566" fill="#90d090" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">y = 220</text>
<text x="392" y="566" fill="#f1c97d" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">z = r = 110</text>
<text x="385" y="492" fill="#7db8f1" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle">r</text>
<text x="455" y="235" fill="#7db8f1" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">x = 330</text>
<text x="640" y="480" fill="#90d090" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">y = 220</text>
<text x="312" y="92" fill="#f5f0e6" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">A</text>
<text x="672" y="566" fill="#f5f0e6" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">B</text>
<text x="312" y="566" fill="#f5f0e6" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">C</text>
<text x="448" y="424" fill="#f1c97d" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">I</text>
<text x="495" y="585" fill="#9a958a" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">a = 3</text>
<text x="295" y="320" fill="#9a958a" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">b = 4</text>
<text x="530" y="290" fill="#9a958a" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">c = 5</text>
<polyline points="344,526 358,540 344,554" fill="none" stroke="#f1c97d" stroke-width="2"/>
<text x="600" y="600" fill="#f5f0e6" font-size="21" font-family="Manrope,Arial,sans-serif" text-anchor="middle">r = (a+b−c)/2 = (3+4−5)/2 = 1    s = (a+b+c)/2 = 6    K = 1×6 = 6</text>
</svg>