<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
<rect width="1200" height="630" fill="#111412"/>
<text x="60" y="55" fill="#f1c97d" font-size="26" font-family="Georgia,serif" font-weight="bold">Three Methods, One Area (3-4-5 Triangle)</text>
<text x="210" y="110" fill="#f1c97d" font-size="21" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">Method 1: K = rs</text>
<polygon points="120,260 300,440 120,440" fill="none" stroke="#f1c97d" stroke-width="3"/>
<circle cx="180" cy="380" r="60" fill="none" stroke="#f5f0e6" stroke-width="2.5"/>
<circle cx="180" cy="380" r="5" fill="#f1c97d"/>
<text x="188" y="372" fill="#f1c97d" font-size="18" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">I</text>
<text x="210" y="250" fill="#f5f0e6" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle">r = 1</text>
<text x="210" y="560" fill="#f1c97d" font-size="21" font-family="Manrope,Arial,sans-serif" text-anchor="middle">K = rs = 1×6 = 6</text>
<text x="580" y="110" fill="#f1c97d" font-size="21" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">Method 2: K = ab/2</text>
<polygon points="490,260 670,440 490,440" fill="none" stroke="#f1c97d" stroke-width="3"/>
<polyline points="504,426 518,440 504,454" fill="none" stroke="#f1c97d" stroke-width="2"/>
<text x="460" y="350" fill="#9a958a" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle">b = 4</text>
<text x="580" y="466" fill="#9a958a" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle">a = 3</text>
<text x="580" y="560" fill="#f1c97d" font-size="21" font-family="Manrope,Arial,sans-serif" text-anchor="middle">K = ab/2 = 3×4/2 = 6</text>
<text x="950" y="110" fill="#f1c97d" font-size="21" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">Method 3: Heron</text>
<polygon points="860,260 1040,440 860,440" fill="none" stroke="#f1c97d" stroke-width="3"/>
<text x="830" y="350" fill="#9a958a" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle">b = 4</text>
<text x="950" y="466" fill="#9a958a" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle">a = 3</text>
<text x="990" y="330" fill="#9a958a" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle">c = 5</text>
<text x="950" y="560" fill="#f1c97d" font-size="21" font-family="Manrope,Arial,sans-serif" text-anchor="middle">K = √(6×3×2×1) = 6</text>
<text x="600" y="600" fill="#9a958a" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle">Three different methods produce the same right-triangle area.</text>
</svg>