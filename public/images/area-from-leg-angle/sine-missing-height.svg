<text x="112" y="174" fill="#f5f0e6" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">A</text>
<text x="530" y="496" fill="#f5f0e6" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">B</text>
<text x="110" y="498" fill="#f5f0e6" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">C</text>
<text x="108" y="342" fill="#9a958a" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="end" font-weight="bold">a = 3</text>
<text x="320" y="508" fill="#f1c97d" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">b = 4</text>
<text x="347" y="315" fill="#f1c97d" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">c = 5</text>
<text x="320" y="560" fill="#9a958a" font-size="18" font-family="Manrope,Arial,sans-serif" text-anchor="middle">a is unknown until sine finds it</text>
<text x="875" y="140" fill="#f5f0e6" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle">from the triangle: sin(A) = a/c = 3/5 = 0.6</text>
<line x1="875" y1="168" x2="875" y2="200" stroke="#f1c97d" stroke-width="3" marker-end="url(#arr)"/>
<text x="875" y="232" fill="#f1c97d" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">a = c × sin(A) = 5 × 0.6 = 3</text>
<text x="875" y="262" fill="#9a958a" font-size="17" font-family="Manrope,Arial,sans-serif" text-anchor="middle">the missing height, recovered</text>
<line x1="875" y1="288" x2="875" y2="328" stroke="#f1c97d" stroke-width="3" marker-end="url(#arr)"/>
<rect x="615" y="340" width="520" height="80" fill="none" stroke="#f1c97d" stroke-width="2"/>
<text x="755.0" y="385" fill="#f5f0e6" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="start">K = ab/2 = 4×3/2 = </text>
<text x="995.0" y="385" fill="#f1c97d" font-size="26" font-family="Manrope,Arial,sans-serif" text-anchor="start" font-weight="bold">6</text>
<line x1="875" y1="422" x2="875" y2="434" stroke="#f1c97d" stroke-width="3" marker-end="url(#arr)"/>
<rect x="615" y="440" width="520" height="80" fill="none" stroke="#f1c97d" stroke-width="2"/>
<text x="689.0" y="485" fill="#f5f0e6" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="start">K = bc sin(A)/2 = 4×5×0.6/2 = </text>
<text x="1061.0" y="485" fill="#f1c97d" font-size="26" font-family="Manrope,Arial,sans-serif" text-anchor="start" font-weight="bold">6</text>
<text x="875" y="562" fill="#9a958a" font-size="18" font-family="Manrope,Arial,sans-serif" text-anchor="middle">sine links the two area formulas</text>
</svg>
