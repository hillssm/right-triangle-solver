<circle cx="1050" cy="440" r="5" fill="#f1c97d"/>
<text x="885" y="120" fill="#f5f0e6" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">Triangle B</text>
<text x="695" y="385" fill="#f1c97d" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="end" font-weight="bold">a = 2</text>
<text x="885" y="472" fill="#86c5be" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">b = 6</text>
<text x="897" y="358" fill="#f5f0e6" font-size="18" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">c</text>
<text x="885" y="512" fill="#f5f0e6" font-size="21" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">K = (2 × 6) / 2 = 6</text>
<text x="600" y="330" fill="#f1c97d" font-size="60" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">=</text>
<text x="600" y="372" fill="#9a958a" font-size="18" font-family="Manrope,Arial,sans-serif" text-anchor="middle">equal areas</text>
<text x="600" y="600" fill="#9a958a" font-size="21" font-family="Manrope,Arial,sans-serif" text-anchor="middle">Legs 3 and 4 and legs 2 and 6 both enclose an area of 6.</text>
</svg>
