<polyline points="752.3,340.7 751.7,342.2 751.2,343.6 750.5,345.0 749.8,346.3 749.1,347.6 748.3,348.9 747.4,350.1 746.5,351.3 745.5,352.5 744.5,353.6 743.4,354.7 742.3,355.7 741.1,356.7 739.9,357.6 738.6,358.4 737.3,359.2 736.0,360.0 734.7,360.7 733.3,361.3 731.9,361.9 730.4,362.4 729.0,362.8 727.5,363.2 726.0,363.5 724.5,363.7 723.0,363.9 721.5,364.0 720.0,364.0" fill="none" stroke="#f1c97d" stroke-width="2.5"/>
<circle cx="720" cy="330" r="5" fill="#f1c97d"/>
