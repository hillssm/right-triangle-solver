<line x1="215" y1="275" x2="435" y2="440" stroke="#f5f0e6" stroke-width="4"/>
<polyline points="215,414 241,414 241,440" fill="none" stroke="#f5f0e6" stroke-width="2.5"/>
<polyline points="242.2,295.4 241.5,296.3 240.8,297.2 240.0,298.0 239.3,298.8 238.5,299.6 237.6,300.4 236.8,301.1 235.9,301.8 235.0,302.5 234.1,303.1 233.1,303.8 232.2,304.3 231.2,304.9 230.2,305.4 229.2,305.9 228.2,306.4 227.1,306.8 226.1,307.2 225.0,307.5 223.9,307.8 222.8,308.1 221.7,308.3 220.6,308.5 219.5,308.7 218.4,308.8 217.3,308.9 216.1,309.0 215.0,309.0" fill="none" stroke="#f1c97d" stroke-width="2.5"/>
<circle cx="215" cy="275" r="5" fill="#f1c97d"/>
<circle cx="215" cy="440" r="5" fill="#f1c97d"/>
<circle cx="435" cy="440" r="5" fill="#f1c97d"/>
<text x="325" y="120" fill="#f5f0e6" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">Triangle A</text>
<text x="190" y="358" fill="#f1c97d" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="end" font-weight="bold">a = 3</text>
<text x="325" y="472" fill="#86c5be" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">b = 4</text>
<text x="344" y="335" fill="#f5f0e6" font-size="18" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">c</text>
<text x="325" y="512" fill="#f5f0e6" font-size="21" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">K = (3 × 4) / 2 = 6</text>
<polygon points="720,330 720,440 1050,440" fill="#f1c97d" fill-opacity="0.1" stroke="none"/>
