<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
<rect width="1200" height="630" fill="#111412"/>
<text x="60" y="55" fill="#f1c97d" font-size="26" font-family="Georgia,serif" text-anchor="start" font-weight="bold">Geometric Proof: K = r × s</text>
<polygon points="460,380 360,180 360,480" fill="#f1c97d" fill-opacity="0.16" stroke="none"/>
<polygon points="460,380 360,480 760,480" fill="#86c5be" fill-opacity="0.16" stroke="none"/>
<polygon points="460,380 760,480 360,180" fill="#f5f0e6" fill-opacity="0.12" stroke="none"/>
<line x1="360" y1="180" x2="360" y2="480" stroke="#f5f0e6" stroke-width="4"/>
<line x1="360" y1="480" x2="760" y2="480" stroke="#f5f0e6" stroke-width="4"/>
<line x1="360" y1="180" x2="760" y2="480" stroke="#f5f0e6" stroke-width="4"/>
<polyline points="360,454 386,454 386,480" fill="none" stroke="#f5f0e6" stroke-width="2.5"/>
<line x1="460" y1="380" x2="760" y2="480" stroke="#f5f0e6" stroke-width="2.5"/>
<line x1="460" y1="380" x2="360" y2="180" stroke="#f5f0e6" stroke-width="2.5"/>
<line x1="460" y1="380" x2="360" y2="480" stroke="#f5f0e6" stroke-width="2.5"/>
<line x1="460" y1="380" x2="360" y2="380" stroke="#86c5be" stroke-width="2.5" stroke-dasharray="8,6"/>
<line x1="460" y1="380" x2="460" y2="480" stroke="#86c5be" stroke-width="2.5" stroke-dasharray="8,6"/>
<line x1="460" y1="380" x2="520" y2="300" stroke="#86c5be" stroke-width="2.5" stroke-dasharray="8,6"/>
<circle cx="360" cy="180" r="6" fill="#f5f0e6"/>
<circle cx="360" cy="480" r="6" fill="#f5f0e6"/>
<circle cx="760" cy="480" r="6" fill="#f5f0e6"/>
<text x="360" y="152" fill="#f5f0e6" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">B</text>
<text x="330" y="508" fill="#f5f0e6" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">C</text>
<text x="792" y="470" fill="#f5f0e6" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">A</text>
<circle cx="460" cy="380" r="6" fill="#f1c97d"/>
<text x="484" y="398" fill="#f5f0e6" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">I</text>
<text x="318" y="330" fill="#f1c97d" font-size="26" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">a</text>
<text x="560" y="518" fill="#86c5be" font-size="26" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">b</text>
<text x="592" y="306" fill="#f5f0e6" font-size="26" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">c</text>
<text x="405" y="365" fill="#86c5be" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">r</text>
<text x="440" y="437" fill="#86c5be" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">r</text>
<text x="512" y="347" fill="#86c5be" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">r</text>
<text x="270" y="410" fill="#f1c97d" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">K1 = ar/2</text>
<line x1="328" y1="406" x2="372" y2="396" stroke="#f1c97d" stroke-width="1.5"/>
<text x="560" y="445" fill="#86c5be" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">K2 = br/2</text>
<text x="545" y="368" fill="#f5f0e6" font-size="18" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">K3 = cr/2</text>
<text x="260" y="556" fill="#f5f0e6" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">K = ar/2 + br/2 + cr/2</text>
<text x="448" y="556" fill="#9a958a" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">=</text>
<text x="610" y="556" fill="#f5f0e6" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">K = r(a + b + c)/2</text>
<text x="796" y="548" fill="#9a958a" font-size="22" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">=</text>
<rect x="864" y="512" width="172" height="46" rx="6" fill="none" stroke="#f1c97d" stroke-width="2"/>
<text x="950" y="550" fill="#f5f0e6" font-size="26" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold"><tspan fill="#f5f0e6">K</tspan> = <tspan fill="#86c5be">r</tspan> × <tspan fill="#f1c97d">s</tspan></text>
</svg>
