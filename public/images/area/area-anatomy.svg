  <text x="1045" y="508" font-size="18" fill="#4ade80" text-anchor="middle">h = altitude</text>
  <text x="600" y="612" font-size="17" fill="#d4d4d4" text-anchor="middle">C is the right angle. The altitude h meets the hypotenuse at 90 degrees.</text>
