<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="48" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Five Methods, One Triangle, One Area</text>
  <line x1="120" y1="520" x2="120" y2="250" stroke="#f1c97d" stroke-width="8" stroke-linecap="round"/>
  <line x1="120" y1="520" x2="480" y2="520" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <line x1="480" y1="520" x2="120" y2="250" stroke="#a3a3a3" stroke-width="8" stroke-linecap="round"/>
  <polyline points="120.0,496.0 144.0,496.0 144.0,520.0" fill="none" stroke="#ffffff" stroke-width="3"/>
  <line x1="120" y1="520" x2="249.6" y2="347.2" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
  <circle cx="480.0" cy="520.0" r="6" fill="#ffffff"/>
  <circle cx="120.0" cy="250.0" r="6" fill="#ffffff"/>
  <circle cx="120.0" cy="520.0" r="6" fill="#ffffff"/>
  <text x="492" y="554" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">A</text>
  <text x="108" y="242" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">B</text>
  <text x="108" y="554" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">C</text>
  <text x="92" y="390" font-size="20" fill="#f1c97d" text-anchor="middle" font-weight="700">a=3</text>
  <text x="300" y="554" font-size="20" fill="#38bdf8" text-anchor="middle" font-weight="700">b=4</text>
  <text x="330" y="360" font-size="20" fill="#a3a3a3" text-anchor="middle" font-weight="700">c=5</text>
  <text x="210" y="470" font-size="18" fill="#4ade80" text-anchor="middle" font-weight="700">h=2.4</text>
  <text x="452" y="500" font-size="17" fill="#ffffff" text-anchor="middle">A≈37°</text>
  <text x="150" y="300" font-size="17" fill="#ffffff" text-anchor="middle">B≈53°</text>
  <text x="300" y="600" font-size="18" fill="#d4d4d4" text-anchor="middle">r = 1,  s = 6</text>
  <rect x="620" y="92" width="550" height="96" rx="10" fill="#1c1b1b" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="650" y="134" font-size="20" fill="#f1c97d" text-anchor="start" font-weight="700">1. Legs</text>
  <text x="650" y="164" font-size="20" fill="#d4d4d4" text-anchor="start">K = (3 × 4)/2</text>
  <text x="1140" y="150" font-size="28" fill="#ffffff" text-anchor="end" font-weight="700">= 6</text>
  <rect x="620" y="200" width="550" height="96" rx="10" fill="#1c1b1b" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="650" y="242" font-size="20" fill="#f1c97d" text-anchor="start" font-weight="700">2. Angle A</text>
  <text x="650" y="272" font-size="20" fill="#d4d4d4" text-anchor="start">K = (4 × 5 × 0.6)/2</text>
  <text x="1140" y="258" font-size="28" fill="#ffffff" text-anchor="end" font-weight="700">= 6</text>
  <rect x="620" y="308" width="550" height="96" rx="10" fill="#1c1b1b" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="650" y="350" font-size="20" fill="#f1c97d" text-anchor="start" font-weight="700">3. Angle B</text>
  <text x="650" y="380" font-size="20" fill="#d4d4d4" text-anchor="start">K = (3 × 5 × 0.8)/2</text>
  <text x="1140" y="366" font-size="28" fill="#ffffff" text-anchor="end" font-weight="700">= 6</text>
  <rect x="620" y="416" width="550" height="96" rx="10" fill="#1c1b1b" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="650" y="458" font-size="20" fill="#f1c97d" text-anchor="start" font-weight="700">4. Inradius</text>
  <text x="650" y="488" font-size="20" fill="#d4d4d4" text-anchor="start">K = 1 × 6</text>
  <text x="1140" y="474" font-size="28" fill="#ffffff" text-anchor="end" font-weight="700">= 6</text>
  <rect x="620" y="524" width="550" height="96" rx="10" fill="#1c1b1b" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="650" y="566" font-size="20" fill="#f1c97d" text-anchor="start" font-weight="700">5. Altitude</text>
  <text x="650" y="596" font-size="20" fill="#d4d4d4" text-anchor="start">K = (5 × 2.4)/2</text>
  <text x="1140" y="582" font-size="28" fill="#ffffff" text-anchor="end" font-weight="700">= 6</text>
</svg>
