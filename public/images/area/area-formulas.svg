<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="48" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">The Five Area Formulas</text>
  <rect x="30" y="92" width="360" height="238" rx="10" fill="#1c1b1b" stroke="#f1c97d" stroke-width="1.5"/>
  <text x="210" y="154" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="700">K = ab/2</text>
  <text x="210" y="200" font-size="20" fill="#f1c97d" text-anchor="middle">Inputs: a, b</text>
  <text x="210" y="244" font-size="17" fill="#d4d4d4" text-anchor="middle">Both legs known.</text>
  <text x="210" y="274" font-size="17" fill="#d4d4d4" text-anchor="middle">The simplest method.</text>
  <rect x="420" y="92" width="360" height="238" rx="10" fill="#1c1b1b" stroke="#f1c97d" stroke-width="1.5"/>
  <text x="600" y="154" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="700">K = bc·sin(A)/2</text>
  <text x="600" y="200" font-size="20" fill="#f1c97d" text-anchor="middle">Inputs: b, c, A</text>
  <text x="600" y="244" font-size="17" fill="#d4d4d4" text-anchor="middle">Leg, hypotenuse, angle A.</text>
  <text x="600" y="274" font-size="17" fill="#d4d4d4" text-anchor="middle">Sine gives the height.</text>
  <rect x="810" y="92" width="360" height="238" rx="10" fill="#1c1b1b" stroke="#f1c97d" stroke-width="1.5"/>
  <text x="990" y="154" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="700">K = ac·sin(B)/2</text>
  <text x="990" y="200" font-size="20" fill="#f1c97d" text-anchor="middle">Inputs: a, c, B</text>
  <text x="990" y="244" font-size="17" fill="#d4d4d4" text-anchor="middle">Leg, hypotenuse, angle B.</text>
  <text x="990" y="274" font-size="17" fill="#d4d4d4" text-anchor="middle">Mirror of the angle A form.</text>
  <rect x="225" y="362" width="360" height="238" rx="10" fill="#1c1b1b" stroke="#f1c97d" stroke-width="1.5"/>
  <text x="405" y="424" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="700">K = r·s</text>
  <text x="405" y="470" font-size="20" fill="#f1c97d" text-anchor="middle">Inputs: r, s</text>
  <text x="405" y="514" font-size="17" fill="#d4d4d4" text-anchor="middle">Inradius and semiperimeter.</text>
  <text x="405" y="544" font-size="17" fill="#d4d4d4" text-anchor="middle">Incircle view of the area.</text>
  <rect x="615" y="362" width="360" height="238" rx="10" fill="#1c1b1b" stroke="#f1c97d" stroke-width="1.5"/>
  <text x="795" y="424" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="700">K = c·h/2</text>
  <text x="795" y="470" font-size="20" fill="#f1c97d" text-anchor="middle">Inputs: c, h</text>
  <text x="795" y="514" font-size="17" fill="#d4d4d4" text-anchor="middle">Hypotenuse and altitude.</text>
  <text x="795" y="544" font-size="17" fill="#d4d4d4" text-anchor="middle">Base-height with c as base.</text>
</svg>
