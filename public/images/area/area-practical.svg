<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="48" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Four Practical Area Calculations</text>
  <rect x="30" y="90" width="555" height="240" rx="10" fill="#1c1b1b" stroke="#f1c97d" stroke-width="1.5"/>
  <text x="307" y="130" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Garden</text>
  <line x1="70" y1="290" x2="70" y2="170" stroke="#f1c97d" stroke-width="6" stroke-linecap="round"/>
  <line x1="70" y1="290" x2="230" y2="290" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="230" y1="290" x2="70" y2="170" stroke="#a3a3a3" stroke-width="6" stroke-linecap="round"/>
  <text x="54" y="230" font-size="16" fill="#f1c97d" text-anchor="middle">6 m</text>
  <text x="150" y="314" font-size="16" fill="#38bdf8" text-anchor="middle">8 m</text>
  <text x="330" y="186" font-size="18" fill="#d4d4d4" text-anchor="middle">Legs 6 m and 8 m</text>
  <text x="330" y="230" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="700">K = (6 × 8)/2</text>
  <text x="330" y="278" font-size="26" fill="#f1c97d" text-anchor="middle" font-weight="700">= 24 m²</text>
  <rect x="615" y="90" width="555" height="240" rx="10" fill="#1c1b1b" stroke="#f1c97d" stroke-width="1.5"/>
  <text x="892" y="130" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Roof gable</text>
  <line x1="655" y1="290" x2="825" y2="290" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="825" y1="290" x2="675" y2="160" stroke="#a3a3a3" stroke-width="6" stroke-linecap="round"/>
  <line x1="655" y1="290" x2="675" y2="160" stroke="#f1c97d" stroke-width="6" stroke-linecap="round"/>
  <polyline points="781.0,290.0 781.0,288.0 781.2,286.1 781.4,284.1 781.7,282.2 782.1,280.3 782.6,278.4 783.1,276.5 783.8,274.6 784.5,272.8 785.3,271.0 786.2,269.3 787.2,267.6 788.2,265.9 789.3,264.3 790.5,262.7 791.7,261.2" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <text x="751" y="314" font-size="15" fill="#ffffff" text-anchor="middle">A ≈ 53°</text>
  <text x="773" y="230" font-size="15" fill="#a3a3a3" text-anchor="middle">c=10</text>
  <text x="915" y="186" font-size="18" fill="#d4d4d4" text-anchor="middle">b = 6 m, c = 10 m, A ≈ 53.13°</text>
  <text x="915" y="230" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="700">K = (6 × 10 × 0.8)/2</text>
  <text x="915" y="278" font-size="26" fill="#f1c97d" text-anchor="middle" font-weight="700">= 24 m²</text>
  <rect x="30" y="350" width="555" height="240" rx="10" fill="#1c1b1b" stroke="#f1c97d" stroke-width="1.5"/>
  <text x="307" y="390" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Truss</text>
  <line x1="70" y1="550" x2="70" y2="420" stroke="#f1c97d" stroke-width="6" stroke-linecap="round"/>
  <line x1="70" y1="550" x2="240" y2="550" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="240" y1="550" x2="70" y2="420" stroke="#a3a3a3" stroke-width="6" stroke-linecap="round"/>
  <polyline points="105.0,446.7 103.4,448.7 101.7,450.6 99.9,452.3 98.0,454.0 96.0,455.5 93.9,457.0 91.7,458.3 89.5,459.4 87.2,460.5 84.9,461.4 82.5,462.2 80.0,462.8 77.5,463.3 75.0,463.7 72.5,463.9 70.0,464.0" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <text x="122" y="466" font-size="15" fill="#ffffff" text-anchor="middle">B ≈ 67°</text>
  <text x="178" y="490" font-size="15" fill="#a3a3a3" text-anchor="middle">c=13</text>
  <text x="330" y="446" font-size="18" fill="#d4d4d4" text-anchor="middle">a = 5 m, c = 13 m, B ≈ 67.38°</text>
  <text x="330" y="490" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="700">K = (5 × 13 × 12/13)/2</text>
  <text x="330" y="538" font-size="26" fill="#f1c97d" text-anchor="middle" font-weight="700">= 30 m²</text>
  <rect x="615" y="350" width="555" height="240" rx="10" fill="#1c1b1b" stroke="#f1c97d" stroke-width="1.5"/>
  <text x="892" y="390" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Panel</text>
  <line x1="655" y1="550" x2="855" y2="550" stroke="#a3a3a3" stroke-width="6" stroke-linecap="round"/>
  <line x1="855" y1="550" x2="695" y2="420" stroke="#f1c97d" stroke-width="6" stroke-linecap="round"/>
  <line x1="655" y1="550" x2="695" y2="420" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="695" y1="420" x2="695" y2="550" stroke="#4ade80" stroke-width="4" stroke-dasharray="8,6"/>
  <text x="713" y="488" font-size="15" fill="#4ade80" text-anchor="middle">h=4.8</text>
  <text x="755" y="574" font-size="15" fill="#a3a3a3" text-anchor="middle">c=10 m</text>
  <text x="915" y="446" font-size="18" fill="#d4d4d4" text-anchor="middle">c = 10 m, h = 4.8 m</text>
  <text x="915" y="490" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="700">K = (10 × 4.8)/2</text>
  <text x="915" y="538" font-size="26" fill="#f1c97d" text-anchor="middle" font-weight="700">= 24 m²</text>
</svg>
