<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg2)"/>
  <rect width="1200" height="630" fill="url(#grid2)"/>
  <g transform="translate(94,0) scale(1.125)">

  <text x="450" y="52" font-family="system-ui, sans-serif" font-size="26" font-weight="500" fill="#94a3b8" text-anchor="middle">Halve an equilateral triangle and the ratio appears</text>

  <!-- Equilateral side 2 units at 190 px/unit: L(240,430), R(620,430), apex(430,101); altitude to midpoint M(430,430); right half shaded -->
  <path d="M 430 101 L 620 430 L 430 430 Z" fill="rgba(56, 189, 248, 0.12)"/>
  <path d="M 240 430 L 620 430 L 430 101 Z" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
  <line x1="430" y1="101" x2="430" y2="430" stroke="#facc15" stroke-width="2.5" stroke-dasharray="8 6"/>

  <!-- Right-angle marker at M for the right half -->
  <path d="M 454 430 L 454 406 L 430 406" fill="none" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Side labels: outer sides 2, base halves 1, altitude sqrt(3) -->
  <text x="298" y="272" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">2</text>
  <text x="566" y="272" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">2</text>
  <text x="335" y="472" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">1</text>
  <text x="525" y="472" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">1</text>
  <text x="462" y="272" font-family="monospace" font-size="29" font-weight="600" fill="#facc15" text-anchor="middle">√3</text>

  <!-- Angle labels on the right half -->
  <text x="470" y="148" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#facc15" text-anchor="middle">30°</text>
  <text x="566" y="404" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#facc15" text-anchor="middle">60°</text>

  <text x="450" y="528" font-family="monospace" font-size="27" font-weight="bold" fill="#10b981" text-anchor="middle">altitude = √(2² − 1²) = √3</text>
  </g>
</svg>
