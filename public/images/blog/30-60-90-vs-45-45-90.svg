<svg width="900" height="560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="900" height="560" fill="url(#bg3)"/>
  <rect width="900" height="560" fill="url(#grid3)"/>

  <text x="450" y="52" font-family="system-ui, sans-serif" font-size="26" font-weight="500" fill="#94a3b8" text-anchor="middle">The two special right triangles, side by side</text>

  <!-- Left: 30-60-90 at 110 px/unit: A(110,430) right angle, C(110,320), B(300,430) -->
  <text x="205" y="118" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#cbd5e1" text-anchor="middle">30-60-90</text>
  <path d="M 110 430 L 300 430 L 110 320 Z" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 132 430 L 132 408 L 110 408" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="152" y="406" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#cbd5e1" text-anchor="middle">90°</text>
  <text x="262" y="410" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#facc15" text-anchor="middle">30°</text>
  <text x="146" y="350" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#facc15" text-anchor="middle">60°</text>
  <text x="82" y="382" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#cbd5e1" text-anchor="middle">1</text>
  <text x="205" y="468" font-family="monospace" font-size="24" font-weight="600" fill="#cbd5e1" text-anchor="middle">√3</text>
  <text x="222" y="352" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#cbd5e1" text-anchor="middle">2</text>
  <text x="205" y="520" font-family="monospace" font-size="25" font-weight="bold" fill="#10b981" text-anchor="middle">ratio 1 : √3 : 2</text>

  <!-- Right: 45-45-90, legs 155 px: A(520,430) right angle, B(675,430), C(520,275) -->
  <text x="597" y="118" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#cbd5e1" text-anchor="middle">45-45-90</text>
  <path d="M 520 430 L 675 430 L 520 275 Z" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 542 430 L 542 408 L 520 408" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="562" y="406" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#cbd5e1" text-anchor="middle">90°</text>
  <text x="632" y="410" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#facc15" text-anchor="middle">45°</text>
  <text x="556" y="302" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#facc15" text-anchor="middle">45°</text>
  <text x="492" y="360" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#cbd5e1" text-anchor="middle">1</text>
  <text x="597" y="468" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#cbd5e1" text-anchor="middle">1</text>
  <text x="622" y="336" font-family="monospace" font-size="24" font-weight="600" fill="#cbd5e1" text-anchor="middle">√2</text>
  <text x="597" y="520" font-family="monospace" font-size="25" font-weight="bold" fill="#10b981" text-anchor="middle">ratio 1 : 1 : √2</text>
</svg>
