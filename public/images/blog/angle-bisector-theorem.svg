<text x="600" y="87" text-anchor="middle" font-family="system-ui, sans-serif" font-size="42" font-weight="700" fill="#ffffff">The Bisector Splits the Side in Ratio</text>
<line x1="300.0" y1="500.0" x2="900.0" y2="500.0" stroke="#38bdf8" stroke-width="4"/><line x1="900.0" y1="500.0" x2="465.0" y2="180.0" stroke="#38bdf8" stroke-width="4"/><line x1="465.0" y1="180.0" x2="300.0" y2="500.0" stroke="#38bdf8" stroke-width="4"/><line x1="465.0" y1="180.0" x2="540.0" y2="500.0" stroke="#facc15" stroke-width="4"/><text x="465.0" y="166.0390648844769" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="600" fill="#ffffff">A</text><text x="286" y="538" text-anchor="end" font-family="system-ui, sans-serif" font-size="30" font-weight="600" fill="#ffffff">B</text><text x="914" y="538" text-anchor="start" font-family="system-ui, sans-serif" font-size="30" font-weight="600" fill="#ffffff">C</text><text x="540.0" y="538.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="600" fill="#ffffff">D</text><text x="352" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#facc15">AB = 6</text><text x="712" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#facc15">AC = 9</text><text x="420" y="545" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#facc15">BD = 4</text><text x="720" y="545" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#facc15">DC = 6</text><text x="600" y="581" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">BD / DC = 4 / 6 = 2 / 3 = 6 / 9 = AB / AC</text></svg>
