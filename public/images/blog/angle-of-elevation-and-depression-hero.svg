<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="600" y="62" font-family="system-ui, sans-serif" font-size="30" font-weight="500" fill="#94a3b8" text-anchor="middle">Both angles are measured from the horizontal</text>

  <!-- LEFT: elevation. Building x100-180 y200-480; eye E1(470,440); top T(180,200) -->
  <line x1="60" y1="480" x2="560" y2="480" stroke="#64748b" stroke-width="3"/>
  <rect x="100" y="200" width="80" height="280" fill="#334155" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="140" y="172" font-family="system-ui, sans-serif" font-size="24" font-weight="500" fill="#94a3b8" text-anchor="middle">building</text>
  <line x1="180" y1="200" x2="180" y2="440" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="470" y1="440" x2="180" y2="440" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="470" y1="440" x2="180" y2="200" stroke="#facc15" stroke-width="3"/>
  <circle cx="470" cy="440" r="6" fill="#facc15"/>
  <text x="488" y="447" font-family="system-ui, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">eye</text>
  <path d="M 426 440 A 44 44 0 0 1 436 412" fill="none" stroke="#facc15" stroke-width="2.5"/>
  <text x="398" y="424" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#facc15" text-anchor="middle">θ</text>
  <text x="310" y="545" font-family="monospace" font-size="27" font-weight="bold" fill="#10b981" text-anchor="middle">angle of elevation</text>

  <!-- RIGHT: depression. Tower x700-770 y170-480; eye E2(735,190); object G(1020,470) -->
  <line x1="640" y1="480" x2="1140" y2="480" stroke="#64748b" stroke-width="3"/>
  <rect x="700" y="170" width="70" height="310" fill="#334155" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="735" y="142" font-family="system-ui, sans-serif" font-size="24" font-weight="500" fill="#94a3b8" text-anchor="middle">tower</text>
  <line x1="735" y1="190" x2="1090" y2="190" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="1020" y1="190" x2="1020" y2="480" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="735" y1="190" x2="1020" y2="470" stroke="#facc15" stroke-width="3"/>
  <circle cx="735" cy="190" r="6" fill="#facc15"/>
  <text x="716" y="182" font-family="system-ui, sans-serif" font-size="24" font-weight="500" fill="#94a3b8" text-anchor="end">eye</text>
  <circle cx="1020" cy="470" r="7" fill="#facc15"/>
  <text x="1040" y="477" font-family="system-ui, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">object</text>
  <path d="M 781 190 A 46 46 0 0 1 768 222" fill="none" stroke="#facc15" stroke-width="2.5"/>
  <text x="808" y="226" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#facc15" text-anchor="middle">θ</text>
  <text x="890" y="545" font-family="monospace" font-size="27" font-weight="bold" fill="#10b981" text-anchor="middle">angle of depression</text>
</svg>
