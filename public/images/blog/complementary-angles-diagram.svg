<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <text x="600" y="75.0" font-family="system-ui, sans-serif" font-size="30" font-weight="500" fill="#94a3b8" text-anchor="middle">Complementary angles: the pair that makes 90°</text>

  <!-- A(320,470) B(880,470) C(320,147). Angle at B is a true 30 degrees, at C a true 60. -->
  <polygon points="320,470 880,470 320,147" fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-width="3.5" />
  <path d="M 320 438 L 352 438 L 352 470" fill="none" stroke="#cbd5e1" stroke-width="2.5" />
  <path d="M 820 470 A 60 60 0 0 1 828 440" fill="none" stroke="#facc15" stroke-width="2.5" />
  <path d="M 372 177 A 60 60 0 0 1 320 207" fill="none" stroke="#facc15" stroke-width="2.5" />

  <text x="772" y="452" font-family="system-ui, sans-serif" font-size="27" font-weight="700" fill="#facc15" text-anchor="middle">30°</text>
  <text x="360" y="242" font-family="system-ui, sans-serif" font-size="27" font-weight="700" fill="#facc15" text-anchor="middle">60°</text>

  <text x="600" y="581.0" font-family="monospace" font-size="27" font-weight="bold" fill="#10b981" text-anchor="middle">30° + 60° = 90°: the acute angles are complementary</text>
</svg>