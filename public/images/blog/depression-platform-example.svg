<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg4)" />
  <rect width="1200" height="630" fill="url(#grid4)" />
  <g transform="translate(94,0) scale(1.125)">

  <text x="450" y="66.0" font-family="system-ui, sans-serif" font-size="26" font-weight="500" fill="#94a3b8" text-anchor="middle">Angle of depression: the worked platform example</text>

  <!-- Drawn true: 6 px per metre. Platform x140-185, top y=150, ground y=450 (50 m = 300 px); eye E(185,150); object G(705,450): 86.60 m = 520 px -->
  <line x1="100" y1="450" x2="850" y2="450" stroke="#64748b" stroke-width="3" />
  <rect x="140" y="150" width="45" height="300" fill="#334155" stroke="#38bdf8" stroke-width="2.5" />
  <text x="104" y="306" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#cbd5e1" text-anchor="middle">50 m</text>
  <circle cx="185" cy="150" r="5" fill="#facc15" />
  <line x1="185" y1="150" x2="705" y2="150" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6" />
  <line x1="705" y1="150" x2="705" y2="450" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6" />
  <line x1="185" y1="150" x2="705" y2="450" stroke="#facc15" stroke-width="3" />
  <circle cx="705" cy="443" r="6" fill="#facc15" />

  <path d="M 235 150 A 50 50 0 0 1 228 175" fill="none" stroke="#facc15" stroke-width="2.5" />
  <text x="260" y="186" font-family="system-ui, sans-serif" font-size="25" font-weight="600" fill="#facc15" text-anchor="middle">30°</text>

  <path d="M 705 400 A 50 50 0 0 0 662 425" fill="none" stroke="#facc15" stroke-width="2.5" />
  <text x="652" y="418" font-family="system-ui, sans-serif" font-size="25" font-weight="600" fill="#facc15" text-anchor="end">30°</text>

  <text x="445" y="486" font-family="monospace" font-size="24" font-weight="600" fill="#cbd5e1" text-anchor="middle">horizontal distance 86.60 m</text>
  <text x="450" y="532" font-family="monospace" font-size="25" font-weight="bold" fill="#10b981" text-anchor="middle">d = 50 / tan 30° = 86.60 m</text>
  </g>
</svg>