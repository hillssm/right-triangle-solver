<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <text x="600" y="77.0" font-family="system-ui, sans-serif" font-size="32" font-weight="500" fill="#94a3b8" text-anchor="middle">Find the missing side of a right triangle</text>

  <!-- 6-8-10 at 55 px per unit. A(380,470) B(820,470) C(380,140) -->
  <polygon points="380,470 820,470 380,140" fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-width="3.5" />
  <path d="M 380 440 L 410 440 L 410 470" fill="none" stroke="#cbd5e1" stroke-width="2.5" />

  <text x="348" y="314" font-family="system-ui, sans-serif" font-size="30" font-weight="600" fill="#cbd5e1" text-anchor="middle">6</text>
  <text x="600" y="512" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#facc15" text-anchor="middle">?</text>
  <text x="622" y="280" font-family="system-ui, sans-serif" font-size="30" font-weight="600" fill="#cbd5e1" text-anchor="middle">10</text>

  <text x="600" y="581.0" font-family="monospace" font-size="28" font-weight="bold" fill="#10b981" text-anchor="middle">6² + b² = 10², so b = 8</text>
</svg>