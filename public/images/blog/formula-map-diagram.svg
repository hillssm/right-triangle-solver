<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <text x="600" y="75.0" font-family="system-ui, sans-serif" font-size="30" font-weight="500" fill="#94a3b8" text-anchor="middle">Three formulas on one triangle</text>

  <!-- 6-8-10 at 46 px per unit. A(430,470) B(798,470) C(430,194) -->
  <polygon points="430,470 798,470 430,194" fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-width="3.5" />
  <path d="M 430 438 L 462 438 L 462 470" fill="none" stroke="#cbd5e1" stroke-width="2.5" />

  <text x="396" y="340" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#cbd5e1" text-anchor="middle">6</text>
  <text x="614" y="512" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#cbd5e1" text-anchor="middle">8</text>
  <text x="630" y="318" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#cbd5e1" text-anchor="middle">10</text>

  <line x1="368" y1="288" x2="424" y2="330" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" />
  <line x1="838" y1="200" x2="692" y2="252" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" />
  <line x1="838" y1="442" x2="806" y2="462" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" />

  <rect x="48" y="246" width="320" height="84" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <text x="208" y="282" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#cbd5e1" text-anchor="middle">Perimeter</text>
  <text x="208" y="314" font-family="monospace" font-size="23" font-weight="bold" fill="#38bdf8" text-anchor="middle">= 6 + 8 + 10 = 24</text>

  <rect x="838" y="150" width="320" height="84" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <text x="998" y="186" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#cbd5e1" text-anchor="middle">Pythagoras</text>
  <text x="998" y="218" font-family="monospace" font-size="23" font-weight="bold" fill="#38bdf8" text-anchor="middle">6² + 8² = 10²</text>

  <rect x="838" y="400" width="320" height="84" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <text x="998" y="436" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#cbd5e1" text-anchor="middle">Area</text>
  <text x="998" y="468" font-family="monospace" font-size="23" font-weight="bold" fill="#38bdf8" text-anchor="middle">= (6 × 8) ÷ 2 = 24</text>

  <text x="600" y="581.0" font-family="monospace" font-size="26" font-weight="bold" fill="#10b981" text-anchor="middle">perimeter adds, area halves a product, Pythagoras squares</text>
</svg>