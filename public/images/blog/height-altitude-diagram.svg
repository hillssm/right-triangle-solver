<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="600" y="62" font-family="system-ui, sans-serif" font-size="30" font-weight="500" fill="#94a3b8" text-anchor="middle">Height measured to the hypotenuse</text>

  <!-- A(250,150) right angle, B(950,470), C(250,470). Altitude from C to hypotenuse AB, foot (371,205) -->
  <polygon points="250,150 950,470 250,470" fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-width="3.5"/>
  <path d="M 250 182 L 282 182 L 282 150" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
  <line x1="250" y1="470" x2="371" y2="205" stroke="#facc15" stroke-width="3" stroke-dasharray="10 7"/>

  <text x="214" y="318" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">a</text>
  <text x="600" y="512" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">b</text>
  <text x="618" y="290" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">c</text>
  <text x="330" y="352" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#facc15" text-anchor="middle">h</text>

  <text x="600" y="582" font-family="monospace" font-size="28" font-weight="bold" fill="#10b981" text-anchor="middle">altitude to the hypotenuse: h = (a × b) ÷ c</text>
</svg>
