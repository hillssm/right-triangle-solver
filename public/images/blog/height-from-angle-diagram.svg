<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="600" y="62" font-family="system-ui, sans-serif" font-size="30" font-weight="500" fill="#94a3b8" text-anchor="middle">Height from an angle and one side</text>

  <!-- Adjacent 10 at 45 px per unit = 450. Height 10 x tan40 = 8.39 units = 377 px. A(375,480) B(825,480) C(375,103) -->
  <polygon points="375,480 825,480 375,103" fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-width="3.5"/>
  <path d="M 375 448 L 407 448 L 407 480" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
  <path d="M 769 480 A 56 56 0 0 1 782 444" fill="none" stroke="#facc15" stroke-width="2.5"/>

  <text x="356" y="298" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#facc15" text-anchor="end">h = ?</text>
  <text x="600" y="522" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">10</text>
  <text x="736" y="460" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#facc15" text-anchor="middle">40°</text>

  <text x="600" y="582" font-family="monospace" font-size="28" font-weight="bold" fill="#10b981" text-anchor="middle">h = 10 × tan 40° ≈ 8.39</text>
</svg>
