<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Right Triangle with Altitude -->
  <g transform="translate(600, 150)">
    <path d="M -200 250 L 200 250 L 200 -50 Z" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="6" stroke-linejoin="round"/>
    <!-- Right Angle Square -->
    <path d="M 160 250 L 160 210 L 200 210" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <!-- Altitude (dashed) from right angle to hypotenuse -->
    <line x1="200" y1="250" x2="56" y2="58" stroke="#facc15" stroke-width="5" stroke-dasharray="14 10"/>
    <!-- Right angle marker at foot of altitude -->
    <path d="M 66 78 L 48 70 L 56 52" fill="none" stroke="#facc15" stroke-width="3"/>
    <!-- Labels -->
    <text x="0" y="290" font-family="system-ui, sans-serif" font-size="32" font-weight="600" fill="#cbd5e1" text-anchor="middle">Leg (a)</text>
    <text x="230" y="120" font-family="system-ui, sans-serif" font-size="32" font-weight="600" fill="#cbd5e1" text-anchor="start">Leg (b)</text>
    <text x="87" y="170" font-family="system-ui, sans-serif" font-size="30" font-weight="bold" fill="#facc15" text-anchor="middle" transform="rotate(-127, 87, 170)">Altitude (h)</text>
    <text x="-53" y="180" font-family="system-ui, sans-serif" font-size="30" font-weight="600" fill="#94a3b8" text-anchor="middle">q</text>
    <text x="170" y="30" font-family="system-ui, sans-serif" font-size="30" font-weight="600" fill="#94a3b8" text-anchor="middle">p</text>
  </g>

  <!-- Text Overlay -->
  <text x="80" y="180" font-family="system-ui, sans-serif" font-size="32" font-weight="500" fill="#94a3b8">Altitude from Any Known Values</text>

  <!-- Formula Box -->
  <rect x="80" y="240" width="350" height="120" rx="16" fill="rgba(255,255,255,0.05)" stroke="#475569" stroke-width="2"/>
  <text x="255" y="313" font-family="monospace" font-size="36" font-weight="bold" fill="#10b981" text-anchor="middle">h = (a × b) / c</text>
</svg>
