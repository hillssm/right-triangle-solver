<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="600" y="62" font-family="system-ui, sans-serif" font-size="32" font-weight="500" fill="#94a3b8" text-anchor="middle">Find the height of a right triangle</text>

  <!-- A(350,480) B(950,480) C(350,150). The vertical leg is the height. -->
  <polygon points="350,480 950,480 350,150" fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-width="3.5"/>
  <line x1="350" y1="150" x2="350" y2="480" stroke="#facc15" stroke-width="5"/>
  <path d="M 350 450 L 380 450 L 380 480" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>

  <text x="334" y="322" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#facc15" text-anchor="end">height = ?</text>
  <text x="650" y="522" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">base = 10</text>
  <text x="706" y="290" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">Area = 30</text>

  <text x="600" y="582" font-family="monospace" font-size="28" font-weight="bold" fill="#10b981" text-anchor="middle">height = 2 × Area ÷ base = 2 × 30 ÷ 10 = 6</text>
</svg>
