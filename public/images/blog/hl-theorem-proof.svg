<text x="600" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">Given: AB = DE and AC = DF, with right angles at C and F</text><polygon points="140,500 560,500 140,325" fill="rgba(56,189,248,0.10)" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round"/><polygon points="1060,500 640,500 1060,325" fill="rgba(56,189,248,0.10)" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round"/><path d="M 160,500 L 160,480 L 140,480" fill="none" stroke="#facc15" stroke-width="3"/><path d="M 1040,500 L 1040,480 L 1060,480" fill="none" stroke="#facc15" stroke-width="3"/><line x1="349.8" y1="403.8" x2="343.7" y2="418.5" stroke="#facc15" stroke-width="3"/><line x1="356.3" y1="406.5" x2="350.2" y2="421.2" stroke="#facc15" stroke-width="3"/><line x1="856.3" y1="418.5" x2="850.2" y2="403.8" stroke="#facc15" stroke-width="3"/><line x1="849.8" y1="421.2" x2="843.7" y2="406.5" stroke="#facc15" stroke-width="3"/><line x1="132.0" y1="412.5" x2="148.0" y2="412.5" stroke="#facc15" stroke-width="3"/><line x1="1052.0" y1="412.5" x2="1068.0" y2="412.5" stroke="#facc15" stroke-width="3"/><text x="350" y="545" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#ffffff">Triangle ABC</text><text x="850" y="545" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#ffffff">Triangle DEF</text><text x="600" y="581" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="400" fill="#facc15">Same hypotenuse, same leg: the third side must match too</text></svg>
