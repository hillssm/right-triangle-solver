<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <text x="600" y="75.0" font-family="system-ui, sans-serif" font-size="30" font-weight="500" fill="#94a3b8" text-anchor="middle">The 45-45-90 triangle: equal legs, equal angles</text>

  <!-- Legs 7 at 52 px per unit. A(330,470) B(694,470) C(330,106) -->
  <polygon points="330,470 694,470 330,106" fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-width="3.5" />
  <path d="M 330 438 L 362 438 L 362 470" fill="none" stroke="#cbd5e1" stroke-width="2.5" />
  <line x1="318" y1="288" x2="342" y2="288" stroke="#facc15" stroke-width="3" />
  <line x1="512" y1="458" x2="512" y2="482" stroke="#facc15" stroke-width="3" />
  <path d="M 640 470 A 54 54 0 0 1 656 432" fill="none" stroke="#facc15" stroke-width="2.5" />
  <path d="M 368 144 A 54 54 0 0 1 330 160" fill="none" stroke="#facc15" stroke-width="2.5" />

  <text x="294" y="296" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">7</text>
  <text x="512" y="512" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">7</text>
  <text x="548" y="240" font-family="monospace" font-size="29" font-weight="bold" fill="#facc15" text-anchor="middle">7√2</text>
  <text x="604" y="450" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#facc15" text-anchor="middle">45°</text>
  <text x="358" y="212" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#facc15">45°</text>

  <text x="600" y="581.0" font-family="monospace" font-size="28" font-weight="bold" fill="#10b981" text-anchor="middle">hypotenuse = 7 × √2 ≈ 9.90</text>
</svg>