<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="600" y="62" font-family="system-ui, sans-serif" font-size="30" font-weight="500" fill="#94a3b8" text-anchor="middle">Two equal legs and two equal angles of 45°</text>

  <!-- Isosceles right triangle, drawn to scale: legs 400 and 400, hypotenuse 565.7 -->
  <path d="M 360 470 L 760 470 L 360 70 Z" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>

  <!-- Right-angle marker at (360,470) -->
  <path d="M 392 470 L 392 438 L 360 438" fill="none" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Equal-length tick marks on both legs -->
  <path d="M 346 270 L 374 270" stroke="#facc15" stroke-width="3"/>
  <path d="M 560 456 L 560 484" stroke="#facc15" stroke-width="3"/>

  <!-- 45-degree arcs -->
  <path d="M 690 470 A 70 70 0 0 1 711 421" fill="none" stroke="#facc15" stroke-width="3"/>
  <path d="M 360 140 A 70 70 0 0 0 410 120" fill="none" stroke="#facc15" stroke-width="3"/>

  <!-- Angle labels -->
  <text x="420" y="440" font-family="system-ui, sans-serif" font-size="30" font-weight="600" fill="#cbd5e1" text-anchor="middle">90°</text>
  <text x="664" y="436" font-family="system-ui, sans-serif" font-size="30" font-weight="600" fill="#facc15" text-anchor="middle">45°</text>
  <text x="422" y="182" font-family="system-ui, sans-serif" font-size="30" font-weight="600" fill="#facc15" text-anchor="middle">45°</text>

  <!-- Side labels -->
  <text x="290" y="278" font-family="system-ui, sans-serif" font-size="32" font-weight="600" fill="#cbd5e1" text-anchor="middle">leg s</text>
  <text x="560" y="520" font-family="system-ui, sans-serif" font-size="32" font-weight="600" fill="#cbd5e1" text-anchor="middle">leg s</text>
  <text x="592" y="240" font-family="system-ui, sans-serif" font-size="32" font-weight="600" fill="#cbd5e1" text-anchor="middle">s√2</text>

  <text x="600" y="592" font-family="monospace" font-size="36" font-weight="bold" fill="#10b981" text-anchor="middle">hypotenuse = s × √2</text>
</svg>
