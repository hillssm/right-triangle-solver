<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid2" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg2)"/>
  <rect width="1200" height="630" fill="url(#grid2)"/>
  <text x="600" y="58" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">The midpoint splits the segment in half</text>
  <line x1="100" y1="520" x2="1120" y2="520" stroke="#64748b" stroke-width="2"/>
  <line x1="180" y1="560" x2="180" y2="60" stroke="#64748b" stroke-width="2"/>
  <polygon points="1120,520 1104,512 1104,528" fill="#64748b"/>
  <polygon points="180,60 172,76 188,76" fill="#64748b"/>
  <line x1="260" y1="360" x2="580" y2="120" stroke="#38bdf8" stroke-width="3.5"/>
  <line x1="260" y1="360" x2="420" y2="240" stroke="#facc15" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="260" cy="360" r="11" fill="#38bdf8"/>
  <circle cx="580" cy="120" r="11" fill="#38bdf8"/>
  <circle cx="420" cy="240" r="13" fill="#facc15"/>
  <text x="260" y="402" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#38bdf8" text-anchor="middle">A(1, 2)</text>
  <text x="580" y="92" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#38bdf8" text-anchor="middle">B(5, 5)</text>
  <text x="420" y="206" font-family="system-ui, sans-serif" font-size="27" font-weight="700" fill="#facc15" text-anchor="middle">M(3, 3.5)</text>
  <text x="330" y="268" font-family="system-ui, sans-serif" font-size="25" font-weight="600" fill="#facc15" text-anchor="middle">AM = 2.5</text>
  <text x="512" y="148" font-family="system-ui, sans-serif" font-size="25" font-weight="600" fill="#facc15" text-anchor="middle">MB = 2.5</text>
  <text x="600" y="600" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">Both halves measure 2.5, so M is the true midpoint</text>
</svg>
