<text x="385.0" y="375.0" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">b</text>
<text x="600.0" y="535.0" font-family="system-ui, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">(a + b)² = 4(ab/2) + c²</text>
<text x="600.0" y="570.0" font-family="system-ui, sans-serif" font-size="22" fill="#facc15" text-anchor="middle" font-weight="normal">so a² + 2ab + b² = 2ab + c², and a² + b² = c²</text>
