<text x="600.0" y="71.0" font-family="system-ui, sans-serif" font-size="26" fill="#facc15" text-anchor="middle" font-weight="bold">Proof by Similar Triangles</text>
<polyline points="250.0,470.0 810.0,410.0 450.0,170.0 250.0,470.0" stroke="#ffffff" stroke-width="4" fill="none" />
<line x1="450.0" y1="170.0" x2="479.5" y2="445.4" stroke="#facc15" stroke-width="3" stroke-dasharray="8 6" />
