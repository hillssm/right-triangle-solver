<text x="235.0" y="500.0" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text>
<text x="830.0" y="420.0" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">B</text>
<text x="450.0" y="155.0" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">C</text>
<text x="479.5" y="475.4" font-family="system-ui, sans-serif" font-size="22" fill="#facc15" text-anchor="middle" font-weight="bold">D</text>
<text x="320.0" y="300.0" font-family="system-ui, sans-serif" font-size="26" fill="#38bdf8" text-anchor="middle" font-weight="bold">b</text>
<text x="650.0" y="250.0" font-family="system-ui, sans-serif" font-size="26" fill="#4ade80" text-anchor="middle" font-weight="bold">a</text>
<text x="560.0" y="470.0" font-family="system-ui, sans-serif" font-size="26" fill="#facc15" text-anchor="middle" font-weight="bold">c</text>
<text x="700.0" y="395.0" font-family="system-ui, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">m</text>
<text x="400.0" y="420.0" font-family="system-ui, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">n</text>
<text x="600.0" y="540.0" font-family="system-ui, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">a² = cm  and  b² = cn,  so a² + b² = c(m + n) = c²</text>
