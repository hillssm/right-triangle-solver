<text x="600" y="90" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">Deriving the 3D formula in three steps</text><line x1="210" y1="330" x2="345" y2="408" stroke="#38bdf8" stroke-width="2.5"/><line x1="210" y1="330" x2="120" y2="382" stroke="#38bdf8" stroke-width="2.5"/><line x1="210" y1="330" x2="210" y2="226" stroke="#38bdf8" stroke-width="2.5"/><line x1="345" y1="408" x2="255" y2="460" stroke="#38bdf8" stroke-width="2.5"/><line x1="120" y1="382" x2="255" y2="460" stroke="#38bdf8" stroke-width="2.5"/><line x1="345" y1="408" x2="345" y2="304" stroke="#38bdf8" stroke-width="2.5"/><line x1="210" y1="226" x2="345" y2="304" stroke="#38bdf8" stroke-width="2.5"/><line x1="120" y1="382" x2="120" y2="278" stroke="#38bdf8" stroke-width="2.5"/><line x1="210" y1="226" x2="120" y2="278" stroke="#38bdf8" stroke-width="2.5"/><line x1="255" y1="460" x2="255" y2="356" stroke="#38bdf8" stroke-width="2.5"/><line x1="345" y1="304" x2="255" y2="356" stroke="#38bdf8" stroke-width="2.5"/><line x1="120" y1="278" x2="255" y2="356" stroke="#38bdf8" stroke-width="2.5"/><line x1="210" y1="330" x2="345" y2="408" stroke="#4ade80" stroke-width="3.5"/><line x1="345" y1="408" x2="255" y2="460" stroke="#4ade80" stroke-width="3.5"/><line x1="255" y1="460" x2="120" y2="382" stroke="#4ade80" stroke-width="3.5"/><line x1="120" y1="382" x2="210" y2="330" stroke="#4ade80" stroke-width="3.5"/><text x="210" y="500" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1. The rectangular base</text><polygon points="470,280 620,280 620,390 470,390" fill="none" stroke="#38bdf8" stroke-width="3"/><line x1="470" y1="280" x2="620" y2="390" stroke="#4ade80" stroke-width="3" stroke-dasharray="8 6"/><text x="545" y="266" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">l</text><text x="454" y="335" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">w</text><text x="575" y="323" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#4ade80" text-anchor="middle">f</text><text x="545" y="500" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2. Face diagonal: f² = l² + w²</text><polygon points="830,420 1000,420 1000,290" fill="none" stroke="#38bdf8" stroke-width="3"/><path d="M 978 420 L 978 398 L 1000 398" fill="none" stroke="#94a3b8" stroke-width="2"/><line x1="830" y1="420" x2="1000" y2="290" stroke="#facc15" stroke-width="3.5"/><text x="915" y="450" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">f</text><text x="1024" y="355" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">h</text><text x="949" y="341" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#facc15" text-anchor="middle">d</text><text x="915" y="500" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3. Space diagonal: d² = f² + h²</text></svg>