<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with slight gradient -->
  <rect width="1200" height="600" fill="#131313"/>
  <rect width="1200" height="600" fill="url(#paint0_radial)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e9c176" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="600" fill="url(#grid)" />
  </g>

  <!-- Glowing Effect for the Triangle -->
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="15" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  <g filter="url(#glow)">
    <!-- Right Triangle -->
    <path d="M 400 450 L 400 150 L 800 450 Z" fill="rgba(233, 193, 118, 0.05)" stroke="#f1c97d" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Right Angle Square -->
    <path d="M 400 410 L 440 410 L 440 450" fill="none" stroke="#f1c97d" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Labels -->
  <!-- Leg a -->
  <text x="350" y="310" fill="#e5e2e1" font-family="'Noto Serif', Georgia, serif" font-size="42" font-style="italic" font-weight="bold">a</text>
  
  <!-- Leg b -->
  <text x="600" y="510" fill="#e5e2e1" font-family="'Noto Serif', Georgia, serif" font-size="42" font-style="italic" font-weight="bold">b</text>
  
  <!-- Hypotenuse c -->
  <text x="620" y="280" fill="#f1c97d" font-family="'Noto Serif', Georgia, serif" font-size="56" font-style="italic" font-weight="bold">c</text>

  <!-- Formula Highlight -->
  <g transform="translate(100, 100)">
    <rect width="320" height="100" rx="15" fill="#201f1f" stroke="#4d4635" stroke-width="2" />
    <text x="160" y="65" fill="#f1c97d" font-family="'Noto Serif', Georgia, serif" font-size="48" font-style="italic" font-weight="bold" text-anchor="middle">a² + b² = c²</text>
  </g>

  <defs>
    <radialGradient id="paint0_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 300) rotate(90) scale(400 800)">
      <stop stop-color="#2a2a2a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#131313" stop-opacity="1"/>
    </radialGradient>
  </defs>
</svg>
