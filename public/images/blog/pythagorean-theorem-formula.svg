<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="600" y="62" font-family="system-ui, sans-serif" font-size="32" font-weight="500" fill="#94a3b8" text-anchor="middle">The Pythagorean theorem</text>

  <!-- 3-4-5 at 80 px per unit. A(430,440) B(750,440) C(430,200) -->
  <polygon points="430,440 750,440 430,200" fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-width="3.5"/>
  <path d="M 430 410 L 460 410 L 460 440" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>

  <text x="392" y="330" font-family="system-ui, sans-serif" font-size="30" font-weight="600" fill="#cbd5e1" text-anchor="middle">a = 3</text>
  <text x="590" y="482" font-family="system-ui, sans-serif" font-size="30" font-weight="600" fill="#cbd5e1" text-anchor="middle">b = 4</text>
  <text x="612" y="290" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#facc15" text-anchor="middle">c = 5</text>

  <rect x="196" y="272" width="118" height="52" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="255" y="308" font-family="monospace" font-size="26" font-weight="bold" fill="#38bdf8" text-anchor="middle">a² = 9</text>
  <rect x="806" y="150" width="128" height="52" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="2"/>
  <text x="870" y="186" font-family="monospace" font-size="26" font-weight="bold" fill="#facc15" text-anchor="middle">c² = 25</text>
  <rect x="820" y="430" width="128" height="52" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="884" y="466" font-family="monospace" font-size="26" font-weight="bold" fill="#38bdf8" text-anchor="middle">b² = 16</text>

  <text x="600" y="582" font-family="monospace" font-size="30" font-weight="bold" fill="#10b981" text-anchor="middle">a² + b² = c²: 9 + 16 = 25</text>
</svg>
