  <text x="362" y="510" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#38bdf8" text-anchor="middle">3² = 9</text>
  <text x="170" y="318" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#38bdf8" text-anchor="middle">4² = 16</text>
  <text x="472" y="235" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#facc15" text-anchor="middle">5² = 25</text>
  <text x="600" y="615" font-family="system-ui, sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle">9 + 16 = 25, so a² + b² = c²</text>
