<svg width="900" height="560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="900" height="560" fill="url(#bg2)"/>
  <rect width="900" height="560" fill="url(#grid2)"/>

  <text x="450" y="52" font-family="system-ui, sans-serif" font-size="26" font-weight="500" fill="#94a3b8" text-anchor="middle">Find the right angle first: the side facing it is the hypotenuse</text>

  <!-- 6-8-10 proportions at 40 px/unit: A(300,430) right angle, B(300,190) top, C(620,430); legs 240/320, hyp 400 -->
  <path d="M 300 430 L 620 430 L 300 190 Z" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 326 430 L 326 404 L 300 404" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="352" y="408" font-family="system-ui, sans-serif" font-size="25" font-weight="600" fill="#cbd5e1" text-anchor="middle">90°</text>

  <text x="212" y="318" font-family="system-ui, sans-serif" font-size="27" font-weight="600" fill="#cbd5e1" text-anchor="middle">leg b</text>
  <text x="460" y="474" font-family="system-ui, sans-serif" font-size="27" font-weight="600" fill="#cbd5e1" text-anchor="middle">leg a</text>
  <text x="508" y="272" font-family="system-ui, sans-serif" font-size="27" font-weight="600" fill="#facc15" text-anchor="middle">hypotenuse c</text>

  <text x="450" y="528" font-family="monospace" font-size="27" font-weight="bold" fill="#10b981" text-anchor="middle">the legs form the right angle; c faces it</text>
</svg>
