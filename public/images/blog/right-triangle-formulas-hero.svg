<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="600" y="62" font-family="system-ui, sans-serif" font-size="30" font-weight="500" fill="#94a3b8" text-anchor="middle">Every formula starts with the 3-4-5 triangle</text>

  <!-- 3-4-5 triangle drawn to scale (1 unit = 120 px): A(300,470) right angle, B(780,470), C(300,110) -->
  <path d="M 300 470 L 780 470 L 300 110 Z" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>

  <!-- Right-angle marker at A -->
  <path d="M 332 470 L 332 438 L 300 438" fill="none" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Angle arcs: B = 36.87 degrees, C = 53.13 degrees -->
  <path d="M 710 470 A 70 70 0 0 1 724 428" fill="none" stroke="#facc15" stroke-width="3"/>
  <path d="M 300 180 A 70 70 0 0 0 356 152" fill="none" stroke="#facc15" stroke-width="3"/>

  <!-- Angle labels -->
  <text x="352" y="440" font-family="system-ui, sans-serif" font-size="30" font-weight="600" fill="#cbd5e1" text-anchor="middle">90°</text>
  <text x="668" y="448" font-family="system-ui, sans-serif" font-size="30" font-weight="600" fill="#facc15" text-anchor="middle">36.87°</text>
  <text x="352" y="208" font-family="system-ui, sans-serif" font-size="30" font-weight="600" fill="#facc15" text-anchor="middle">53.13°</text>

  <!-- Side labels -->
  <text x="228" y="298" font-family="system-ui, sans-serif" font-size="34" font-weight="600" fill="#cbd5e1" text-anchor="middle">a = 3</text>
  <text x="540" y="522" font-family="system-ui, sans-serif" font-size="34" font-weight="600" fill="#cbd5e1" text-anchor="middle">b = 4</text>
  <text x="575" y="248" font-family="system-ui, sans-serif" font-size="34" font-weight="600" fill="#cbd5e1" text-anchor="middle">c = 5</text>

  <text x="600" y="592" font-family="monospace" font-size="38" font-weight="bold" fill="#10b981" text-anchor="middle">a² + b² = c²</text>
</svg>
