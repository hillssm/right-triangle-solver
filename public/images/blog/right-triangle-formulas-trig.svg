<svg width="900" height="560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="900" height="560" fill="url(#bg2)"/>
  <rect width="900" height="560" fill="url(#grid2)"/>

  <text x="450" y="52" font-family="system-ui, sans-serif" font-size="26" font-weight="500" fill="#94a3b8" text-anchor="middle">Opposite and adjacent are named from angle θ</text>

  <!-- Triangle: A(180,440) right angle, B(720,440) angle theta, C(180,140) -->
  <path d="M 180 440 L 720 440 L 180 140 Z" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>

  <!-- Right-angle marker at A -->
  <path d="M 210 440 L 210 410 L 180 410" fill="none" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Theta arc at B -->
  <path d="M 640 440 A 80 80 0 0 0 650 401" fill="none" stroke="#facc15" stroke-width="3"/>
  <text x="606" y="420" font-family="system-ui, sans-serif" font-size="30" font-weight="600" fill="#facc15" text-anchor="middle">θ</text>

  <!-- Side labels -->
  <text x="92" y="298" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#cbd5e1" text-anchor="middle">opposite</text>
  <text x="450" y="488" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#cbd5e1" text-anchor="middle">adjacent</text>
  <text x="478" y="248" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#cbd5e1" text-anchor="middle">hypotenuse</text>
</svg>
