<svg width="900" height="560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="900" height="560" fill="url(#bg3)"/>
  <rect width="900" height="560" fill="url(#grid3)"/>

  <text x="450" y="52" font-family="system-ui, sans-serif" font-size="26" font-weight="500" fill="#94a3b8" text-anchor="middle">Worked example: legs 6 and 8, find the hypotenuse</text>

  <!-- 6-8-10 to scale, 26 px per unit: A(240,430) right angle, top(240,274), right(448,430); legs 156/208, hyp 260 -->
  <path d="M 240 430 L 448 430 L 240 274 Z" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 264 430 L 264 406 L 240 406" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="292" y="410" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#cbd5e1" text-anchor="middle">90°</text>

  <text x="204" y="360" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">6</text>
  <text x="344" y="472" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">8</text>
  <text x="380" y="332" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">10</text>

  <text x="450" y="528" font-family="monospace" font-size="27" font-weight="bold" fill="#10b981" text-anchor="middle">c = √(6² + 8²) = √100 = 10</text>
</svg>
