<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <text x="600" y="75.0" font-family="system-ui, sans-serif" font-size="30" font-weight="500" fill="#94a3b8" text-anchor="middle">A ladder is a hypotenuse you can climb</text>
  <line x1="100" y1="500" x2="760" y2="500" stroke="#64748b" stroke-width="3" />
  <rect x="182" y="150" width="28" height="350" fill="#334155" stroke="#38bdf8" stroke-width="2.5" />
  <line x1="210" y1="212" x2="426" y2="500" stroke="#facc15" stroke-width="5" />
  <line x1="236" y1="272" x2="262" y2="256" stroke="#facc15" stroke-width="3" />
  <line x1="279" y1="329" x2="305" y2="313" stroke="#facc15" stroke-width="3" />
  <line x1="322" y1="387" x2="348" y2="371" stroke="#facc15" stroke-width="3" />
  <line x1="365" y1="445" x2="391" y2="429" stroke="#facc15" stroke-width="3" />
  <path d="M 228 500 L 228 518 L 210 518" fill="none" stroke="#facc15" stroke-width="2.5" />
  <text x="160" y="330" font-family="system-ui, sans-serif" font-size="25" font-weight="600" fill="#38bdf8" text-anchor="end">height = 8 ft</text>
  <text x="318" y="534" font-family="system-ui, sans-serif" font-size="25" font-weight="600" fill="#38bdf8" text-anchor="middle">base = 6 ft</text>
  <text x="352" y="330" font-family="system-ui, sans-serif" font-size="25" font-weight="600" fill="#facc15" text-anchor="start">ladder (hypotenuse) = 10 ft</text>
  <text x="880" y="300" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#e2e8f0" text-anchor="middle">The wall is one leg.</text>
  <text x="880" y="344" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#e2e8f0" text-anchor="middle">The ground is the other leg.</text>
  <text x="880" y="388" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#e2e8f0" text-anchor="middle">The ladder joins their ends,</text>
  <text x="880" y="432" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#e2e8f0" text-anchor="middle">so it must be the hypotenuse.</text>
  <text x="600" y="581.0" font-family="monospace" font-size="26" font-weight="bold" fill="#10b981" text-anchor="middle">height = √(10² − 6²) = √64 = 8 ft</text>
</svg>