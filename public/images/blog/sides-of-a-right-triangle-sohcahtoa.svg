<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <text x="600" y="75.0" font-family="system-ui, sans-serif" font-size="30" font-weight="500" fill="#94a3b8" text-anchor="middle">SOH CAH TOA: ratios built from the three side names</text>
  <polygon points="220,480 480,480 220,330" fill="none" stroke="#38bdf8" stroke-width="3.5" />
  <path d="M 238 480 L 238 498 L 220 498" fill="none" stroke="#facc15" stroke-width="2.5" />
  <path d="M 434 480 A 46 46 0 0 1 448 448" fill="none" stroke="#facc15" stroke-width="2.5" />
  <text x="408" y="458" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#facc15" text-anchor="end">θ = 30°</text>
  <text x="192" y="412" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#38bdf8" text-anchor="end">opp = 5</text>
  <text x="350" y="516" font-family="monospace" font-size="24" font-weight="600" fill="#38bdf8" text-anchor="middle">adj ≈ 8.66</text>
  <text x="392" y="382" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#facc15" text-anchor="middle">hyp = 10</text>
  <text x="600" y="300" font-family="system-ui, sans-serif" font-size="27" font-weight="600" fill="#e2e8f0" text-anchor="start">sin θ = opp / hyp = 5 / 10 = 0.5</text>
  <text x="580.1" y="352" font-family="monospace" font-size="27" font-weight="600" fill="#e2e8f0" text-anchor="start">cos θ = adj / hyp ≈ 8.66 / 10 ≈ 0.866</text>
  <text x="596.2" y="404" font-family="monospace" font-size="27" font-weight="600" fill="#e2e8f0" text-anchor="start">tan θ = opp / adj ≈ 5 / 8.66 ≈ 0.577</text>
  <text x="600" y="581.0" font-family="monospace" font-size="26" font-weight="bold" fill="#10b981" text-anchor="middle">SOH · CAH · TOA</text>
</svg>