<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="600" y="62" font-family="system-ui, sans-serif" font-size="32" font-weight="500" fill="#94a3b8" text-anchor="middle">Sine, cosine, tangent: the three ratios</text>

  <!-- A(300,480) B(900,480) C(300,180). Angle theta at B; opposite = vertical leg. -->
  <polygon points="300,480 900,480 300,180" fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-width="3.5"/>
  <path d="M 300 450 L 330 450 L 330 480" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
  <path d="M 830 480 A 70 70 0 0 0 837 449" fill="none" stroke="#facc15" stroke-width="2.5"/>

  <text x="282" y="338" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="end">Opposite</text>
  <text x="600" y="522" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">Adjacent</text>
  <text x="600" y="298" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">Hypotenuse</text>
  <text x="792" y="460" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#facc15" text-anchor="middle">θ</text>

  <text x="600" y="582" font-family="monospace" font-size="28" font-weight="bold" fill="#10b981" text-anchor="middle">SOH CAH TOA: sin = O/H, cos = A/H, tan = O/A</text>
</svg>
