<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg2)"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#334155" stroke-width="2"/>
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#334155" stroke-width="2"/>
  <text x="300" y="50" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">Positive slope</text>
  <line x1="120" y1="250" x2="480" y2="70" stroke="#38bdf8" stroke-width="3.5"/>
  <text x="300" y="290" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#38bdf8" text-anchor="middle">m &gt; 0, rises left to right</text>
  <text x="900" y="50" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">Negative slope</text>
  <line x1="720" y1="70" x2="1080" y2="250" stroke="#f87171" stroke-width="3.5"/>
  <text x="900" y="290" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#f87171" text-anchor="middle">m &lt; 0, falls left to right</text>
  <text x="300" y="365" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">Zero slope</text>
  <line x1="120" y1="470" x2="480" y2="470" stroke="#4ade80" stroke-width="3.5"/>
  <text x="300" y="530" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#4ade80" text-anchor="middle">m = 0, horizontal line</text>
  <text x="900" y="365" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">Undefined slope</text>
  <line x1="900" y1="400" x2="900" y2="560" stroke="#facc15" stroke-width="3.5"/>
  <text x="900" y="600" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#facc15" text-anchor="middle">undefined, vertical line</text>
</svg>
