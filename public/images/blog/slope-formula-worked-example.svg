  <text x="445" y="310" font-family="system-ui, sans-serif" font-size="25" font-weight="600" fill="#facc15" text-anchor="start">rise = 3</text>
  <text x="600" y="581.0" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">Slope = rise / run = 3 / 3 = 1</text>
