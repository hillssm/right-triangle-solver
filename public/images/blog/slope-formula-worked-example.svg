  <text x="172" y="52" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#94a3b8">y</text>
  <line x1="240" y1="400" x2="420" y2="400" stroke="#facc15" stroke-width="2" stroke-dasharray="8 6" />
  <line x1="420" y1="400" x2="420" y2="220" stroke="#facc15" stroke-width="2" stroke-dasharray="8 6" />
