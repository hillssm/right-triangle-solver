<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <text x="600" y="75.0" font-family="system-ui, sans-serif" font-size="30" font-weight="500" fill="#94a3b8" text-anchor="middle">Opposite, adjacent, hypotenuse: named from the angle</text>

  <!-- A(300,470) B(900,470) C(900,170). Right angle at B, theta at A. -->
  <polygon points="300,470 900,470 900,170" fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-width="3.5" />
  <path d="M 900 438 L 868 438 L 868 470" fill="none" stroke="#cbd5e1" stroke-width="2.5" />
  <path d="M 370 470 A 70 70 0 0 1 363 439" fill="none" stroke="#facc15" stroke-width="2.5" />

  <text x="936" y="330" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1">Opposite</text>
  <text x="600" y="514" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">Adjacent</text>
  <text x="600" y="290" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">Hypotenuse</text>
  <text x="398" y="454" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#facc15" text-anchor="middle">θ</text>

  <text x="600" y="581.0" font-family="monospace" font-size="27" font-weight="bold" fill="#10b981" text-anchor="middle">the labels move with the angle you choose</text>
</svg>