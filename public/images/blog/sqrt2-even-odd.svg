<text x="600.0" y="77.0" font-family="system-ui, sans-serif" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="bold">Odd Numbers Have Odd Squares</text>
<text x="600.0" y="150.0" font-family="system-ui, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="normal">3 = 2·1 + 1    →    3² = 9  (odd)</text>
<text x="600.0" y="212.0" font-family="system-ui, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="normal">5 = 2·2 + 1    →    5² = 25  (odd)</text>
<text x="600.0" y="274.0" font-family="system-ui, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="normal">7 = 2·3 + 1    →    7² = 49  (odd)</text>
<text x="600.0" y="336.0" font-family="system-ui, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="normal">11 = 2·5 + 1    →    11² = 121  (odd)</text>
<text x="600.0" y="430.0" font-family="system-ui, sans-serif" font-size="24" fill="#facc15" text-anchor="middle" font-weight="bold">In general:  n = 2k + 1  →  n² = 4k² + 4k + 1</text>
<text x="600.0" y="478.0" font-family="system-ui, sans-serif" font-size="24" fill="#facc15" text-anchor="middle" font-weight="bold">= 2(2k² + 2k) + 1, which is odd.</text>
<text x="600.0" y="545.0" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="normal">So: if n² is even, n cannot be odd. n must be even.</text>
</svg>