<text x="600.0" y="77.0" font-family="system-ui, sans-serif" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="bold">Exact Value vs. Approximations</text>
<text x="150.0" y="170.0" font-family="system-ui, sans-serif" font-size="24" fill="#facc15" text-anchor="start" font-weight="bold">√2  (exact)</text>
<text x="420.0" y="170.0" font-family="system-ui, sans-serif" font-size="24" fill="#ffffff" text-anchor="start" font-weight="normal">1.4142135623730951...</text>
<text x="150.0" y="250.0" font-family="system-ui, sans-serif" font-size="24" fill="#ffffff" text-anchor="start" font-weight="normal">99/70</text>
<text x="420.0" y="250.0" font-family="system-ui, sans-serif" font-size="24" fill="#ffffff" text-anchor="start" font-weight="normal">= 1.4142857142857144</text>
<text x="790.0" y="250.0" font-family="system-ui, sans-serif" font-size="22" fill="#94a3b8" text-anchor="start" font-weight="normal">error 0.00007215, too high</text>
<text x="150.0" y="330.0" font-family="system-ui, sans-serif" font-size="24" fill="#ffffff" text-anchor="start" font-weight="normal">10/7</text>
<text x="420.0" y="330.0" font-family="system-ui, sans-serif" font-size="24" fill="#ffffff" text-anchor="start" font-weight="normal">= 1.4285714285714286</text>
<text x="790.0" y="330.0" font-family="system-ui, sans-serif" font-size="22" fill="#94a3b8" text-anchor="start" font-weight="normal">error 0.01435787, too high</text>
<text x="150.0" y="410.0" font-family="system-ui, sans-serif" font-size="24" fill="#ffffff" text-anchor="start" font-weight="normal">7/5</text>
<text x="420.0" y="410.0" font-family="system-ui, sans-serif" font-size="24" fill="#ffffff" text-anchor="start" font-weight="normal">= 1.4</text>
<text x="790.0" y="410.0" font-family="system-ui, sans-serif" font-size="22" fill="#94a3b8" text-anchor="start" font-weight="normal">error 0.01421356, too low</text>
<text x="600.0" y="520.0" font-family="system-ui, sans-serif" font-size="22" fill="#facc15" text-anchor="middle" font-weight="bold">Every fraction misses. Only √2 itself is exact.</text>
<text x="600.0" y="565.0" font-family="system-ui, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="normal">Squaring the rounded value proves the point: 1.414² = 1.999396, not 2.</text>
