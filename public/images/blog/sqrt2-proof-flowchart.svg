<text x="600.0" y="77.0" font-family="system-ui, sans-serif" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="bold">Proof by Contradiction, Step by Step</text>
<rect x="300.0" y="100.0" width="600.0" height="62.0" stroke="#38bdf8" stroke-width="3" fill="none" />
<text x="600.0" y="139.0" font-family="system-ui, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="normal">1. ASSUME √2 = a/b, in lowest terms, b ≠ 0</text>
<line x1="600.0" y1="162.0" x2="600.0" y2="186.0" stroke="#94a3b8" stroke-width="2" />
<polygon points="600.0,186.0 592.0,172.0 608.0,172.0" fill="#94a3b8" />
<rect x="300.0" y="186.0" width="600.0" height="62.0" stroke="#38bdf8" stroke-width="3" fill="none" />
<text x="600.0" y="225.0" font-family="system-ui, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="normal">2. SQUARE: a² = 2b²</text>
<line x1="600.0" y1="248.0" x2="600.0" y2="272.0" stroke="#94a3b8" stroke-width="2" />
<polygon points="600.0,272.0 592.0,258.0 608.0,258.0" fill="#94a3b8" />
<rect x="300.0" y="272.0" width="600.0" height="62.0" stroke="#38bdf8" stroke-width="3" fill="none" />
<text x="600.0" y="311.0" font-family="system-ui, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="normal">3. a² is even, so a is even: a = 2k</text>
<line x1="600.0" y1="334.0" x2="600.0" y2="358.0" stroke="#94a3b8" stroke-width="2" />
<polygon points="600.0,358.0 592.0,344.0 608.0,344.0" fill="#94a3b8" />
<rect x="300.0" y="358.0" width="600.0" height="62.0" stroke="#38bdf8" stroke-width="3" fill="none" />
<text x="600.0" y="397.0" font-family="system-ui, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="normal">4. SUBSTITUTE: b² = 2k², so b is even</text>
<line x1="600.0" y1="420.0" x2="600.0" y2="444.0" stroke="#94a3b8" stroke-width="2" />
<polygon points="600.0,444.0 592.0,430.0 608.0,430.0" fill="#94a3b8" />
<rect x="300.0" y="444.0" width="600.0" height="62.0" stroke="#f87171" stroke-width="3" fill="none" />
<text x="600.0" y="483.0" font-family="system-ui, sans-serif" font-size="20" fill="#f87171" text-anchor="middle" font-weight="bold">5. CONTRADICTION: a and b are both even</text>
<line x1="600.0" y1="506.0" x2="600.0" y2="530.0" stroke="#94a3b8" stroke-width="2" />
<polygon points="600.0,530.0 592.0,516.0 608.0,516.0" fill="#94a3b8" />
<rect x="300.0" y="530.0" width="600.0" height="62.0" stroke="#facc15" stroke-width="3" fill="none" />
<text x="600.0" y="569.0" font-family="system-ui, sans-serif" font-size="20" fill="#facc15" text-anchor="middle" font-weight="bold">6. THEREFORE √2 is irrational</text>
</svg>