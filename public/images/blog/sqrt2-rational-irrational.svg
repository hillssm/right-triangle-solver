<text x="600.0" y="70.0" font-family="system-ui, sans-serif" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="bold">Rational vs. Irrational Numbers</text>
<rect x="80.0" y="120.0" width="490.0" height="400.0" stroke="#38bdf8" stroke-width="3" fill="none" />
<rect x="630.0" y="120.0" width="490.0" height="400.0" stroke="#38bdf8" stroke-width="3" fill="none" />
<text x="325.0" y="165.0" font-family="system-ui, sans-serif" font-size="24" fill="#facc15" text-anchor="middle" font-weight="bold">RATIONAL</text>
<text x="875.0" y="165.0" font-family="system-ui, sans-serif" font-size="24" fill="#facc15" text-anchor="middle" font-weight="bold">IRRATIONAL</text>
<text x="110.0" y="220.0" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="start" font-weight="normal">1/2 = 0.5</text>
<text x="110.0" y="272.0" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="start" font-weight="normal">3/4 = 0.75</text>
<text x="110.0" y="324.0" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="start" font-weight="normal">−5 = −5/1</text>
<text x="110.0" y="376.0" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="start" font-weight="normal">0.125 = 1/8</text>
<text x="110.0" y="428.0" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="start" font-weight="normal">0.333... = 1/3</text>
<text x="325.0" y="490.0" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle" font-weight="normal">Terminating or repeating</text>
<text x="660.0" y="220.0" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="start" font-weight="normal">√2 ≈ 1.41421356...</text>
<text x="660.0" y="272.0" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="start" font-weight="normal">√3 ≈ 1.73205080...</text>
<text x="660.0" y="324.0" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="start" font-weight="normal">π ≈ 3.14159265...</text>
<text x="660.0" y="376.0" font-family="system-ui, sans-serif" font-size="22" fill="#ffffff" text-anchor="start" font-weight="normal">e ≈ 2.71828182...</text>
<text x="875.0" y="490.0" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle" font-weight="normal">Never terminates, never repeats</text>
<text x="600.0" y="565.0" font-family="system-ui, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="normal">Both kinds are real numbers on the same number line.</text>
</svg>