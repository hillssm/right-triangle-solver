 fill="#ffffff">finds a missing side</text><text x="600" y="585" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#facc15">Thales proves the angle. Pythagoras finds the side.</text></svg>
