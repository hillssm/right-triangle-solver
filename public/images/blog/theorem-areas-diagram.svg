<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <text x="600" y="75.0" font-family="system-ui, sans-serif" font-size="30" font-weight="500" fill="#94a3b8" text-anchor="middle">The squares on the sides: their areas add up</text>

  <!-- Squares sized by side length (50 px per unit), bottoms aligned at y=470 -->
  <rect x="170" y="320" width="150" height="150" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="2.5" />
  <rect x="420" y="270" width="200" height="200" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="2.5" />
  <rect x="720" y="220" width="250" height="250" fill="rgba(250,204,21,0.07)" stroke="#facc15" stroke-width="2.5" />

  <text x="245" y="404" font-family="monospace" font-size="26" font-weight="bold" fill="#38bdf8" text-anchor="middle">a² = 9</text>
  <text x="520" y="380" font-family="monospace" font-size="26" font-weight="bold" fill="#38bdf8" text-anchor="middle">b² = 16</text>
  <text x="845" y="354" font-family="monospace" font-size="28" font-weight="bold" fill="#facc15" text-anchor="middle">c² = 25</text>

  <text x="370" y="408" font-family="system-ui, sans-serif" font-size="40" font-weight="600" fill="#cbd5e1" text-anchor="middle">+</text>
  <text x="670" y="408" font-family="system-ui, sans-serif" font-size="40" font-weight="600" fill="#cbd5e1" text-anchor="middle">=</text>

  <text x="245" y="506" font-family="system-ui, sans-serif" font-size="24" font-weight="500" fill="#94a3b8" text-anchor="middle">side 3</text>
  <text x="520" y="506" font-family="system-ui, sans-serif" font-size="24" font-weight="500" fill="#94a3b8" text-anchor="middle">side 4</text>
  <text x="845" y="506" font-family="system-ui, sans-serif" font-size="24" font-weight="500" fill="#94a3b8" text-anchor="middle">side 5</text>

  <text x="600" y="581.0" font-family="monospace" font-size="28" font-weight="bold" fill="#10b981" text-anchor="middle">a² + b² = c²: 9 + 16 = 25</text>
</svg>