<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <text x="600" y="75.0" font-family="system-ui, sans-serif" font-size="30" font-weight="500" fill="#94a3b8" text-anchor="middle">Checking a triple: 8, 15, 17</text>

  <!-- 8-15-17 at 34 px per unit. A(330,470) B(840,470) C(330,198) -->
  <polygon points="330,470 840,470 330,198" fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-width="3.5" />
  <path d="M 330 438 L 362 438 L 362 470" fill="none" stroke="#cbd5e1" stroke-width="2.5" />

  <text x="294" y="342" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">8</text>
  <text x="585" y="512" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">15</text>
  <text x="604" y="318" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">17</text>

  <text x="600" y="581.0" font-family="monospace" font-size="28" font-weight="bold" fill="#10b981" text-anchor="middle">8² + 15² = 64 + 225 = 289 = 17²</text>
</svg>