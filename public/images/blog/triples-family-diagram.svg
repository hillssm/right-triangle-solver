<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <text x="600" y="75.0" font-family="system-ui, sans-serif" font-size="30" font-weight="500" fill="#94a3b8" text-anchor="middle">One family: the 3-4-5 triangle scaled up</text>

  <!-- Nested 3-4-5 triangles sharing corner A(200,470): scales x30, x60, x90 -->
  <polygon points="200,470 560,470 200,200" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="3" />
  <polygon points="200,470 440,470 200,290" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <polygon points="200,470 320,470 200,380" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <path d="M 200 440 L 230 440 L 230 470" fill="none" stroke="#cbd5e1" stroke-width="2.5" />

  <text x="260" y="500" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#cbd5e1" text-anchor="middle">3-4-5</text>
  <text x="380" y="500" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#cbd5e1" text-anchor="middle">6-8-10</text>
  <text x="500" y="500" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#cbd5e1" text-anchor="middle">9-12-15</text>

  <text x="660" y="252" font-family="monospace" font-size="27" font-weight="bold" fill="#cbd5e1">3-4-5 × 2 = 6-8-10</text>
  <text x="660" y="316" font-family="monospace" font-size="27" font-weight="bold" fill="#cbd5e1">3-4-5 × 3 = 9-12-15</text>
  <text x="638.0" y="392" font-family="system-ui, sans-serif" font-size="25" font-weight="500" fill="#94a3b8">same angles, same shape, three sizes</text>

  <text x="600" y="581.0" font-family="monospace" font-size="27" font-weight="bold" fill="#10b981" text-anchor="middle">multiply every side by the same number, the shape survives</text>
</svg>