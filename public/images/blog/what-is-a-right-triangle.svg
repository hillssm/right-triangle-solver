<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <text x="600" y="77.0" font-family="system-ui, sans-serif" font-size="32" font-weight="500" fill="#94a3b8" text-anchor="middle">What is a right triangle?</text>

  <!-- A(350,480) B(950,480) C(350,140). Right angle at A. -->
  <polygon points="350,480 950,480 350,140" fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-width="3.5" />
  <path d="M 350 446 L 384 446 L 384 480" fill="none" stroke="#facc15" stroke-width="3" />
  <text x="404" y="440" font-family="system-ui, sans-serif" font-size="27" font-weight="700" fill="#facc15">90°</text>

  <text x="318" y="318" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">leg</text>
  <text x="650" y="522" font-family="system-ui, sans-serif" font-size="29" font-weight="600" fill="#cbd5e1" text-anchor="middle">leg</text>
  <text x="676" y="290" font-family="system-ui, sans-serif" font-size="31" font-weight="700" fill="#facc15" text-anchor="middle">hypotenuse</text>

  <text x="600" y="581.0" font-family="monospace" font-size="28" font-weight="bold" fill="#10b981" text-anchor="middle">one 90° angle, two legs, one hypotenuse</text>
</svg>