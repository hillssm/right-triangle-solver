<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with slight gradient -->
  <rect width="1200" height="600" fill="#131313"/>
  <rect width="1200" height="600" fill="url(#paint0_radial)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#66b2ff" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="600" fill="url(#grid)" />
  </g>

  <!-- Glowing Effect for the Triangle -->
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="15" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  <g filter="url(#glow)">
    <!-- Right Triangle -->
    <path d="M 400 450 L 400 150 L 800 450 Z" fill="rgba(102, 178, 255, 0.05)" stroke="#66b2ff" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Right Angle Square -->
    <path d="M 400 410 L 440 410 L 440 450" fill="none" stroke="#66b2ff" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Labels -->
  <!-- Leg a -->
  <text x="220" y="310" fill="#e5e2e1" font-family="'Noto Serif', Georgia, serif" font-size="36" font-style="italic" font-weight="bold">Leg a</text>
  
  <!-- Leg b -->
  <text x="570" y="530" fill="#e5e2e1" font-family="'Noto Serif', Georgia, serif" font-size="36" font-style="italic" font-weight="bold">Leg b</text>
  
  <!-- Hypotenuse c -->
  <text x="630" y="280" fill="#66b2ff" font-family="'Noto Serif', Georgia, serif" font-size="42" font-style="italic" font-weight="bold">Hypotenuse</text>

  <!-- Right Angle Label -->
  <g transform="translate(40, 20)">
    <rect width="520" height="80" rx="15" fill="#1a2530" stroke="#335980" stroke-width="2" />
    <text x="260" y="52" fill="#66b2ff" font-family="'Noto Serif', Georgia, serif" font-size="36" font-weight="bold" text-anchor="middle">What Is a Right Triangle?</text>
  </g>

  <!-- 90 degree label -->
  <text x="406" y="436" fill="#66b2ff" font-family="'Noto Serif', Georgia, serif" font-size="16" font-weight="bold">90°</text>

  <defs>
    <radialGradient id="paint0_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 300) rotate(90) scale(400 800)">
      <stop stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#131313" stop-opacity="1"/>
    </radialGradient>
  </defs>
</svg>
