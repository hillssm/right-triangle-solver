<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="48" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Complete Triangle Inside Its Circumcircle</text>
  <circle cx="600" cy="340" r="250" fill="none" stroke="#f1c97d" stroke-width="4"/>  <circle cx="600" cy="340" r="9" fill="#f1c97d"/>  <polygon points="350,340 850,340 530,100" fill="#ffffff" fill-opacity="0.04" stroke="none"/>  <polygon points="350,340 850,340 530,100" fill="none" stroke="#f1c97d" stroke-width="7" stroke-linejoin="round"/>  <line x1="600" y1="340" x2="350" y2="340" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round"/>  <line x1="600" y1="340" x2="850" y2="340" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round"/>  <line x1="600" y1="340" x2="530" y2="100" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>  <polyline points="516.8,117.6 534.4,130.8 547.6,113.2" fill="none" stroke="#ffffff" stroke-width="3"/>  <circle cx="350" cy="340" r="9" fill="#f1c97d"/>  <circle cx="850" cy="340" r="9" fill="#f1c97d"/>  <circle cx="530" cy="100" r="9" fill="#f1c97d"/>  <text x="320" y="392" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>  <text x="880" y="392" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>  <text x="574" y="108" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>  <text x="600" y="392" font-size="26" font-weight="700" fill="#7dd3fc" text-anchor="middle">O</text>  <text x="400" y="200" font-size="28" font-weight="700" fill="#7dd3fc" text-anchor="middle">a = 6</text>  <text x="742" y="200" font-size="28" font-weight="700" fill="#f1c97d" text-anchor="middle">b = 8</text>  <text x="600" y="392" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">c = 10</text>  <text x="470" y="300" font-size="24" font-weight="700" fill="#7dd3fc" text-anchor="middle">R</text>  <text x="742" y="300" font-size="24" font-weight="700" fill="#7dd3fc" text-anchor="middle">R</text>  <text x="588" y="216" font-size="24" font-weight="700" fill="#4ade80" text-anchor="middle">R</text>  <rect x="884" y="110" width="282" height="190" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>  <text x="1025" y="162" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="middle">AO = BO = CO = R</text>  <text x="1025" y="210" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">R = c / 2</text>  <text x="1025" y="254" font-size="22" font-weight="400" fill="#a3a3a3" text-anchor="middle">R = 10 / 2 = 5</text></svg>
