<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="48" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Thales Theorem: Angle in a Semicircle Is 90 Degrees</text>
  <circle cx="600" cy="340" r="250" fill="none" stroke="#f1c97d" stroke-width="4"/>  <circle cx="600" cy="340" r="9" fill="#f1c97d"/>  <polygon points="350,340 850,340 530,100" fill="#ffffff" fill-opacity="0.04" stroke="none"/>  <polygon points="350,340 850,340 530,100" fill="none" stroke="#f1c97d" stroke-width="7" stroke-linejoin="round"/>  <line x1="600" y1="340" x2="530" y2="100" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>  <polyline points="516.8,117.6 534.4,130.8 547.6,113.2" fill="none" stroke="#ffffff" stroke-width="3"/>  <circle cx="350" cy="340" r="9" fill="#f1c97d"/>  <circle cx="850" cy="340" r="9" fill="#f1c97d"/>  <circle cx="530" cy="100" r="9" fill="#f1c97d"/>  <text x="320" y="392" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>  <text x="880" y="392" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>  <text x="574" y="108" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>  <text x="600" y="392" font-size="26" font-weight="700" fill="#7dd3fc" text-anchor="middle">O</text>  <text x="600" y="392" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">AB = diameter = c</text>  <text x="560" y="150" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="middle">angle ACB = 90°</text>  <rect x="884" y="110" width="282" height="190" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>  <text x="1025" y="162" font-size="24" font-weight="700" fill="#f1c97d" text-anchor="middle">AB is a diameter</text>  <text x="1025" y="208" font-size="22" font-weight="400" fill="#ffffff" text-anchor="middle">C is on the circle</text>  <text x="1025" y="252" font-size="22" font-weight="400" fill="#a3a3a3" text-anchor="middle">so angle C = 90°</text></svg>
