<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="48" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Circumcircle vs Incircle: the 6-8-10 Triangle</text>
  <circle cx="300" cy="330" r="130" fill="none" stroke="#f1c97d" stroke-width="4"/>  <circle cx="300" cy="330" r="9" fill="#f1c97d"/>  <polygon points="170,330 430,330 264,205" fill="#ffffff" fill-opacity="0.04" stroke="none"/>  <polygon points="170,330 430,330 264,205" fill="none" stroke="#f1c97d" stroke-width="6" stroke-linejoin="round"/>  <line x1="300" y1="330" x2="170" y2="330" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/>  <line x1="300" y1="330" x2="264" y2="205" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>  <polyline points="250.8,222.6 268.4,235.8 281.6,218.2" fill="none" stroke="#ffffff" stroke-width="3"/>  <circle cx="170" cy="330" r="8" fill="#f1c97d"/>  <circle cx="430" cy="330" r="8" fill="#f1c97d"/>  <circle cx="264" cy="205" r="8" fill="#f1c97d"/>  <text x="146" y="382" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>  <text x="454" y="382" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>  <text x="300" y="382" font-size="22" font-weight="700" fill="#7dd3fc" text-anchor="middle">O</text>  <text x="228" y="198" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>  <text x="300" y="520" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="middle">Circumcircle: R = 5</text>  <text x="300" y="556" font-size="20" font-weight="400" fill="#a3a3a3" text-anchor="middle">circle through the vertices</text>  <polygon points="700,274 908,430 700,430" fill="#ffffff" fill-opacity="0.04" stroke="none"/>  <polygon points="700,274 908,430 700,430" fill="none" stroke="#f1c97d" stroke-width="6" stroke-linejoin="round"/>  <circle cx="752" cy="378" r="52" fill="none" stroke="#4ade80" stroke-width="4"/>  <circle cx="752" cy="378" r="8" fill="#4ade80"/>  <line x1="752" y1="378" x2="752" y2="430" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>  <polyline points="722,430 722,408 700,408" fill="none" stroke="#ffffff" stroke-width="3"/>  <circle cx="700" cy="274" r="8" fill="#f1c97d"/>  <circle cx="908" cy="430" r="8" fill="#f1c97d"/>  <circle cx="700" cy="430" r="8" fill="#f1c97d"/>  <text x="676" y="268" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>  <text x="932" y="436" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>  <text x="676" y="436" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>  <text x="782" y="372" font-size="22" font-weight="700" fill="#4ade80" text-anchor="middle">I</text>  <text x="800" y="428" font-size="22" font-weight="700" fill="#4ade80" text-anchor="middle">r = 2</text>  <text x="804" y="520" font-size="26" font-weight="700" fill="#4ade80" text-anchor="middle">Incircle: r = 2</text>  <text x="804" y="556" font-size="20" font-weight="400" fill="#a3a3a3" text-anchor="middle">circle touching the sides</text></svg>
