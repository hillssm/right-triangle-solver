<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Cosine ratio visual guide</title>
<desc>Right triangle highlighting adjacent leg b and hypotenuse c with cos(A) = b/c.</desc>

<polygon points="400,480 820,480 400,150" fill="rgba(241,201,125,0.07)"/>
<line x1="400" y1="480" x2="820" y2="480" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
<line x1="820" y1="480" x2="400" y2="150" stroke="#f472b6" stroke-width="8" stroke-linecap="round"/>
<line x1="400" y1="480" x2="400" y2="150" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
<polyline points="400,454 426,454 426,480" stroke="#ffffff" stroke-width="2.5" fill="none"/>
<circle cx="400" cy="480" r="7" fill="#f1c97d"/>
<circle cx="820" cy="480" r="7" fill="#f1c97d"/>
<circle cx="400" cy="150" r="7" fill="#f1c97d"/>
<text x="610.0" y="525" font-family="Noto Serif, Georgia, serif" font-size="40" fill="#38bdf8" text-anchor="middle" font-style="italic" font-weight="bold">b</text>
<text x="665.0" y="315.0" font-family="Noto Serif, Georgia, serif" font-size="40" fill="#f472b6" text-anchor="middle" font-style="italic" font-weight="bold">c</text>
<text x="455" y="440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text>
<path d="M 415 425 Q 440 430 455 455" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7"/>
<rect x="380" y="545" width="440" height="60" rx="12" fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-width="2"/>
<text x="600" y="583" font-family="Noto Serif, Georgia, serif" font-size="30" fill="#ffffff" text-anchor="middle" font-style="italic">cos(A) = b / c</text>
</svg>