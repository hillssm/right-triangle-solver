<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Anatomy of a right triangle for cotangent</title>
<desc>Right triangle with reference angle A bottom-left, gold adjacent side b as the base, green opposite side a as the vertical leg, neutral hypotenuse c, and the formula cot(A) = b/a.</desc>

<polygon points="400,500 1000,500 1000,50" fill="rgba(241,201,125,0.07)" />
<!-- adjacent side b (gold) -->
<line x1="400" y1="500" x2="1000" y2="500" stroke="#f1c97d" stroke-width="5" stroke-linecap="round" />
<!-- opposite side a (green) -->
<line x1="1000" y1="500" x2="1000" y2="50" stroke="#4ade80" stroke-width="5" stroke-linecap="round" />
<!-- hypotenuse c (neutral) -->
<line x1="400" y1="500" x2="1000" y2="50" stroke="#a8a29e" stroke-width="5" stroke-linecap="round" />
<!-- right-angle marker at (1000,500) -->
<polyline points="972,500 972,472 1000,472" stroke="#ffffff" stroke-width="2.5" fill="none" />
<!-- vertex dots -->
<circle cx="400" cy="500" r="7" fill="#f1c97d" />
<circle cx="1000" cy="500" r="7" fill="#f1c97d" />
<circle cx="1000" cy="50" r="7" fill="#f1c97d" />
<!-- angle A arc -->
<path d="M 438 500 Q 446 484 432 476" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7" />
<!-- side labels -->
<text x="700" y="550" font-family="Noto Serif, Georgia, serif" font-size="36" fill="#f1c97d" text-anchor="middle" font-style="italic">b</text>
<text x="700" y="578" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#d0c5af" text-anchor="middle">adjacent</text>
<text x="1048" y="275" font-family="Noto Serif, Georgia, serif" font-size="36" fill="#4ade80" text-anchor="middle" font-style="italic">a</text>
<text x="1048" y="303" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#d0c5af" text-anchor="middle">opposite</text>
<text x="676" y="240" font-family="Noto Serif, Georgia, serif" font-size="36" fill="#a8a29e" text-anchor="middle" font-style="italic">c</text>
<text x="676" y="268" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#d0c5af" text-anchor="middle">hypotenuse</text>
<!-- vertex labels -->
<text x="462" y="482" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text>
<text x="962" y="102" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">B</text>
<text x="942" y="462" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#ffffff" text-anchor="middle">90°</text>
<!-- formula annotation -->
<text x="790" y="418" font-family="Noto Serif, Georgia, serif" font-size="34" fill="#ffffff" text-anchor="middle" font-style="italic">cot(A) = b/a</text>
</svg>
