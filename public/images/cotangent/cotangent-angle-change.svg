<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>How cotangent changes as the angle changes</title>
<desc>Three triangles at 30, 45, and 60 degrees with cotangent values 1.7321, 1, and 0.5774, showing that cotangent falls as the angle grows.</desc>

<!-- Panel A: 30 degrees -->
<text x="200" y="64" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="bold">A = 30°</text>
<polygon points="60,500 340,500 340,338" fill="rgba(241,201,125,0.07)" />
<line x1="60" y1="500" x2="340" y2="500" stroke="#f1c97d" stroke-width="4" stroke-linecap="round" />
<line x1="340" y1="500" x2="340" y2="338" stroke="#4ade80" stroke-width="4" stroke-linecap="round" />
<line x1="60" y1="500" x2="340" y2="338" stroke="#a8a29e" stroke-width="4" stroke-linecap="round" />
<polyline points="318,500 318,478 340,478" stroke="#ffffff" stroke-width="2" fill="none" />
<circle cx="60" cy="500" r="5" fill="#f1c97d" />
<circle cx="340" cy="500" r="5" fill="#f1c97d" />
<circle cx="340" cy="338" r="5" fill="#f1c97d" />
<path d="M 99 500 Q 106 484 90 478" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7" />
<text x="200" y="534" font-family="Noto Serif, Georgia, serif" font-size="24" fill="#f1c97d" text-anchor="middle" font-style="italic">b = √3</text>
<text x="368" y="424" font-family="Noto Serif, Georgia, serif" font-size="24" fill="#4ade80" text-anchor="middle" font-style="italic">a = 1</text>
<text x="112" y="480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text>
<text x="200" y="566" font-family="Noto Serif, Georgia, serif" font-size="24" fill="#ffffff" text-anchor="middle" font-style="italic">cot(A) = √3/1</text>
<text x="200" y="598" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" fill="#f1c97d" text-anchor="middle" font-weight="bold">≈ 1.7321</text>

<!-- Panel B: 45 degrees -->
<text x="600" y="64" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="bold">A = 45°</text>
<polygon points="485,500 715,500 715,270" fill="rgba(241,201,125,0.07)" />
<line x1="485" y1="500" x2="715" y2="500" stroke="#f1c97d" stroke-width="4" stroke-linecap="round" />
<line x1="715" y1="500" x2="715" y2="270" stroke="#4ade80" stroke-width="4" stroke-linecap="round" />
<line x1="485" y1="500" x2="715" y2="270" stroke="#a8a29e" stroke-width="4" stroke-linecap="round" />
<polyline points="693,500 693,478 715,478" stroke="#ffffff" stroke-width="2" fill="none" />
<circle cx="485" cy="500" r="5" fill="#f1c97d" />
<circle cx="715" cy="500" r="5" fill="#f1c97d" />
<circle cx="715" cy="270" r="5" fill="#f1c97d" />
<path d="M 523 500 Q 530 482 512 476" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7" />
<text x="600" y="534" font-family="Noto Serif, Georgia, serif" font-size="24" fill="#f1c97d" text-anchor="middle" font-style="italic">b = 1</text>
<text x="743" y="390" font-family="Noto Serif, Georgia, serif" font-size="24" fill="#4ade80" text-anchor="middle" font-style="italic">a = 1</text>
<text x="536" y="480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text>
<text x="600" y="566" font-family="Noto Serif, Georgia, serif" font-size="24" fill="#ffffff" text-anchor="middle" font-style="italic">cot(A) = 1/1</text>
<text x="600" y="598" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" fill="#f1c97d" text-anchor="middle" font-weight="bold">= 1</text>

<!-- Panel C: 60 degrees -->
<text x="1000" y="64" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="bold">A = 60°</text>
<polygon points="919,500 1081,500 1081,220" fill="rgba(241,201,125,0.07)" />
<line x1="919" y1="500" x2="1081" y2="500" stroke="#f1c97d" stroke-width="4" stroke-linecap="round" />
<line x1="1081" y1="500" x2="1081" y2="220" stroke="#4ade80" stroke-width="4" stroke-linecap="round" />
<line x1="919" y1="500" x2="1081" y2="220" stroke="#a8a29e" stroke-width="4" stroke-linecap="round" />
<polyline points="1059,500 1059,478 1081,478" stroke="#ffffff" stroke-width="2" fill="none" />
<circle cx="919" cy="500" r="5" fill="#f1c97d" />
<circle cx="1081" cy="500" r="5" fill="#f1c97d" />
<circle cx="1081" cy="220" r="5" fill="#f1c97d" />
<path d="M 958 500 Q 965 482 945 474" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7" />
<text x="1000" y="534" font-family="Noto Serif, Georgia, serif" font-size="24" fill="#f1c97d" text-anchor="middle" font-style="italic">b = 1</text>
<text x="1109" y="365" font-family="Noto Serif, Georgia, serif" font-size="24" fill="#4ade80" text-anchor="middle" font-style="italic">a = √3</text>
<text x="970" y="480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text>
<text x="1000" y="566" font-family="Noto Serif, Georgia, serif" font-size="24" fill="#ffffff" text-anchor="middle" font-style="italic">cot(A) = 1/√3</text>
<text x="1000" y="598" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" fill="#f1c97d" text-anchor="middle" font-weight="bold">≈ 0.5774</text>
</svg>
