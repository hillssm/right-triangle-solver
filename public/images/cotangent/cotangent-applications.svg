<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Four practical cotangent calculations</title>
<desc>Four panels with labeled right triangles: a ladder with cot(A) = 3/4 = 0.75, a roof with cot(A) = 4/3 = 1.3333, a ramp with cot(A) = 9/0.75 = 12, and surveying with cot(A) = 40/30 = 1.3333.</desc>

<!-- Panel 1: Ladder -->
<text x="150" y="60" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">Ladder</text>
<polygon points="60,450 210,450 210,250" fill="rgba(241,201,125,0.07)" />
<line x1="60" y1="450" x2="210" y2="450" stroke="#f1c97d" stroke-width="4" stroke-linecap="round" />
<line x1="210" y1="450" x2="210" y2="250" stroke="#4ade80" stroke-width="4" stroke-linecap="round" />
<line x1="60" y1="450" x2="210" y2="250" stroke="#a8a29e" stroke-width="4" stroke-linecap="round" />
<polyline points="190,450 190,430 210,430" stroke="#ffffff" stroke-width="2" fill="none" />
<circle cx="60" cy="450" r="5" fill="#f1c97d" />
<circle cx="210" cy="450" r="5" fill="#f1c97d" />
<circle cx="210" cy="250" r="5" fill="#f1c97d" />
<text x="135" y="482" font-family="Noto Serif, Georgia, serif" font-size="22" fill="#f1c97d" text-anchor="middle" font-style="italic">b = 3 m</text>
<text x="238" y="356" font-family="Noto Serif, Georgia, serif" font-size="22" fill="#4ade80" text-anchor="middle" font-style="italic">a = 4 m</text>
<text x="98" y="430" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text>
<text x="150" y="516" font-family="Noto Serif, Georgia, serif" font-size="22" fill="#ffffff" text-anchor="middle" font-style="italic">cot(A) = 3/4</text>
<text x="150" y="552" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" fill="#f1c97d" text-anchor="middle" font-weight="bold">= 0.75</text>
<text x="150" y="590" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#d0c5af" text-anchor="middle">run is 75% of the rise</text>

<!-- Panel 2: Roof -->
<text x="450" y="60" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">Roof</text>
<polygon points="350,450 550,450 550,300" fill="rgba(241,201,125,0.07)" />
<line x1="350" y1="450" x2="550" y2="450" stroke="#f1c97d" stroke-width="4" stroke-linecap="round" />
<line x1="550" y1="450" x2="550" y2="300" stroke="#4ade80" stroke-width="4" stroke-linecap="round" />
<line x1="350" y1="450" x2="550" y2="300" stroke="#a8a29e" stroke-width="4" stroke-linecap="round" />
<polyline points="530,450 530,430 550,430" stroke="#ffffff" stroke-width="2" fill="none" />
<circle cx="350" cy="450" r="5" fill="#f1c97d" />
<circle cx="550" cy="450" r="5" fill="#f1c97d" />
<circle cx="550" cy="300" r="5" fill="#f1c97d" />
<text x="450" y="482" font-family="Noto Serif, Georgia, serif" font-size="22" fill="#f1c97d" text-anchor="middle" font-style="italic">b = 4 m</text>
<text x="578" y="380" font-family="Noto Serif, Georgia, serif" font-size="22" fill="#4ade80" text-anchor="middle" font-style="italic">a = 3 m</text>
<text x="388" y="430" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text>
<text x="450" y="516" font-family="Noto Serif, Georgia, serif" font-size="22" fill="#ffffff" text-anchor="middle" font-style="italic">cot(A) = 4/3</text>
<text x="450" y="552" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" fill="#f1c97d" text-anchor="middle" font-weight="bold">= 1.3333</text>
<text x="450" y="590" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#d0c5af" text-anchor="middle">run is 1.3333 times the rise</text>

<!-- Panel 3: Ramp -->
<text x="765" y="60" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">Ramp</text>
<polygon points="650,450 880,450 880,431" fill="rgba(241,201,125,0.07)" />
<line x1="650" y1="450" x2="880" y2="450" stroke="#f1c97d" stroke-width="4" stroke-linecap="round" />
<line x1="880" y1="450" x2="880" y2="431" stroke="#4ade80" stroke-width="4" stroke-linecap="round" />
<line x1="650" y1="450" x2="880" y2="431" stroke="#a8a29e" stroke-width="4" stroke-linecap="round" />
<polyline points="868,450 868,438 880,438" stroke="#ffffff" stroke-width="2" fill="none" />
<circle cx="650" cy="450" r="5" fill="#f1c97d" />
<circle cx="880" cy="450" r="5" fill="#f1c97d" />
<circle cx="880" cy="431" r="5" fill="#f1c97d" />
<text x="765" y="482" font-family="Noto Serif, Georgia, serif" font-size="22" fill="#f1c97d" text-anchor="middle" font-style="italic">b = 9 m</text>
<text x="916" y="444" font-family="Noto Serif, Georgia, serif" font-size="20" fill="#4ade80" text-anchor="middle" font-style="italic">a = 0.75 m</text>
<text x="688" y="430" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text>
<text x="765" y="516" font-family="Noto Serif, Georgia, serif" font-size="22" fill="#ffffff" text-anchor="middle" font-style="italic">cot(A) = 9/0.75</text>
<text x="765" y="552" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" fill="#f1c97d" text-anchor="middle" font-weight="bold">= 12</text>
<text x="765" y="590" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#d0c5af" text-anchor="middle">run is 12 times the rise</text>

<!-- Panel 4: Surveying -->
<text x="1040" y="60" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">Surveying</text>
<polygon points="940,450 1140,450 1140,300" fill="rgba(241,201,125,0.07)" />
<line x1="940" y1="450" x2="1140" y2="450" stroke="#f1c97d" stroke-width="4" stroke-linecap="round" />
<line x1="1140" y1="450" x2="1140" y2="300" stroke="#4ade80" stroke-width="4" stroke-linecap="round" />
<line x1="940" y1="450" x2="1140" y2="300" stroke="#a8a29e" stroke-width="4" stroke-linecap="round" />
<polyline points="1120,450 1120,430 1140,430" stroke="#ffffff" stroke-width="2" fill="none" />
<circle cx="940" cy="450" r="5" fill="#f1c97d" />
<circle cx="1140" cy="450" r="5" fill="#f1c97d" />
<circle cx="1140" cy="300" r="5" fill="#f1c97d" />
<text x="1040" y="482" font-family="Noto Serif, Georgia, serif" font-size="22" fill="#f1c97d" text-anchor="middle" font-style="italic">b = 40 m</text>
<text x="1110" y="380" font-family="Noto Serif, Georgia, serif" font-size="20" fill="#4ade80" text-anchor="middle" font-style="italic">a = 30 m</text>
<text x="978" y="430" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text>
<text x="1040" y="516" font-family="Noto Serif, Georgia, serif" font-size="22" fill="#ffffff" text-anchor="middle" font-style="italic">cot(A) = 40/30</text>
<text x="1040" y="552" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" fill="#f1c97d" text-anchor="middle" font-weight="bold">= 1.3333</text>
<text x="1040" y="590" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#d0c5af" text-anchor="middle">1.3333 times the gap</text>
</svg>
