<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Tangent and cotangent are reciprocal ratios</title>
<desc>Three stages: a labeled 3-4-5 right triangle, the tangent calculation tan(A) = 3/4 = 0.75, and the cotangent calculation cot(A) = 4/3 = 1.3333, showing that flipping the fraction gives the reciprocal.</desc>

<text x="600" y="70" font-family="Noto Serif, Georgia, serif" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="bold">Tangent and Cotangent Are Reciprocal</text>

<!-- Stage 1: triangle -->
<text x="220" y="112" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#f1c97d" text-anchor="middle" font-weight="bold">Stage 1: Identify the sides</text>
<polygon points="110,520 330,520 330,360" fill="rgba(241,201,125,0.07)" />
<line x1="110" y1="520" x2="330" y2="520" stroke="#f1c97d" stroke-width="4" stroke-linecap="round" />
<line x1="330" y1="520" x2="330" y2="360" stroke="#4ade80" stroke-width="4" stroke-linecap="round" />
<line x1="110" y1="520" x2="330" y2="360" stroke="#a8a29e" stroke-width="4" stroke-linecap="round" />
<polyline points="306,520 306,496 330,496" stroke="#ffffff" stroke-width="2" fill="none" />
<circle cx="110" cy="520" r="6" fill="#f1c97d" />
<circle cx="330" cy="520" r="6" fill="#f1c97d" />
<circle cx="330" cy="360" r="6" fill="#f1c97d" />
<path d="M 143 520 Q 150 506 134 499" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7" />
<text x="220" y="556" font-family="Noto Serif, Georgia, serif" font-size="26" fill="#f1c97d" text-anchor="middle" font-style="italic">b = 4</text>
<text x="358" y="444" font-family="Noto Serif, Georgia, serif" font-size="26" fill="#4ade80" text-anchor="middle" font-style="italic">a = 3</text>
<text x="212" y="428" font-family="Noto Serif, Georgia, serif" font-size="26" fill="#a8a29e" text-anchor="middle" font-style="italic">c = 5</text>
<text x="162" y="498" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text>

<!-- arrow 1 to 2 -->
<line x1="398" y1="330" x2="438" y2="330" stroke="#ffffff" stroke-width="3" />
<polygon points="438,318 462,330 438,342" fill="#ffffff" />

<!-- Stage 2: tangent -->
<text x="600" y="112" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#f1c97d" text-anchor="middle" font-weight="bold">Stage 2: Calculate tangent</text>
<text x="440" y="345" font-family="Noto Serif, Georgia, serif" font-size="38" fill="#ffffff" text-anchor="middle" font-style="italic">tan(A) =</text>
<text x="620" y="292" font-family="Noto Serif, Georgia, serif" font-size="38" fill="#ffffff" text-anchor="middle">3</text>
<line x1="585" y1="312" x2="655" y2="312" stroke="#ffffff" stroke-width="3" />
<text x="620" y="362" font-family="Noto Serif, Georgia, serif" font-size="38" fill="#ffffff" text-anchor="middle">4</text>
<text x="742" y="345" font-family="Noto Serif, Georgia, serif" font-size="38" fill="#f1c97d" text-anchor="middle">= 0.75</text>
<text x="600" y="440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#d0c5af" text-anchor="middle">opposite divided by adjacent</text>

<!-- arrow 2 to 3 -->
<line x1="798" y1="330" x2="838" y2="330" stroke="#ffffff" stroke-width="3" />
<polygon points="838,318 862,330 838,342" fill="#ffffff" />

<!-- Stage 3: cotangent -->
<text x="1000" y="112" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#f1c97d" text-anchor="middle" font-weight="bold">Stage 3: Flip the fraction</text>
<text x="848" y="345" font-family="Noto Serif, Georgia, serif" font-size="38" fill="#ffffff" text-anchor="middle" font-style="italic">cot(A) =</text>
<text x="1015" y="292" font-family="Noto Serif, Georgia, serif" font-size="38" fill="#ffffff" text-anchor="middle">4</text>
<line x1="980" y1="312" x2="1050" y2="312" stroke="#ffffff" stroke-width="3" />
<text x="1015" y="362" font-family="Noto Serif, Georgia, serif" font-size="38" fill="#ffffff" text-anchor="middle">3</text>
<text x="1000" y="432" font-family="Noto Serif, Georgia, serif" font-size="38" fill="#f1c97d" text-anchor="middle">≈ 1.3333</text>
<text x="1000" y="478" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#d0c5af" text-anchor="middle">adjacent divided by opposite</text>

<text x="600" y="540" font-family="Noto Serif, Georgia, serif" font-size="36" fill="#f1c97d" text-anchor="middle" font-style="italic">cot(A) = 1 / tan(A)</text>
<text x="600" y="585" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#d0c5af" text-anchor="middle">Reciprocals: 0.75 and 1.3333 describe the same triangle from opposite directions.</text>
</svg>
