  <text x="172.0" y="364.0" font-size="28" font-weight="700" fill="#7dd3fc" text-anchor="middle">a = 5</text>
  <text x="590.0" y="557.0" font-size="28" font-weight="700" fill="#f1c97d" text-anchor="middle">b = 12</text>
  <text x="630.0" y="293.0" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">c = 13</text>
  <text x="600.0" y="585.0" font-size="28" font-weight="700" fill="#4ade80" text-anchor="middle">22.62° + 67.38° = 90°</text>
