<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="58" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Why 5-12-13 Is a Pythagorean Triple</text>

  <text x="600.0" y="108.0" font-size="30" font-weight="700" fill="#f1c97d" text-anchor="middle">5² + 12² = 13²      25 + 144 = 169</text>
  <polygon points="874.0,480.0 250.0,220.0 250.0,480.0" fill="#ffffff" fill-opacity="0.04" stroke="none"/>
  <polygon points="874.0,480.0 250.0,220.0 250.0,480.0" fill="none" stroke="#f1c97d" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="874.0" cy="480.0" r="9" fill="#f1c97d"/>
  <circle cx="250.0" cy="220.0" r="9" fill="#f1c97d"/>
  <circle cx="250.0" cy="480.0" r="9" fill="#f1c97d"/>
  <text x="904.0" y="488.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="start">A</text>
  <text x="250.0" y="194.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="220.0" y="488.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <polyline points="816.0,480.0 816.0,478.4 816.1,476.7 816.2,475.1 816.4,473.5 816.6,471.8 816.8,470.2 817.1,468.6 817.5,467.0 817.9,465.4 818.3,463.9 818.8,462.3 819.3,460.7 819.9,459.2 820.5,457.7" fill="none" stroke="#f1c97d" stroke-width="3" stroke-linecap="round"/>
  <text x="783.8" y="470.0" font-size="24" font-weight="700" fill="#f1c97d" text-anchor="middle">22.62°</text>
  <polyline points="303.5,242.3 301.5,246.7 299.1,250.9 296.3,255.0 293.2,258.7 289.8,262.2 286.1,265.4 282.2,268.3 278.0,270.8 273.7,273.0 269.1,274.8 264.5,276.2 259.7,277.2 254.9,277.8 250.0,278.0" fill="none" stroke="#f1c97d" stroke-width="3" stroke-linecap="round"/>
  <text x="301.0" y="304.5" font-size="24" font-weight="700" fill="#f1c97d" text-anchor="middle">67.38°</text>
  <polyline points="270.0,480.0 270.0,460.0 250.0,460.0" fill="none" stroke="#ffffff" stroke-width="3"/>
  <text x="302.0" y="446.0" font-size="24" font-weight="700" fill="#f1c97d" text-anchor="middle">90°</text>
  <text x="178.0" y="359.0" font-size="26" font-weight="700" fill="#7dd3fc" text-anchor="middle">5² = 25</text>
  <text x="562.0" y="532.0" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="middle">12² = 144</text>
  <text x="614.0" y="298.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">13² = 169</text>
  <text x="600.0" y="585.0" font-size="28" font-weight="700" fill="#4ade80" text-anchor="middle">25 + 144 = 169, so the angle opposite 13 is 90°</text>
</svg>

