<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520">
<title>Incircle and circumcircle of a 3-4-5 right triangle</title>
<desc>Toggleable incircle with radius r = 1, tangent to all three sides, and circumcircle with radius R = 2.5 through all three vertices, centered on the hypotenuse midpoint.</desc>
<polygon points="150.0,150.0 360.0,430.0 150.0,430.0" fill="rgba(241,201,125,0.07)" />
<line x1="150.0" y1="430.0" x2="360.0" y2="430.0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
<line x1="150.0" y1="430.0" x2="150.0" y2="150.0" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
<line x1="150.0" y1="150.0" x2="360.0" y2="430.0" stroke="#f472b6" stroke-width="3" stroke-linecap="round" />
<polyline points="150.0,405.0 175.0,405.0 175.0,430.0" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
<text x="136.0" y="140.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#ffffff" text-anchor="end" font-weight="bold">A</text>
<text x="374.0" y="452.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#ffffff" text-anchor="start" font-weight="bold">B</text>
<text x="134.0" y="454.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#ffffff" text-anchor="end" font-weight="bold">C</text>
<g data-circle="in">
<circle cx="220.0" cy="360.0" r="70.0" stroke="#4ade80" stroke-width="2.5" fill="rgba(74,222,128,0.08)" />
<circle cx="220.0" cy="360.0" r="5.0" fill="#4ade80" />
<line x1="220.0" y1="360.0" x2="220.0" y2="430.0" stroke="#4ade80" stroke-width="2" stroke-linecap="round" />
<text x="232.0" y="402.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#4ade80" text-anchor="start" font-weight="normal">r = 1</text>
</g>
<g data-circle="circum" style="display:none">
<circle cx="255.0" cy="290.0" r="175.0" stroke="#38bdf8" stroke-width="2.5" fill="rgba(56,189,248,0.06)" />
<circle cx="255.0" cy="290.0" r="5.0" fill="#38bdf8" />
<line x1="255.0" y1="290.0" x2="360.0" y2="430.0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
<text x="318.0" y="368.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#38bdf8" text-anchor="start" font-weight="normal">R = 2.5</text>
</g>
</svg>
