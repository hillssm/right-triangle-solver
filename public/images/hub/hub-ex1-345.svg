<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320">
<title>Example: 3-4-5 triangle solved</title>
<desc>Worked example. Legs a = 3 cm and b = 4 cm give hypotenuse c = 5 cm and acute angles 36.87 and 53.13 degrees.</desc>
<polygon points="110.0,52.0 266.0,260.0 110.0,260.0" fill="rgba(241,201,125,0.07)" />
<line x1="110.0" y1="260.0" x2="266.0" y2="260.0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
<line x1="110.0" y1="260.0" x2="110.0" y2="52.0" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
<line x1="110.0" y1="52.0" x2="266.0" y2="260.0" stroke="#f472b6" stroke-width="3" stroke-linecap="round" />
<polyline points="110.0,238.0 132.0,238.0 132.0,260.0" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
<text x="188.0" y="288.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="normal">a = 3 cm</text>
<text x="94.0" y="162.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#ffffff" text-anchor="end" font-weight="normal">b = 4 cm</text>
<text x="202.0" y="137.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#f472b6" text-anchor="middle" font-weight="normal" transform="rotate(53.13 202.0 137.0)">c = 5 cm</text>
<text x="110.0" y="30.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#d0c5af" text-anchor="middle" font-weight="normal">36.87°</text>
<text x="282.0" y="266.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#d0c5af" text-anchor="start" font-weight="normal">53.13°</text>
</svg>
