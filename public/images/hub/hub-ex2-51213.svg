<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320">
<title>Example: 5-12-13 triangle solved</title>
<desc>Worked example. Hypotenuse c = 13 cm and leg b = 12 cm give leg a = 5 cm and acute angles 22.62 and 67.38 degrees.</desc>
<polygon points="120.0,42.0 215.0,270.0 120.0,270.0" fill="rgba(241,201,125,0.07)" />
<line x1="120.0" y1="270.0" x2="215.0" y2="270.0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
<line x1="120.0" y1="270.0" x2="120.0" y2="42.0" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
<line x1="120.0" y1="42.0" x2="215.0" y2="270.0" stroke="#f472b6" stroke-width="3" stroke-linecap="round" />
<polyline points="120.0,248.0 142.0,248.0 142.0,270.0" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
<text x="167.0" y="298.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="normal">a = 5 cm</text>
<text x="104.0" y="162.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#ffffff" text-anchor="end" font-weight="normal">b = 12 cm</text>
<text x="178.0" y="132.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#f472b6" text-anchor="middle" font-weight="normal" transform="rotate(67.38 178.0 132.0)">c = 13 cm</text>
<text x="120.0" y="24.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#d0c5af" text-anchor="middle" font-weight="normal">22.62°</text>
<text x="231.0" y="286.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#d0c5af" text-anchor="start" font-weight="normal">67.38°</text>
</svg>
