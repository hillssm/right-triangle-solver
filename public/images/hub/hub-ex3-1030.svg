<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320">
<title>Example: solving with hypotenuse 10 cm and angle 30 degrees</title>
<desc>Worked example. With hypotenuse c = 10 cm and angle A = 30 degrees, the legs are a = 5 cm and b = about 8.66 cm.</desc>
<polygon points="150.0,45.0 280.0,270.0 150.0,270.0" fill="rgba(241,201,125,0.07)" />
<line x1="150.0" y1="270.0" x2="280.0" y2="270.0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
<line x1="150.0" y1="270.0" x2="150.0" y2="45.0" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
<line x1="150.0" y1="45.0" x2="280.0" y2="270.0" stroke="#f472b6" stroke-width="3" stroke-linecap="round" />
<polyline points="150.0,248.0 172.0,248.0 172.0,270.0" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
<text x="215.0" y="298.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="normal">a = 5 cm</text>
<text x="134.0" y="164.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#ffffff" text-anchor="end" font-weight="normal">b ≈ 8.66 cm</text>
<text x="228.0" y="135.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#f472b6" text-anchor="middle" font-weight="normal" transform="rotate(60.00 228.0 135.0)">c = 10 cm</text>
<text x="150.0" y="27.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#d0c5af" text-anchor="middle" font-weight="normal">30°</text>
<text x="296.0" y="276.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#d0c5af" text-anchor="start" font-weight="normal">60°</text>
</svg>
