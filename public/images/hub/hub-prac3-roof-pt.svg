<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
<title>Corte transversal de um telhado com subida de 6 pés, extensão de 12 pés, caibro de 13.42 pés e ângulo de 26.57 graus</title>
<desc>Corte transversal de um telhado com subida de 6 pés, extensão de 12 pés, caibro de 13.42 pés e ângulo de 26.57 graus</desc>
<rect x="170.0" y="320.0" width="300.0" height="110.0" fill="#2a2d36" stroke="#e8e6e3" stroke-width="2" />
<rect x="298.0" y="362.0" width="44.0" height="68.0" fill="#454b58" />
<rect x="200.0" y="352.0" width="56.0" height="44.0" fill="#454b58" />
<polygon points="152.0,320.0 488.0,320.0 320.0,236.0" fill="rgba(241,201,125,0.08)" stroke="#f1c97d" stroke-width="3" />
<line x1="320.0" y1="236.0" x2="320.0" y2="320.0" stroke="#d0c5af" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4" />
<text x="336.0" y="282.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#ffffff" text-anchor="start" font-weight="normal">6 ft subida</text>
