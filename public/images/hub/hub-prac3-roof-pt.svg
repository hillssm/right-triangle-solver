<text x="236.0" y="262.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#f1c97d" text-anchor="middle" font-weight="normal" transform="rotate(-26.57 236.0 262.0)">caibro ≈ 13.42 ft</text>
<text x="196.0" y="312.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#d0c5af" text-anchor="start" font-weight="normal">≈ 26.57°</text>
