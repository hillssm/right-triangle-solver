<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
<title>8メートル×15メートルの部屋を真上から見た図（対角線17メートル）</title>
<desc>8メートル×15メートルの部屋を真上から見た図（対角線17メートル）</desc>
<rect x="140.0" y="144.0" width="360.0" height="192.0" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="3" />
<line x1="140.0" y1="336.0" x2="500.0" y2="144.0" stroke="#f472b6" stroke-width="3" stroke-linecap="round" />
<text x="320.0" y="128.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="normal">15 m</text>
<text x="122.0" y="240.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#ffffff" text-anchor="end" font-weight="normal">8 m</text>
<text x="320.0" y="252.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#f472b6" text-anchor="middle" font-weight="normal" transform="rotate(-28.00 320.0 252.0)">対角線 = 17 m</text>
</svg>
