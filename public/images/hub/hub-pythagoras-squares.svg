<svg xmlns="http://www.w3.org/2000/svg" width="920" height="790" viewBox="0 0 920 790">
<title>Squares on the sides of a 3-4-5 right triangle</title>
<desc>A 3-4-5 right triangle with a square drawn on each side. The squares have areas 9, 16 and 25, showing that 9 + 16 = 25.</desc>
<rect x="340.0" y="560.0" width="180.0" height="180.0" fill="rgba(56,189,248,0.10)" stroke="#38bdf8" stroke-width="2.5" />
<rect x="100.0" y="320.0" width="240.0" height="240.0" fill="rgba(251,191,36,0.10)" stroke="#fbbf24" stroke-width="2.5" />
<polygon points="340.0,320.0 520.0,560.0 760.0,380.0 580.0,140.0" fill="rgba(244,114,182,0.10)" stroke="#f472b6" stroke-width="2.5" />
<polygon points="340.0,320.0 520.0,560.0 340.0,560.0" fill="rgba(241,201,125,0.07)" />
<line x1="340.0" y1="560.0" x2="520.0" y2="560.0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
<line x1="340.0" y1="560.0" x2="340.0" y2="320.0" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
<line x1="340.0" y1="320.0" x2="520.0" y2="560.0" stroke="#f472b6" stroke-width="3" stroke-linecap="round" />
<polyline points="340.0,530.0 370.0,530.0 370.0,560.0" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
<text x="430.0" y="672.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="normal">9</text>
<text x="220.0" y="462.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="normal">16</text>
<text x="550.0" y="352.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="normal">25</text>
<text x="430.0" y="532.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="normal">a = 3</text>
<text x="368.0" y="445.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#ffffff" text-anchor="start" font-weight="normal">b = 4</text>
<text x="408.0" y="452.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="normal">c = 5</text>
<text x="460.0" y="772.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#f1c97d" text-anchor="middle" font-weight="normal">9 + 16 = 25</text>
</svg>
