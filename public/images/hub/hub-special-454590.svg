<svg xmlns="http://www.w3.org/2000/svg" width="420" height="340" viewBox="0 0 420 340">
<title>45-45-90 special right triangle</title>
<desc>Isosceles right triangle with both legs 7 cm and hypotenuse 7 root 2, about 9.90 cm. Both acute angles are 45 degrees.</desc>
<polygon points="90.0,91.0 279.0,280.0 90.0,280.0" fill="rgba(241,201,125,0.07)" />
<line x1="90.0" y1="280.0" x2="279.0" y2="280.0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
<line x1="90.0" y1="280.0" x2="90.0" y2="91.0" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
<line x1="90.0" y1="91.0" x2="279.0" y2="280.0" stroke="#f472b6" stroke-width="3" stroke-linecap="round" />
<polyline points="90.0,255.0 115.0,255.0 115.0,280.0" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
<text x="184.0" y="308.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="normal">7 cm</text>
<text x="74.0" y="192.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#ffffff" text-anchor="end" font-weight="normal">7 cm</text>
<text x="206.0" y="164.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="normal">7√2 ≈ 9.90 cm</text>
<polyline points="114.7,115.7 112.7,117.6 110.6,119.3 108.3,120.8 105.9,122.2 103.4,123.3 100.8,124.3 98.2,125.0 95.5,125.6 92.7,125.9 90.0,126.0" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
<text x="110.0" y="139.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#d0c5af" text-anchor="middle" font-weight="normal">45°</text>
<polyline points="244.0,280.0 244.1,277.3 244.4,274.5 245.0,271.8 245.7,269.2 246.7,266.6 247.8,264.1 249.2,261.7 250.7,259.4 252.4,257.3 254.3,255.3" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
<text x="231.0" y="260.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#d0c5af" text-anchor="middle" font-weight="normal">45°</text>
</svg>
