<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Parts of a right triangle</title>
<desc>Right triangle with legs a and b, hypotenuse c, right angle marker, and acute angles A and B labeled.</desc>

<polygon points="350,500 850,500 350,120" fill="rgba(241,201,125,0.07)"/>
<line x1="350" y1="500" x2="850" y2="500" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
<line x1="350" y1="500" x2="350" y2="120" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
<line x1="850" y1="500" x2="350" y2="120" stroke="#f472b6" stroke-width="5" stroke-linecap="round"/>
<polyline points="350,472 378,472 378,500" stroke="#ffffff" stroke-width="2.5" fill="none"/>
<circle cx="350" cy="500" r="7" fill="#f1c97d"/>
<circle cx="850" cy="500" r="7" fill="#f1c97d"/>
<circle cx="350" cy="120" r="7" fill="#f1c97d"/>
<text x="600.0" y="545" font-family="Noto Serif, Georgia, serif" font-size="36" fill="#38bdf8" text-anchor="middle" font-style="italic">a</text>
<text x="315" y="310.0" font-family="Noto Serif, Georgia, serif" font-size="36" fill="#fbbf24" text-anchor="middle" font-style="italic">b</text>
<text x="650.0" y="310.0" font-family="Noto Serif, Georgia, serif" font-size="36" fill="#f472b6" text-anchor="middle" font-style="italic">c</text>
<text x="390" y="185" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">B</text>
<text x="805" y="460" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text>
<text x="390" y="465" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">C</text>
<path d="M 358 165 Q 380 160 395 138" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7"/>
<path d="M 805 492 Q 810 470 832 455" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7"/>
</svg>