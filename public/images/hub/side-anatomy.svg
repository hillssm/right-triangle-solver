<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Parts of a right triangle</title>
<desc>Right triangle with legs a and b, hypotenuse c, right angle marker, and acute angles A and B labeled.</desc>

<polygon points="400,500 700,500 400,100" fill="rgba(241,201,125,0.07)"/>
<line x1="400" y1="500" x2="700" y2="500" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
<line x1="400" y1="500" x2="400" y2="100" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
<line x1="700" y1="500" x2="400" y2="100" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
<polyline points="400,475 425,475 425,500" stroke="#ffffff" stroke-width="2" fill="none"/>
<text x="550" y="535" font-family="Noto Serif, Georgia, serif" font-size="28" fill="#38bdf8" text-anchor="middle" font-style="italic">a</text>
<text x="365" y="300" font-family="Noto Serif, Georgia, serif" font-size="28" fill="#fbbf24" text-anchor="end" font-style="italic">b</text>
<text x="580" y="280" font-family="Noto Serif, Georgia, serif" font-size="28" fill="#f472b6" text-anchor="middle" font-style="italic">c</text>
<text x="435" y="160" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text>
<text x="660" y="465" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">B</text>
<text x="385" y="545" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#ffffff" text-anchor="end">C = 90°</text>
<text x="850" y="150" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#ffffff" text-anchor="start" font-weight="bold">Legend</text>
<line x1="850" y1="185" x2="890" y2="185" stroke="#38bdf8" stroke-width="4"/>
<text x="905" y="192" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#d0c5af" text-anchor="start">Leg a (horizontal)</text>
<line x1="850" y1="225" x2="890" y2="225" stroke="#fbbf24" stroke-width="4"/>
<text x="905" y="232" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#d0c5af" text-anchor="start">Leg b (vertical)</text>
<line x1="850" y1="265" x2="890" y2="265" stroke="#f472b6" stroke-width="4"/>
<text x="905" y="272" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#d0c5af" text-anchor="start">Hypotenuse c (longest)</text>
<text x="850" y="320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#d0c5af" text-anchor="start">A, B: acute angles</text>
<text x="850" y="350" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#d0c5af" text-anchor="start">C: right angle (90°)</text>
</svg>