<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Parts of a right triangle</title>
<desc>Right triangle with legs a and b, hypotenuse c, right angle marker, and acute angles A and B labeled.</desc>

<polygon points="300,450 580,450 300,130" fill="rgba(241,201,125,0.07)"/>
<line x1="300" y1="450" x2="580" y2="450" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
<line x1="300" y1="450" x2="300" y2="130" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
<line x1="580" y1="450" x2="300" y2="130" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
<polyline points="300,430 320,430 320,450" stroke="#ffffff" stroke-width="2" fill="none"/>
<text x="440.0" y="485" font-family="Noto Serif, Georgia, serif" font-size="30" fill="#38bdf8" text-anchor="middle" font-style="italic">a</text>
<text x="275" y="290.0" font-family="Noto Serif, Georgia, serif" font-size="30" fill="#fbbf24" text-anchor="middle" font-style="italic">b</text>
<text x="480.0" y="290.0" font-family="Noto Serif, Georgia, serif" font-size="30" fill="#f472b6" text-anchor="middle" font-style="italic">c</text>
<text x="330" y="180" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text>
<text x="545" y="420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">B</text>
<text x="290" y="495" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#ffffff" text-anchor="end">C = 90°</text>
<text x="750" y="180" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#ffffff" text-anchor="start" font-weight="bold">Legend</text>
<line x1="750" y1="210" x2="790" y2="210" stroke="#38bdf8" stroke-width="4"/>
<text x="805" y="217" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#d0c5af" text-anchor="start">Leg a</text>
<line x1="750" y1="245" x2="790" y2="245" stroke="#fbbf24" stroke-width="4"/>
<text x="805" y="252" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#d0c5af" text-anchor="start">Leg b</text>
<line x1="750" y1="280" x2="790" y2="280" stroke="#f472b6" stroke-width="4"/>
<text x="805" y="287" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#d0c5af" text-anchor="start">Hypotenuse c</text>
<text x="750" y="330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#d0c5af" text-anchor="start">A, B: acute angles</text>
<text x="750" y="360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#d0c5af" text-anchor="start">C: right angle</text>
</svg>