<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Right triangle calculations in everyday life</title>
<desc>Four panels: ladder against wall, room diagonal, roof rafter, garden path.</desc>

<text x="180" y="60" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">Ladder</text>
<line x1="80" y1="280" x2="188.0" y2="280" stroke="#38bdf8" stroke-width="3"/>
<line x1="80" y1="280" x2="80" y2="136.0" stroke="#fbbf24" stroke-width="3"/>
<line x1="188.0" y1="280" x2="80" y2="136.0" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
<polyline points="80,265 95,265 95,280" stroke="#ffffff" stroke-width="2" fill="none"/>
<text x="134.0" y="302" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#38bdf8" text-anchor="middle">1.8 m</text>
<text x="70" y="208.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#fbbf24" text-anchor="end">2.4 m</text>
<text x="159.0" y="208.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#f472b6" text-anchor="middle" font-weight="bold">3 m</text>
<text x="750" y="60" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">Room diagonal</text>
<rect x="650" y="100" width="108" height="144" fill="rgba(241,201,125,0.07)" stroke="#ffffff" stroke-width="2"/>
<line x1="650" y1="244" x2="758" y2="100" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
<text x="704.0" y="266" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#38bdf8" text-anchor="middle">9 ft</text>
<text x="640" y="172.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#fbbf24" text-anchor="end">12 ft</text>
<text x="734.0" y="162.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#f472b6" text-anchor="middle" font-weight="bold">15 ft</text>
<text x="180" y="380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">Roof rafter</text>
<line x1="80" y1="550" x2="200" y2="550" stroke="#38bdf8" stroke-width="3"/>
<line x1="80" y1="550" x2="80" y2="500" stroke="#fbbf24" stroke-width="3"/>
<line x1="200" y1="550" x2="80" y2="500" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
<polyline points="80,535 95,535 95,550" stroke="#ffffff" stroke-width="2" fill="none"/>
<text x="140.0" y="572" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#38bdf8" text-anchor="middle">12 ft</text>
<text x="70" y="525.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#fbbf24" text-anchor="end">5 ft</text>
<text x="160.0" y="525.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#f472b6" text-anchor="middle" font-weight="bold">13 ft</text>
<text x="750" y="380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">Garden path</text>
<rect x="650" y="400" width="90" height="120" fill="rgba(241,201,125,0.07)" stroke="#ffffff" stroke-width="2"/>
<line x1="650" y1="520" x2="740" y2="400" stroke="#f472b6" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 5"/>
<text x="695.0" y="542" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#38bdf8" text-anchor="middle">30 ft</text>
<text x="640" y="460.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#fbbf24" text-anchor="end">40 ft</text>
<text x="720.0" y="460.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#f472b6" text-anchor="middle" font-weight="bold">50 ft</text>
</svg>