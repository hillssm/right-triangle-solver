<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Finding a missing leg using the hypotenuse</title>
<desc>Two right triangles: 5-12-13 finding leg b, and 8-15-17 finding leg a.</desc>

<text x="308" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">Find leg b</text>
<polygon points="200,450 200,360 416,450" fill="rgba(241,201,125,0.07)"/>
<line x1="200" y1="450" x2="200" y2="360" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
<line x1="200" y1="450" x2="416" y2="450" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 6"/>
<line x1="200" y1="360" x2="416" y2="450" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
<polyline points="200,432 218,432 218,450" stroke="#ffffff" stroke-width="2" fill="none"/>
<text x="185" y="405.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#fbbf24" text-anchor="end">a = 5</text>
<text x="308.0" y="478" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#38bdf8" text-anchor="middle" font-weight="bold">b = ?</text>
<text x="333.0" y="397.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#f472b6" text-anchor="middle">c = 13</text>
<text x="308" y="520" font-family="Noto Serif, Georgia, serif" font-size="20" fill="#ffffff" text-anchor="middle" font-style="italic">b = √(13² − 5²) = 12</text>
<line x1="600" y1="80" x2="600" y2="550" stroke="#d0c5af" stroke-width="1" opacity="0.3"/>
<text x="897" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">Find leg a</text>
<polygon points="800,450 995,450 800,346" fill="rgba(241,201,125,0.07)"/>
<line x1="800" y1="450" x2="995" y2="450" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
<line x1="800" y1="450" x2="800" y2="346" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 6"/>
<line x1="995" y1="450" x2="800" y2="346" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
<polyline points="800,432 818,432 818,450" stroke="#ffffff" stroke-width="2" fill="none"/>
<text x="897.5" y="478" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#fbbf24" text-anchor="middle">b = 15</text>
<text x="785" y="398.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#38bdf8" text-anchor="end" font-weight="bold">a = ?</text>
<text x="927.5" y="398.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#f472b6" text-anchor="middle">c = 17</text>
<text x="897" y="520" font-family="Noto Serif, Georgia, serif" font-size="20" fill="#ffffff" text-anchor="middle" font-style="italic">a = √(17² − 15²) = 8</text>
</svg>