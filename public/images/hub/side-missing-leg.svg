<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Finding a missing leg using the hypotenuse</title>
<desc>Two right triangles: 5-12-13 finding leg b, and 8-15-17 finding leg a.</desc>

<text x="318" y="90" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">Find leg b</text>
<polygon points="150,500 150,360 486,500" fill="rgba(241,201,125,0.07)"/>
<line x1="150" y1="500" x2="150" y2="360" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
<line x1="150" y1="500" x2="486" y2="500" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 8"/>
<line x1="150" y1="360" x2="486" y2="500" stroke="#f472b6" stroke-width="5" stroke-linecap="round"/>
<polyline points="150,476 174,476 174,500" stroke="#ffffff" stroke-width="2.5" fill="none"/>
<text x="130" y="430.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#fbbf24" text-anchor="end">a = 5</text>
<text x="318.0" y="535" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#38bdf8" text-anchor="middle" font-weight="bold">b = ?</text>
<text x="353.0" y="420.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#f472b6" text-anchor="middle">c = 13</text>
<text x="318" y="570" font-family="Noto Serif, Georgia, serif" font-size="24" fill="#ffffff" text-anchor="middle" font-style="italic">b = √(13² − 5²) = 12</text>
<line x1="600" y1="60" x2="600" y2="590" stroke="#d0c5af" stroke-width="1" opacity="0.3"/>
<text x="895" y="90" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">Find leg a</text>
<polygon points="730,500 1060,500 730,324" fill="rgba(241,201,125,0.07)"/>
<line x1="730" y1="500" x2="1060" y2="500" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
<line x1="730" y1="500" x2="730" y2="324" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 8"/>
<line x1="1060" y1="500" x2="730" y2="324" stroke="#f472b6" stroke-width="5" stroke-linecap="round"/>
<polyline points="730,476 754,476 754,500" stroke="#ffffff" stroke-width="2.5" fill="none"/>
<text x="895.0" y="535" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#fbbf24" text-anchor="middle">b = 15</text>
<text x="710" y="412.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#38bdf8" text-anchor="end" font-weight="bold">a = ?</text>
<text x="935.0" y="412.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#f472b6" text-anchor="middle">c = 17</text>
<text x="895" y="570" font-family="Noto Serif, Georgia, serif" font-size="24" fill="#ffffff" text-anchor="middle" font-style="italic">a = √(17² − 15²) = 8</text>
</svg>