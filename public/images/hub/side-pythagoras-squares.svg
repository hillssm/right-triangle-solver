<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Pythagorean theorem with squares</title>
<desc>3-4-5 right triangle with squares on each side showing areas 9, 16, and 25.</desc>

<polygon points="400,420 520,420 520,540 400,540" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="2"/>
<text x="460.0" y="490.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" fill="#38bdf8" text-anchor="middle" font-weight="bold">9</text>
<text x="460.0" y="575" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#d0c5af" text-anchor="middle">3² = 9</text>
<polygon points="400,420 400,260 240,260 240,420" fill="rgba(251,191,36,0.12)" stroke="#fbbf24" stroke-width="2"/>
<text x="320.0" y="350.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" fill="#fbbf24" text-anchor="middle" font-weight="bold">16</text>
<text x="225" y="350.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#d0c5af" text-anchor="end">4² = 16</text>
<polygon points="520,420 400,260 560.0,140.0 680.0,300.0" fill="rgba(244,114,182,0.12)" stroke="#f472b6" stroke-width="2"/>
<text x="540.0" y="290.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" fill="#f472b6" text-anchor="middle" font-weight="bold">25</text>
<text x="695.0" y="300.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#d0c5af" text-anchor="start">5² = 25</text>
<polygon points="400,420 520,420 400,260" fill="rgba(241,201,125,0.07)" stroke="#ffffff" stroke-width="2"/>
<polyline points="400,400 420,400 420,420" stroke="#ffffff" stroke-width="2" fill="none"/>
<text x="460.0" y="408" font-family="Noto Serif, Georgia, serif" font-size="22" fill="#38bdf8" text-anchor="middle" font-style="italic">3</text>
<text x="388" y="340.0" font-family="Noto Serif, Georgia, serif" font-size="22" fill="#fbbf24" text-anchor="end" font-style="italic">4</text>
<text x="485.0" y="340.0" font-family="Noto Serif, Georgia, serif" font-size="22" fill="#f472b6" text-anchor="middle" font-style="italic">5</text>
<text x="600" y="600" font-family="Noto Serif, Georgia, serif" font-size="28" fill="#ffffff" text-anchor="middle" font-style="italic">3² + 4² = 5²</text>
<text x="850" y="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#d0c5af" text-anchor="middle">9 + 16 = 25</text>
</svg>