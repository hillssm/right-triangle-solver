<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Pythagorean theorem with squares</title>
<desc>3-4-5 right triangle with squares on each side showing areas 9, 16, and 25.</desc>

<polygon points="480,440 645,440 645,605 480,605" fill="rgba(56,189,248,0.14)" stroke="#38bdf8" stroke-width="3"/>
<text x="562.5" y="534.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" fill="#38bdf8" text-anchor="middle" font-weight="bold">9</text>
<polygon points="480,440 480,220 260,220 260,440" fill="rgba(251,191,36,0.14)" stroke="#fbbf24" stroke-width="3"/>
<text x="370.0" y="342.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" fill="#fbbf24" text-anchor="middle" font-weight="bold">16</text>
<polygon points="645,440 480,220 700.0,55.0 865.0,275.0" fill="rgba(244,114,182,0.14)" stroke="#f472b6" stroke-width="3"/>
<text x="672.5" y="259.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" fill="#f472b6" text-anchor="middle" font-weight="bold">25</text>
<polygon points="480,440 645,440 480,220" fill="rgba(241,201,125,0.07)" stroke="#ffffff" stroke-width="3"/>
<polyline points="480,420 500,420 500,440" stroke="#ffffff" stroke-width="2.5" fill="none"/>
<text x="562.5" y="425" font-family="Noto Serif, Georgia, serif" font-size="28" fill="#38bdf8" text-anchor="middle" font-style="italic">3</text>
<text x="462" y="330.0" font-family="Noto Serif, Georgia, serif" font-size="28" fill="#fbbf24" text-anchor="end" font-style="italic">4</text>
<text x="592.5" y="330.0" font-family="Noto Serif, Georgia, serif" font-size="28" fill="#f472b6" text-anchor="middle" font-style="italic">5</text>
</svg>