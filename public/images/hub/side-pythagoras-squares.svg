<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Pythagorean theorem with squares</title>
<desc>3-4-5 right triangle with squares on each side showing areas 9, 16, and 25.</desc>

<polygon points="500,400 605,400 605,505 500,505" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="2"/>
<text x="552.5" y="462.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#38bdf8" text-anchor="middle" font-weight="bold">9</text>
<text x="552.5" y="535" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#d0c5af" text-anchor="middle">3² = 9</text>
<polygon points="500,400 500,260 360,260 360,400" fill="rgba(251,191,36,0.12)" stroke="#fbbf24" stroke-width="2"/>
<text x="430.0" y="340.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#fbbf24" text-anchor="middle" font-weight="bold">16</text>
<text x="430.0" y="240" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#d0c5af" text-anchor="middle">4² = 16</text>
<polygon points="605,400 500,260 640.0,155.0 745.0,295.0" fill="rgba(244,114,182,0.12)" stroke="#f472b6" stroke-width="2"/>
<text x="622.5" y="287.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#f472b6" text-anchor="middle" font-weight="bold">25</text>
<text x="622.5" y="430" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#d0c5af" text-anchor="middle">5² = 25</text>
<polygon points="500,400 605,400 500,260" fill="rgba(241,201,125,0.07)" stroke="#ffffff" stroke-width="2"/>
<polyline points="500,385 515,385 515,400" stroke="#ffffff" stroke-width="2" fill="none"/>
<text x="552.5" y="388" font-family="Noto Serif, Georgia, serif" font-size="20" fill="#38bdf8" text-anchor="middle" font-style="italic">3</text>
<text x="488" y="330.0" font-family="Noto Serif, Georgia, serif" font-size="20" fill="#fbbf24" text-anchor="end" font-style="italic">4</text>
<text x="572.5" y="330.0" font-family="Noto Serif, Georgia, serif" font-size="20" fill="#f472b6" text-anchor="middle" font-style="italic">5</text>
<text x="600" y="590" font-family="Noto Serif, Georgia, serif" font-size="26" fill="#ffffff" text-anchor="middle" font-style="italic">3² + 4² = 5²</text>
<text x="600" y="615" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#d0c5af" text-anchor="middle">9 + 16 = 25</text>
</svg>