<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="52" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Projections p = 9, q = 16</text>
  <polygon points="250,470 950,470 502,134" fill="#ffffff" fill-opacity="0.04" stroke="none"/>
  <polygon points="250,470 950,470 502,134" fill="none" stroke="#f1c97d" stroke-width="8" stroke-linejoin="round"/>
  <line x1="502" y1="134" x2="502" y2="470" stroke="#4ade80" stroke-width="6" stroke-dasharray="10 8" stroke-linecap="round"/>
  <polyline points="488.8,151.6 506.4,164.8 519.6,147.2" fill="none" stroke="#ffffff" stroke-width="3"/>
  <polyline points="480,470 480,448 502,448" fill="none" stroke="#ffffff" stroke-width="3"/>
  <circle cx="250" cy="470" r="9" fill="#f1c97d"/>
  <circle cx="950" cy="470" r="9" fill="#f1c97d"/>
  <circle cx="502" cy="134" r="9" fill="#f1c97d"/>
  <circle cx="502" cy="470" r="7" fill="#4ade80"/>
  <text x="222" y="518" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="978" y="518" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="502" y="102" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="530" y="518" font-size="20" font-weight="700" fill="#4ade80" text-anchor="middle">D</text>
  <text x="376" y="518" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="middle">p = 9</text>
  <text x="726" y="518" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="middle">q = 16</text>
  <text x="466" y="302" font-size="28" font-weight="700" fill="#4ade80" text-anchor="middle">h = 12</text>
  <text x="348" y="315" font-size="26" font-weight="700" fill="#7dd3fc" text-anchor="middle">a = 15</text>
  <text x="754" y="315" font-size="26" font-weight="700" fill="#7dd3fc" text-anchor="middle">b = 20</text>
  <text x="726" y="448" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">c = 25</text>
  <rect x="24" y="96" width="300" height="210" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>
  <text x="174" y="152" font-size="28" font-weight="700" fill="#f1c97d" text-anchor="middle">c = 9 + 16 = 25</text>
  <text x="174" y="198" font-size="25" font-weight="700" fill="#4ade80" text-anchor="middle">h = √(9 × 16) = 12</text>
  <text x="174" y="240" font-size="19" font-weight="400" fill="#a3a3a3" text-anchor="middle">geometric mean</text>
  <text x="174" y="272" font-size="20" font-weight="400" fill="#ffffff" text-anchor="middle">9² + 12² = 15²</text>
  <text x="600" y="600" font-size="22" fill="#a3a3a3" text-anchor="middle">c = 9 + 16 = 25 and h = sqrt(9 x 16) = 12 on one triangle.</text>
</svg>
