<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="52" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Projection Theorem: a² = c·p, b² = c·q</text>
  <polygon points="330,470 870,470 546,158" fill="#ffffff" fill-opacity="0.04" stroke="none"/>
  <polygon points="330,470 870,470 546,158" fill="none" stroke="#f1c97d" stroke-width="8" stroke-linejoin="round"/>
  <line x1="546" y1="158" x2="546" y2="470" stroke="#4ade80" stroke-width="6" stroke-dasharray="10 8" stroke-linecap="round"/>
  <polyline points="532.8,175.6 550.4,188.8 563.6,171.2" fill="none" stroke="#ffffff" stroke-width="3"/>
  <polyline points="524,470 524,448 546,448" fill="none" stroke="#ffffff" stroke-width="3"/>
  <circle cx="330" cy="470" r="9" fill="#f1c97d"/>
  <circle cx="870" cy="470" r="9" fill="#f1c97d"/>
  <circle cx="546" cy="158" r="9" fill="#f1c97d"/>
  <circle cx="546" cy="470" r="7" fill="#4ade80"/>
  <text x="438" y="518" font-size="24" font-weight="700" fill="#f1c97d" text-anchor="middle">p = 9</text>
  <text x="708" y="518" font-size="24" font-weight="700" fill="#f1c97d" text-anchor="middle">q = 16</text>
  <text x="600" y="448" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">c = 25</text>
  <text x="420" y="330" font-size="30" font-weight="700" fill="#7dd3fc" text-anchor="middle">a</text>
  <text x="770" y="330" font-size="30" font-weight="700" fill="#7dd3fc" text-anchor="middle">b</text>
  <rect x="24" y="120" width="276" height="210" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>
  <text x="162" y="172" font-size="28" font-weight="700" fill="#7dd3fc" text-anchor="middle">a² = c · p</text>
  <text x="162" y="216" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">a² = 25 × 9 = 225</text>
  <text x="162" y="258" font-size="28" font-weight="700" fill="#f1c97d" text-anchor="middle">a = 15</text>
  <text x="162" y="296" font-size="18" font-weight="400" fill="#a3a3a3" text-anchor="middle">leg a pairs with p</text>
  <rect x="900" y="120" width="276" height="210" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>
  <text x="1038" y="172" font-size="28" font-weight="700" fill="#7dd3fc" text-anchor="middle">b² = c · q</text>
  <text x="1038" y="216" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">b² = 25 × 16 = 400</text>
  <text x="1038" y="258" font-size="28" font-weight="700" fill="#f1c97d" text-anchor="middle">b = 20</text>
  <text x="1038" y="296" font-size="18" font-weight="400" fill="#a3a3a3" text-anchor="middle">leg b pairs with q</text>
  <text x="600" y="600" font-size="22" fill="#a3a3a3" text-anchor="middle">Leg a = sqrt(25 x 9) = 15; leg b = sqrt(25 x 16) = 20.</text>
</svg>
