<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="52" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Segment Addition: c = p + q</text>
  <line x1="180" y1="300" x2="1020" y2="300" stroke="#f1c97d" stroke-width="10" stroke-linecap="round"/>
  <line x1="180" y1="272" x2="180" y2="328" stroke="#ffffff" stroke-width="4"/>
  <line x1="540" y1="272" x2="540" y2="328" stroke="#ffffff" stroke-width="4"/>
  <line x1="1020" y1="272" x2="1020" y2="328" stroke="#ffffff" stroke-width="4"/>
  <polyline points="180,348 180,364 540,364 540,348" fill="none" stroke="#4ade80" stroke-width="3"/>
  <polyline points="540,348 540,364 1020,364 1020,348" fill="none" stroke="#7dd3fc" stroke-width="3"/>
  <polyline points="180,400 180,416 1020,416 1020,400" fill="none" stroke="#f1c97d" stroke-width="3"/>
  <text x="180" y="258" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="540" y="258" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>
  <text x="1020" y="258" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="360" y="342" font-size="26" font-weight="700" fill="#4ade80" text-anchor="middle">p</text>
  <text x="780" y="342" font-size="26" font-weight="700" fill="#7dd3fc" text-anchor="middle">q</text>
  <text x="600" y="394" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="middle">c</text>
  <text x="600" y="470" font-size="32" font-weight="700" fill="#f1c97d" text-anchor="middle">c = p + q</text>
  <text x="600" y="508" font-size="20" font-weight="400" fill="#a3a3a3" text-anchor="middle">the whole hypotenuse equals the sum of its two parts</text>
  <text x="600" y="600" font-size="22" fill="#a3a3a3" text-anchor="middle">A point between A and B splits the segment: AB = AD + DB.</text>
</svg>
