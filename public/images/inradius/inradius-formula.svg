<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="58" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Inradius Formula: r = (a + b - c) / 2</text>
  <polygon points="690.0,540 360,100.0 360,540" fill="#ffffff" fill-opacity="0.04" stroke="none"/>  <polygon points="690.0,540 360,100.0 360,540" fill="none" stroke="#f1c97d" stroke-width="7" stroke-linejoin="round"/>  <circle cx="470.0" cy="430.0" r="110.0" fill="none" stroke="#4ade80" stroke-width="4"/>  <circle cx="470.0" cy="430.0" r="9" fill="#4ade80"/>  <line x1="470.0" y1="430.0" x2="470.0" y2="540.0" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 7"/>  <line x1="470.0" y1="430.0" x2="360.0" y2="430.0" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 7"/>  <line x1="470.0" y1="430.0" x2="558.0" y2="364.0" stroke="#4ade80" stroke-width="6" stroke-linecap="round"/>  <text x="497.2" y="374.6" font-size="26" font-weight="700" fill="#4ade80" text-anchor="middle">r</text>  <polyline points="378.0,540.0 378.0,522.0 360.0,522.0" fill="none" stroke="#ffffff" stroke-width="3"/>  <polyline points="452.0,540.0 452.0,522.0 470.0,522.0" fill="none" stroke="#4ade80" stroke-width="3"/>  <polyline points="360.0,448.0 378.0,448.0 378.0,430.0" fill="none" stroke="#4ade80" stroke-width="3"/>  <polyline points="547.2,349.6 532.8,360.4 543.6,374.8" fill="none" stroke="#4ade80" stroke-width="3"/>  <circle cx="690.0" cy="540" r="9" fill="#f1c97d"/>  <circle cx="360" cy="100.0" r="9" fill="#f1c97d"/>  <circle cx="360" cy="540" r="9" fill="#f1c97d"/>  <text x="716.0" y="548" font-size="26" font-weight="700" fill="#ffffff" text-anchor="start">A</text>  <text x="330" y="108.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>  <text x="330" y="548" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>  <text x="445.0" y="412.0" font-size="26" font-weight="700" fill="#4ade80" text-anchor="middle">I</text>  <text x="525.0" y="588" font-size="28" font-weight="700" fill="#7dd3fc" text-anchor="middle">a = 6</text>  <text x="310" y="320.0" font-size="28" font-weight="700" fill="#f1c97d" text-anchor="middle">b = 8</text>  <text x="583.0" y="277.0" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">c = 10</text>  <rect x="800" y="140" width="340" height="300" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>  <text x="970" y="196" font-size="28" font-weight="700" fill="#f1c97d" text-anchor="middle">r = (a + b - c) / 2</text>  <text x="970" y="244" font-size="22" font-weight="400" fill="#ffffff" text-anchor="middle">a = 6, b = 8, c = 10</text>  <text x="970" y="296" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">r = (6 + 8 - 10) / 2</text>  <text x="970" y="352" font-size="30" font-weight="700" fill="#f1c97d" text-anchor="middle">r = 2</text></svg>
