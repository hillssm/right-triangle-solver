<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="52" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Projection Theorem: b squared = c x q</text>
  <polygon points="220,470 980,470 494,105" fill="#ffffff" fill-opacity="0.04" stroke="none"/>
  <polygon points="220,470 980,470 494,105" fill="none" stroke="#f1c97d" stroke-width="8" stroke-linejoin="round"/>
  <line x1="494" y1="470" x2="980" y2="470" stroke="#4ade80" stroke-width="12" stroke-linecap="round"/>
  <line x1="494" y1="105" x2="494" y2="470" stroke="#4ade80" stroke-width="6" stroke-dasharray="10 8" stroke-linecap="round"/>
  <polyline points="480.8,122.6 498.4,135.8 511.6,118.2" fill="none" stroke="#ffffff" stroke-width="3"/>
  <polyline points="472,470 472,448 494,448" fill="none" stroke="#ffffff" stroke-width="3"/>
  <circle cx="220" cy="470" r="9" fill="#f1c97d"/>
  <circle cx="980" cy="470" r="9" fill="#f1c97d"/>
  <circle cx="494" cy="105" r="9" fill="#f1c97d"/>
  <circle cx="494" cy="470" r="7" fill="#4ade80"/>
  <text x="192" y="518" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="1008" y="518" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="494" y="73" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="522" y="518" font-size="20" font-weight="700" fill="#4ade80" text-anchor="middle">D</text>
  <text x="357" y="518" font-size="28" font-weight="700" fill="#f1c97d" text-anchor="middle">p</text>
  <text x="737" y="518" font-size="28" font-weight="700" fill="#4ade80" text-anchor="middle">q</text>
  <text x="458" y="288" font-size="30" font-weight="700" fill="#4ade80" text-anchor="middle">h</text>
  <text x="329" y="270" font-size="28" font-weight="700" fill="#7dd3fc" text-anchor="middle">a</text>
  <text x="765" y="270" font-size="28" font-weight="700" fill="#7dd3fc" text-anchor="middle">b</text>
  <text x="800" y="448" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">c</text>
  <rect x="836" y="96" width="340" height="204" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>
  <text x="1006" y="150" font-size="32" font-weight="700" fill="#f1c97d" text-anchor="middle">b² = c × q</text>
  <text x="1006" y="192" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">c = whole hypotenuse AB</text>
  <text x="1006" y="230" font-size="20" font-weight="700" fill="#4ade80" text-anchor="middle">q = segment DB for leg b</text>
  <text x="1006" y="268" font-size="18" font-weight="400" fill="#a3a3a3" text-anchor="middle">q is only part of c</text>
  <text x="600" y="600" font-size="22" fill="#a3a3a3" text-anchor="middle">Multiply the whole hypotenuse by the projection for leg b.</text>
</svg>
