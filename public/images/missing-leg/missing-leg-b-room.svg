<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
<title>Rectangular room: 17 ft diagonal, 15 ft known side, 8 ft missing side</title>
<desc>A rectangular room with a 17 foot diagonal. One side is 15 feet, the other side a is 8 feet, found with a = sqrt(17^2 - 15^2).</desc>
<rect x="140" y="144" width="360" height="192" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="3"/>
<line x1="140" y1="336" x2="500" y2="144" stroke="#f1c97d" stroke-width="3"/>
<text x="320" y="128" font-family="Manrope, Arial, sans-serif" font-size="20" fill="#f1c97d" text-anchor="middle" font-weight="bold" style="">a = 8 ft (find)</text>
<text x="520" y="250" font-family="Manrope, Arial, sans-serif" font-size="20" fill="#38bdf8" text-anchor="start" font-weight="normal" style="">b = 15 ft</text>
<text x="310" y="230" font-family="Manrope, Arial, sans-serif" font-size="20" fill="#f1c97d" text-anchor="middle" font-weight="normal" style="">c = 17 ft</text>
<text x="320" y="360" font-family="Manrope, Arial, sans-serif" font-size="14" fill="#a8a29e" text-anchor="middle" font-weight="normal" style="">Room floor plan: diagonal divides the rectangle into two right triangles</text>
</svg>
