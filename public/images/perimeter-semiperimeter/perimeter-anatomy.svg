<text x="348" y="505" fill="#f5f0e6" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">C</text>
<text x="862" y="505" fill="#f5f0e6" font-size="20" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">A</text>
<text x="340" y="320" fill="#f1c97d" font-size="26" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">a</text>
<text x="605" y="528" fill="#86c5be" font-size="26" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">b</text>
<text x="638" y="295" fill="#f5f0e6" font-size="26" font-family="Manrope,Arial,sans-serif" text-anchor="middle" font-weight="bold">c</text>
<text x="905" y="270" fill="#f1c97d" font-size="30" font-family="Manrope,Arial,sans-serif" text-anchor="start" font-weight="bold">P = a + b + c</text>
<text x="905" y="318" fill="#f5f0e6" font-size="24" font-family="Manrope,Arial,sans-serif" text-anchor="start" font-weight="bold">s = P / 2</text>
