<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="50" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Perimeter vs. Area: Outside Boundary vs. Inside Surface</text>

<rect x="20" y="64" width="560" height="548" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>
<text x="300" y="108" font-size="23" font-weight="700" fill="#f1c97d" text-anchor="middle">PERIMETER: the walk around</text>
<polygon points="116,534 484,258 484,534" fill="#ffffff" fill-opacity="0.05"/>
<polygon points="116,534 484,258 484,534" fill="none" stroke="#f1c97d" stroke-width="14" stroke-linejoin="round" opacity="0.28"/>
<line x1="116" y1="534" x2="484" y2="534" stroke="#4ade80" stroke-width="7" stroke-linecap="round"/>
<line x1="484" y1="534" x2="484" y2="258" stroke="#7dd3fc" stroke-width="7" stroke-linecap="round"/>
<line x1="116" y1="534" x2="484" y2="258" stroke="#f1c97d" stroke-width="7" stroke-linecap="round"/>
<circle cx="92" cy="536" r="8" fill="#f1c97d"/>
<text x="92" y="544" font-size="22" font-weight="700" fill="#131313" text-anchor="middle">A</text>
<circle cx="510" cy="536" r="8" fill="#f1c97d"/>
<text x="510" y="544" font-size="22" font-weight="700" fill="#131313" text-anchor="middle">C</text>
<circle cx="486" cy="232" r="8" fill="#f1c97d"/>
<text x="486" y="240" font-size="22" font-weight="700" fill="#131313" text-anchor="middle">B</text>
<text x="300.0" y="574" font-size="23" font-weight="700" fill="#4ade80" text-anchor="middle">b = 4</text>
<text x="514" y="404.0" font-size="23" font-weight="700" fill="#7dd3fc" text-anchor="start">a = 3</text>
<text x="248.0" y="386.0" font-size="23" font-weight="700" fill="#f1c97d" text-anchor="middle">c = 5</text>
<polyline points="462,534 462,512 484,512" fill="none" stroke="#ffffff" stroke-width="3"/>
<text x="300" y="564" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">P = 3 + 4 + 5 = 12</text>
<text x="300" y="596" font-size="19" fill="#a3a3a3" text-anchor="middle">distance around the edge</text>
<rect x="620" y="64" width="560" height="548" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>
<text x="900" y="108" font-size="23" font-weight="700" fill="#f1c97d" text-anchor="middle">AREA: the ground inside</text>
<polygon points="716,534 1084,258 1084,534" fill="#f1c97d" fill-opacity="0.22"/>
<line x1="716" y1="534" x2="1084" y2="534" stroke="#4ade80" stroke-width="7" stroke-linecap="round"/>
<line x1="1084" y1="534" x2="1084" y2="258" stroke="#7dd3fc" stroke-width="7" stroke-linecap="round"/>
<line x1="716" y1="534" x2="1084" y2="258" stroke="#f1c97d" stroke-width="7" stroke-linecap="round"/>
<circle cx="692" cy="536" r="8" fill="#f1c97d"/>
<text x="692" y="544" font-size="22" font-weight="700" fill="#131313" text-anchor="middle">A</text>
<circle cx="1110" cy="536" r="8" fill="#f1c97d"/>
<text x="1110" y="544" font-size="22" font-weight="700" fill="#131313" text-anchor="middle">C</text>
<circle cx="1086" cy="232" r="8" fill="#f1c97d"/>
<text x="1086" y="240" font-size="22" font-weight="700" fill="#131313" text-anchor="middle">B</text>
<text x="900.0" y="574" font-size="23" font-weight="700" fill="#4ade80" text-anchor="middle">b = 4</text>
<text x="1114" y="404.0" font-size="23" font-weight="700" fill="#7dd3fc" text-anchor="start">a = 3</text>
<text x="848.0" y="386.0" font-size="23" font-weight="700" fill="#f1c97d" text-anchor="middle">c = 5</text>
<polyline points="1062,534 1062,512 1084,512" fill="none" stroke="#ffffff" stroke-width="3"/>
<text x="900" y="564" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">K = 3 x 4 / 2 = 6</text>
<text x="900" y="596" font-size="19" fill="#a3a3a3" text-anchor="middle">surface inside the boundary</text>
</svg>
