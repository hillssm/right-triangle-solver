<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="58" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Similar Triangles Prove p = a Squared Over c</text>
  <polygon points="90,440 560,440 259,214" fill="#ffffff" fill-opacity="0.04" stroke="none"/>  <polygon points="90,440 560,440 259,214" fill="none" stroke="#f1c97d" stroke-width="7" stroke-linejoin="round"/>  <line x1="259" y1="214" x2="259" y2="440" stroke="#4ade80" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>  <polyline points="245.8,231.6 263.4,244.8 276.6,227.2" fill="none" stroke="#ffffff" stroke-width="3"/>  <polyline points="237,440 237,418 259,418" fill="none" stroke="#ffffff" stroke-width="3"/>  <circle cx="90" cy="440" r="8" fill="#f1c97d"/>  <circle cx="560" cy="440" r="8" fill="#f1c97d"/>  <circle cx="259" cy="214" r="8" fill="#f1c97d"/>  <circle cx="259" cy="440" r="6" fill="#4ade80"/>  <text x="66" y="488" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>  <text x="576" y="488" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>  <text x="259" y="186" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>  <text x="285" y="488" font-size="20" font-weight="700" fill="#4ade80" text-anchor="middle">D</text>  <text x="174" y="488" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="middle">p</text>  <text x="410" y="488" font-size="26" font-weight="700" fill="#4ade80" text-anchor="middle">q</text>  <text x="325" y="526" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Triangle ABC</text>  <text x="325" y="560" font-size="24" font-weight="700" fill="#f1c97d" text-anchor="middle">p = a² / c</text>  <text x="325" y="592" font-size="20" font-weight="400" fill="#a3a3a3" text-anchor="middle">a = 6, b = 8, c = 10</text>  <polygon points="640,440 775,440 775,260" fill="#ffffff" fill-opacity="0.04" stroke="none"/>  <polygon points="640,440 775,440 775,260" fill="none" stroke="#f1c97d" stroke-width="7" stroke-linejoin="round"/>  <polyline points="753,440 753,418 775,418" fill="none" stroke="#ffffff" stroke-width="3"/>  <circle cx="640" cy="440" r="8" fill="#f1c97d"/>  <circle cx="775" cy="440" r="8" fill="#f1c97d"/>  <circle cx="775" cy="260" r="8" fill="#f1c97d"/>  <text x="616" y="488" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>  <text x="801" y="488" font-size="20" font-weight="700" fill="#4ade80" text-anchor="middle">D</text>  <text x="775" y="232" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>  <text x="708" y="488" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="middle">p</text>  <text x="741" y="350" font-size="26" font-weight="700" fill="#4ade80" text-anchor="middle">h</text>  <text x="678" y="350" font-size="26" font-weight="700" fill="#7dd3fc" text-anchor="middle">a</text>  <text x="708" y="526" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Triangle ACD</text>  <text x="708" y="560" font-size="24" font-weight="700" fill="#f1c97d" text-anchor="middle">p / a = a / c</text>  <text x="708" y="592" font-size="20" font-weight="400" fill="#a3a3a3" text-anchor="middle">3.6/6 = 6/10 = 0.6</text>  <polygon points="1100,440 860,440 860,260" fill="#ffffff" fill-opacity="0.04" stroke="none"/>  <polygon points="1100,440 860,440 860,260" fill="none" stroke="#f1c97d" stroke-width="7" stroke-linejoin="round"/>  <polyline points="882,440 882,418 860,418" fill="none" stroke="#ffffff" stroke-width="3"/>  <circle cx="1100" cy="440" r="8" fill="#f1c97d"/>  <circle cx="860" cy="440" r="8" fill="#f1c97d"/>  <circle cx="860" cy="260" r="8" fill="#f1c97d"/>  <text x="1076" y="488" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>  <text x="886" y="488" font-size="20" font-weight="700" fill="#4ade80" text-anchor="middle">D</text>  <text x="860" y="232" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>  <text x="980" y="488" font-size="26" font-weight="700" fill="#4ade80" text-anchor="middle">q</text>  <text x="826" y="350" font-size="26" font-weight="700" fill="#4ade80" text-anchor="middle">h</text>  <text x="950" y="350" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="middle">b</text>  <text x="980" y="526" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Triangle CBD</text>  <text x="980" y="560" font-size="24" font-weight="700" fill="#f1c97d" text-anchor="middle">q / b = b / c</text>  <text x="980" y="592" font-size="20" font-weight="400" fill="#a3a3a3" text-anchor="middle">6.4/8 = 8/10 = 0.8</text></svg>
