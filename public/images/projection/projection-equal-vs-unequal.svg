<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="52" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Equal vs. Unequal Projections (Hypotenuse 10)</text>
  <polygon points="80,430 580,430 330,180" fill="#ffffff" fill-opacity="0.04" stroke="none"/>  <polygon points="80,430 580,430 330,180" fill="none" stroke="#f1c97d" stroke-width="7" stroke-linejoin="round"/>  <line x1="330" y1="180" x2="330" y2="430" stroke="#4ade80" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>  <circle cx="80" cy="430" r="8" fill="#f1c97d"/>  <circle cx="580" cy="430" r="8" fill="#f1c97d"/>  <circle cx="330" cy="180" r="8" fill="#f1c97d"/>  <circle cx="330" cy="430" r="6" fill="#4ade80"/>  <text x="56" y="474" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>  <text x="604" y="474" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>  <text x="330" y="152" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>  <text x="356" y="474" font-size="20" font-weight="700" fill="#4ade80" text-anchor="middle">D</text>  <text x="205" y="474" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="middle">p</text>  <text x="455" y="474" font-size="26" font-weight="700" fill="#4ade80" text-anchor="middle">q</text>  <text x="330" y="520" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">p = 5, q = 5</text>  <text x="330" y="556" font-size="22" font-weight="700" fill="#f1c97d" text-anchor="middle">a = b = 7.071</text>  <polygon points="640,430 1140,430 740,230" fill="#ffffff" fill-opacity="0.04" stroke="none"/>  <polygon points="640,430 1140,430 740,230" fill="none" stroke="#f1c97d" stroke-width="7" stroke-linejoin="round"/>  <line x1="740" y1="230" x2="740" y2="430" stroke="#4ade80" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>  <circle cx="640" cy="430" r="8" fill="#f1c97d"/>  <circle cx="1140" cy="430" r="8" fill="#f1c97d"/>  <circle cx="740" cy="230" r="8" fill="#f1c97d"/>  <circle cx="740" cy="430" r="6" fill="#4ade80"/>  <text x="616" y="474" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>  <text x="1164" y="474" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>  <text x="740" y="202" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>  <text x="766" y="474" font-size="20" font-weight="700" fill="#4ade80" text-anchor="middle">D</text>  <text x="690" y="474" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="middle">p</text>  <text x="940" y="474" font-size="26" font-weight="700" fill="#4ade80" text-anchor="middle">q</text>  <text x="890" y="520" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">p = 2, q = 8</text>  <text x="890" y="556" font-size="22" font-weight="700" fill="#f1c97d" text-anchor="middle">a = 4.472, b = 8.944</text>  <text x="600" y="600" font-size="22" fill="#a3a3a3" text-anchor="middle">Same hypotenuse 10: equal p and q give equal legs.</text>
</svg>
