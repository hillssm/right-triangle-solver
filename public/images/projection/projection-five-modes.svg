<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="52" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Five Calculator Modes: Pick Your Known Values</text>
  <rect x="90" y="100" width="1020" height="80" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>  <text x="130" y="150" font-size="26" font-weight="700" fill="#f1c97d">01</text>  <text x="185" y="150" font-size="25" font-weight="700" fill="#ffffff">Hypotenuse Segment p</text>  <text x="600" y="150" font-size="21" font-weight="400" fill="#a3a3a3">Known: leg a, hypotenuse c</text>  <text x="1070" y="150" font-size="24" font-weight="700" fill="#4ade80" text-anchor="end">p = a² / c  →  p</text>  <rect x="90" y="195" width="1020" height="80" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>  <text x="130" y="245" font-size="26" font-weight="700" fill="#f1c97d">02</text>  <text x="185" y="245" font-size="25" font-weight="700" fill="#ffffff">Hypotenuse Segment q</text>  <text x="600" y="245" font-size="21" font-weight="400" fill="#a3a3a3">Known: leg b, hypotenuse c</text>  <text x="1070" y="245" font-size="24" font-weight="700" fill="#4ade80" text-anchor="end">q = b² / c  →  q</text>  <rect x="90" y="290" width="1020" height="80" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>  <text x="130" y="340" font-size="26" font-weight="700" fill="#f1c97d">03</text>  <text x="185" y="340" font-size="25" font-weight="700" fill="#ffffff">Leg a Squared Projection</text>  <text x="600" y="340" font-size="21" font-weight="400" fill="#a3a3a3">Known: hypotenuse c, projection p</text>  <text x="1070" y="340" font-size="24" font-weight="700" fill="#4ade80" text-anchor="end">a = √(c × p)  →  a</text>  <rect x="90" y="385" width="1020" height="80" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>  <text x="130" y="435" font-size="26" font-weight="700" fill="#f1c97d">04</text>  <text x="185" y="435" font-size="25" font-weight="700" fill="#ffffff">Leg b Squared Projection</text>  <text x="600" y="435" font-size="21" font-weight="400" fill="#a3a3a3">Known: hypotenuse c, projection q</text>  <text x="1070" y="435" font-size="24" font-weight="700" fill="#4ade80" text-anchor="end">b = √(c × q)  →  b</text>  <rect x="90" y="480" width="1020" height="80" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>  <text x="130" y="530" font-size="26" font-weight="700" fill="#f1c97d">05</text>  <text x="185" y="530" font-size="25" font-weight="700" fill="#ffffff">Projections Sum to c</text>  <text x="600" y="530" font-size="21" font-weight="400" fill="#a3a3a3">Known: projection p, projection q</text>  <text x="1070" y="530" font-size="24" font-weight="700" fill="#4ade80" text-anchor="end">c = p + q  →  c</text>  <text x="600" y="600" font-size="22" fill="#a3a3a3" text-anchor="middle">Pick the mode that matches your known values.</text>
</svg>
