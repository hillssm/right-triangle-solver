<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="52" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Similar Triangles Prove the Projection Theorem</text>
  <polygon points="90,430 560,430 280,199" fill="#ffffff" fill-opacity="0.04" stroke="none"/>  <polygon points="90,430 560,430 280,199" fill="none" stroke="#f1c97d" stroke-width="7" stroke-linejoin="round"/>  <line x1="280" y1="199" x2="280" y2="430" stroke="#4ade80" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>  <circle cx="90" cy="430" r="8" fill="#f1c97d"/>  <circle cx="560" cy="430" r="8" fill="#f1c97d"/>  <circle cx="280" cy="199" r="8" fill="#f1c97d"/>  <circle cx="280" cy="430" r="6" fill="#4ade80"/>  <text x="62" y="478" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>  <text x="588" y="478" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>  <text x="280" y="168" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>  <text x="308" y="478" font-size="20" font-weight="700" fill="#4ade80" text-anchor="middle">D</text>  <text x="325" y="540" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Triangle ABC</text>  <polygon points="650,430 830,430 830,210" fill="#ffffff" fill-opacity="0.04" stroke="none"/>  <polygon points="650,430 830,430 830,210" fill="none" stroke="#f1c97d" stroke-width="7" stroke-linejoin="round"/>  <circle cx="650" cy="430" r="8" fill="#f1c97d"/>  <circle cx="830" cy="430" r="8" fill="#f1c97d"/>  <circle cx="830" cy="210" r="8" fill="#f1c97d"/>  <text x="770" y="478" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Triangle ACD</text>  <text x="770" y="540" font-size="24" font-weight="700" fill="#4ade80" text-anchor="middle">p / a = a / c</text>  <polygon points="900,430 1110,430 900,210" fill="#ffffff" fill-opacity="0.04" stroke="none"/>  <polygon points="900,430 1110,430 900,210" fill="none" stroke="#f1c97d" stroke-width="7" stroke-linejoin="round"/>  <circle cx="900" cy="430" r="8" fill="#f1c97d"/>  <circle cx="1110" cy="430" r="8" fill="#f1c97d"/>  <circle cx="900" cy="210" r="8" fill="#f1c97d"/>  <text x="970" y="478" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Triangle CBD</text>  <text x="970" y="540" font-size="24" font-weight="700" fill="#4ade80" text-anchor="middle">q / b = b / c</text>  <text x="740" y="180" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>  <text x="622" y="478" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>  <text x="858" y="478" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>  <text x="900" y="180" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>  <text x="1138" y="478" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>  <text x="872" y="478" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>  <text x="600" y="600" font-size="22" fill="#a3a3a3" text-anchor="middle">Matching sides of similar triangles stay proportional.</text>
</svg>
