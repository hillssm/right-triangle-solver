<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="58" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Euclid's Formula: m = 3, n = 2</text>

  <rect x="450" y="88" width="300" height="60" rx="12" fill="#1c1b1b" stroke="#f1c97d" stroke-width="3"/>
  <text x="600.0" y="126.0" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">m = 3,  n = 2</text>
  <line x1="195" y1="180" x2="1005" y2="180" stroke="#f1c97d" stroke-width="3" stroke-linecap="round"/>
  <line x1="195" y1="180" x2="195" y2="240" stroke="#f1c97d" stroke-width="3" stroke-linecap="round"/>
  <polyline points="187,238 195,250 203,238" fill="none" stroke="#f1c97d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="600" y1="148" x2="600" y2="240" stroke="#f1c97d" stroke-width="3" stroke-linecap="round"/>
  <polyline points="592,238 600,250 608,238" fill="none" stroke="#f1c97d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="1005" y1="180" x2="1005" y2="240" stroke="#f1c97d" stroke-width="3" stroke-linecap="round"/>
  <polyline points="997,238 1005,250 1013,238" fill="none" stroke="#f1c97d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="30" y="250" width="330" height="90" rx="12" fill="#1c1b1b" stroke="#f1c97d" stroke-width="3"/>
  <text x="195.0" y="286.0" font-size="28" font-weight="700" fill="#7dd3fc" text-anchor="middle">a = m² − n²</text>
  <text x="195.0" y="322.0" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">= 9 − 4 = 5</text>
  <rect x="435" y="250" width="330" height="90" rx="12" fill="#1c1b1b" stroke="#f1c97d" stroke-width="3"/>
  <text x="600.0" y="286.0" font-size="28" font-weight="700" fill="#f1c97d" text-anchor="middle">b = 2mn</text>
  <text x="600.0" y="322.0" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">= 2(3)(2) = 12</text>
  <rect x="840" y="250" width="330" height="90" rx="12" fill="#1c1b1b" stroke="#f1c97d" stroke-width="3"/>
  <text x="1005.0" y="286.0" font-size="28" font-weight="700" fill="#4ade80" text-anchor="middle">c = m² + n²</text>
  <text x="1005.0" y="322.0" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">= 9 + 4 = 13</text>
  <line x1="195" y1="340" x2="195" y2="392" stroke="#f1c97d" stroke-width="3" stroke-linecap="round"/>
  <line x1="600" y1="340" x2="600" y2="392" stroke="#f1c97d" stroke-width="3" stroke-linecap="round"/>
  <line x1="1005" y1="340" x2="1005" y2="392" stroke="#f1c97d" stroke-width="3" stroke-linecap="round"/>
  <line x1="195" y1="392" x2="1005" y2="392" stroke="#f1c97d" stroke-width="3" stroke-linecap="round"/>
  <line x1="600" y1="392" x2="600" y2="440" stroke="#f1c97d" stroke-width="3" stroke-linecap="round"/>
  <polyline points="592,438 600,450 608,438" fill="none" stroke="#f1c97d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="450" y="450" width="300" height="60" rx="12" fill="#1c1b1b" stroke="#4ade80" stroke-width="3"/>
  <text x="600.0" y="488.0" font-size="32" font-weight="700" fill="#4ade80" text-anchor="middle">5 : 12 : 13</text>
  <text x="600.0" y="585.0" font-size="28" font-weight="700" fill="#4ade80" text-anchor="middle">m = 3, n = 2 gives 5, 12, 13</text>
</svg>

