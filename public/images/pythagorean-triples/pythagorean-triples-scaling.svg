<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="58" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Scaling 3-4-5 by 2, 3, and 4</text>

  <rect x="60" y="270" width="220" height="90" rx="12" fill="#1c1b1b" stroke="#4ade80" stroke-width="3"/>
  <text x="170.0" y="326.0" font-size="30" font-weight="700" fill="#4ade80" text-anchor="middle">3 : 4 : 5</text>
  <rect x="700" y="140" width="360" height="90" rx="12" fill="#1c1b1b" stroke="#f1c97d" stroke-width="3"/>
  <text x="880.0" y="196.0" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">6-8-10</text>
  <line x1="280.0" y1="315.0" x2="688.5" y2="188.5" stroke="#f1c97d" stroke-width="3" stroke-linecap="round"/>
  <line x1="700.0" y1="185.0" x2="690.5" y2="195.3" stroke="#f1c97d" stroke-width="3" stroke-linecap="round"/>
  <line x1="700.0" y1="185.0" x2="686.3" y2="181.9" stroke="#f1c97d" stroke-width="3" stroke-linecap="round"/>
  <text x="490.0" y="236.0" font-size="30" font-weight="700" fill="#f1c97d" text-anchor="middle">× 2</text>
  <rect x="700" y="280" width="360" height="90" rx="12" fill="#1c1b1b" stroke="#f1c97d" stroke-width="3"/>
  <text x="880.0" y="336.0" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">9-12-15</text>
  <line x1="280.0" y1="315.0" x2="688.0" y2="324.7" stroke="#f1c97d" stroke-width="3" stroke-linecap="round"/>
  <line x1="700.0" y1="325.0" x2="687.7" y2="331.7" stroke="#f1c97d" stroke-width="3" stroke-linecap="round"/>
  <line x1="700.0" y1="325.0" x2="688.0" y2="317.7" stroke="#f1c97d" stroke-width="3" stroke-linecap="round"/>
  <text x="490.0" y="306.0" font-size="30" font-weight="700" fill="#f1c97d" text-anchor="middle">× 3</text>
  <rect x="700" y="420" width="360" height="90" rx="12" fill="#1c1b1b" stroke="#f1c97d" stroke-width="3"/>
  <text x="880.0" y="476.0" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">12-16-20</text>
  <line x1="280.0" y1="315.0" x2="688.7" y2="461.0" stroke="#f1c97d" stroke-width="3" stroke-linecap="round"/>
  <line x1="700.0" y1="465.0" x2="686.2" y2="467.5" stroke="#f1c97d" stroke-width="3" stroke-linecap="round"/>
  <line x1="700.0" y1="465.0" x2="690.9" y2="454.3" stroke="#f1c97d" stroke-width="3" stroke-linecap="round"/>
  <text x="490.0" y="376.0" font-size="30" font-weight="700" fill="#f1c97d" text-anchor="middle">× 4</text>
  <text x="600.0" y="108.0" font-size="28" font-weight="700" fill="#f1c97d" text-anchor="middle">Multiply every side by the same whole number k</text>
  <text x="600.0" y="585.0" font-size="28" font-weight="700" fill="#4ade80" text-anchor="middle">Every scaled set is still a Pythagorean triple</text>
</svg>

