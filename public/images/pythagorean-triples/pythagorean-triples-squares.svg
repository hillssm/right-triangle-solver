<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="58" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Squares on 3, 4, and 5</text>

  <text x="600.0" y="108.0" font-size="30" font-weight="700" fill="#f1c97d" text-anchor="middle">3² + 4² = 5²      9 + 16 = 25</text>
  <polygon points="340.0,410.0 340.0,290.0 220.0,290.0 220.0,410.0" fill="#7dd3fc" fill-opacity="0.10" stroke="none"/>
  <polygon points="340.0,410.0 340.0,290.0 220.0,290.0 220.0,410.0" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linejoin="round"/>
  <text x="270.0" y="358.0" font-size="30" font-weight="700" fill="#7dd3fc" text-anchor="middle">9</text>
  <text x="270.0" y="392.0" font-size="24" font-weight="700" fill="#7dd3fc" text-anchor="middle">3²</text>
  <polygon points="340.0,410.0 500.0,410.0 500.0,570.0 340.0,570.0" fill="#f1c97d" fill-opacity="0.10" stroke="none"/>
  <polygon points="340.0,410.0 500.0,410.0 500.0,570.0 340.0,570.0" fill="none" stroke="#f1c97d" stroke-width="4" stroke-linejoin="round"/>
  <text x="420.0" y="500.0" font-size="30" font-weight="700" fill="#f1c97d" text-anchor="middle">16</text>
  <polygon points="500.0,410.0 340.0,290.0 460.0,130.0 620.0,250.0" fill="#4ade80" fill-opacity="0.10" stroke="none"/>
  <polygon points="500.0,410.0 340.0,290.0 460.0,130.0 620.0,250.0" fill="none" stroke="#4ade80" stroke-width="4" stroke-linejoin="round"/>
  <text x="490.0" y="230.0" font-size="30" font-weight="700" fill="#4ade80" text-anchor="middle">25</text>
  <text x="490.0" y="264.0" font-size="24" font-weight="700" fill="#4ade80" text-anchor="middle">5²</text>
  <polygon points="500.0,410.0 340.0,290.0 340.0,410.0" fill="#ffffff" fill-opacity="0.04" stroke="none"/>
  <polygon points="500.0,410.0 340.0,290.0 340.0,410.0" fill="none" stroke="#f1c97d" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="500.0" cy="410.0" r="9" fill="#f1c97d"/>
  <circle cx="340.0" cy="290.0" r="9" fill="#f1c97d"/>
  <circle cx="340.0" cy="410.0" r="9" fill="#f1c97d"/>
  <text x="530.0" y="418.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="start">A</text>
  <text x="340.0" y="264.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="310.0" y="418.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <polyline points="360.0,410.0 360.0,390.0 340.0,390.0" fill="none" stroke="#ffffff" stroke-width="3"/>
  <text x="600.0" y="612.0" font-size="28" font-weight="700" fill="#4ade80" text-anchor="middle">The two smaller squares add to the largest: 9 + 16 = 25</text>
</svg>

