<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="58" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Circumradius Formula: R = c / 2</text>
  <polygon points="380,200 740,470 380,470" fill="#ffffff" fill-opacity="0.04" stroke="none"/>  <polygon points="380,200 740,470 380,470" fill="none" stroke="#f1c97d" stroke-width="8" stroke-linejoin="round"/>  <circle cx="380" cy="200" r="9" fill="#f1c97d"/>  <circle cx="740" cy="470" r="9" fill="#f1c97d"/>  <circle cx="380" cy="470" r="9" fill="#f1c97d"/>  <circle cx="560" cy="335" r="225" fill="none" stroke="#7dd3fc" stroke-width="6"/>  <circle cx="560" cy="335" r="8" fill="#7dd3fc"/>  <text x="590" y="315" font-size="24" font-weight="700" fill="#7dd3fc" text-anchor="middle">O</text>  <line x1="560" y1="335" x2="380" y2="470" stroke="#7dd3fc" stroke-width="4" stroke-dasharray="8 6" stroke-linecap="round"/>  <text x="430" y="402" font-size="26" font-weight="700" fill="#7dd3fc" text-anchor="middle">R</text>  <polyline points="404,470 404,446 380,446" fill="none" stroke="#ffffff" stroke-width="3"/>  <text x="380" y="176" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>  <text x="772" y="478" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>  <text x="346" y="478" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>  <text x="348" y="335" font-size="28" font-weight="700" fill="#7dd3fc" text-anchor="middle">a</text>  <text x="560" y="514" font-size="28" font-weight="700" fill="#f1c97d" text-anchor="middle">b</text>  <text x="596" y="309" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">c</text>  <rect x="830" y="96" width="336" height="204" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>  <text x="998" y="150" font-size="30" font-weight="700" fill="#f1c97d" text-anchor="middle">R = c / 2</text>  <text x="998" y="192" font-size="20" font-weight="400" fill="#a3a3a3" text-anchor="middle">c = 10 cm</text>  <text x="998" y="234" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">R = 10 / 2 = 5 cm</text>  <text x="998" y="276" font-size="19" font-weight="400" fill="#a3a3a3" text-anchor="middle">hypotenuse is diameter</text>  <text x="600" y="596" font-size="20" font-weight="400" fill="#a3a3a3" text-anchor="middle">AB is the diameter of the circumcircle</text></svg>
