<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="58" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Inradius Formula: r = (a + b - c) / 2</text>
  <polygon points="320,170 760,500 320,500" fill="#ffffff" fill-opacity="0.04" stroke="none"/>  <polygon points="320,170 760,500 320,500" fill="none" stroke="#f1c97d" stroke-width="8" stroke-linejoin="round"/>  <circle cx="320" cy="170" r="9" fill="#f1c97d"/>  <circle cx="760" cy="500" r="9" fill="#f1c97d"/>  <circle cx="320" cy="500" r="9" fill="#f1c97d"/>  <circle cx="430" cy="390" r="110" fill="none" stroke="#4ade80" stroke-width="6"/>  <circle cx="430" cy="390" r="8" fill="#4ade80"/>  <text x="460" y="372" font-size="24" font-weight="700" fill="#4ade80" text-anchor="middle">I</text>  <line x1="430" y1="390" x2="496" y2="302" stroke="#4ade80" stroke-width="4" stroke-dasharray="8 6" stroke-linecap="round"/>  <circle cx="496" cy="302" r="6" fill="#4ade80"/>  <text x="497" y="346" font-size="26" font-weight="700" fill="#4ade80" text-anchor="middle">r</text>  <polyline points="344,500 344,476 320,476" fill="none" stroke="#ffffff" stroke-width="3"/>  <text x="320" y="146" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>  <text x="792" y="508" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>  <text x="286" y="508" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>  <text x="288" y="335" font-size="28" font-weight="700" fill="#7dd3fc" text-anchor="middle">a</text>  <text x="540" y="544" font-size="28" font-weight="700" fill="#f1c97d" text-anchor="middle">b</text>  <text x="576" y="309" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">c</text>  <rect x="830" y="96" width="336" height="204" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>  <text x="998" y="150" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="middle">r = (a + b - c) / 2</text>  <text x="998" y="192" font-size="20" font-weight="400" fill="#a3a3a3" text-anchor="middle">a = 6, b = 8, c = 10</text>  <text x="998" y="234" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">r = (6 + 8 - 10) / 2</text>  <text x="998" y="276" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">r = 2 cm</text></svg>
