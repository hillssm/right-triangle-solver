  <polygon points="400,228 736,480 400,480" fill="#ffffff" fill-opacity="0.04" stroke="none"/>  <polygon points="400,228 736,480 400,480" fill="none" stroke="#f1c97d" stroke-width="8" stroke-linejoin="round"/>  <circle cx="400" cy="228" r="9" fill="#f1c97d"/>  <circle cx="736" cy="480" r="9" fill="#f1c97d"/>  <circle cx="400" cy="480" r="9" fill="#f1c97d"/>  <circle cx="568" cy="354" r="210" fill="none" stroke="#7dd3fc" stroke-width="6"/>  <circle cx="568" cy="354" r="8" fill="#7dd3fc"/>  <text x="598" y="334" font-size="24" font-weight="700" fill="#7dd3fc" text-anchor="middle">O</text>  <circle cx="484" cy="396" r="84" fill="none" stroke="#4ade80" stroke-width="6"/>  <circle cx="484" cy="396" r="8" fill="#4ade80"/>  <text x="514" y="378" font-size="24" font-weight="700" fill="#4ade80" text-anchor="middle">I</text>  <text x="526" y="440" font-size="24" font-weight="700" fill="#4ade80" text-anchor="middle">r = 2</text>  <polyline points="424,480 424,456 400,456" fill="none" stroke="#ffffff" stroke-width="3"/>  <text x="400" y="204" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>  <text x="768" y="488" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>  <text x="366" y="488" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>  <text x="368" y="354" font-size="28" font-weight="700" fill="#7dd3fc" text-anchor="middle">a</text>  <text x="568" y="524" font-size="28" font-weight="700" fill="#f1c97d" text-anchor="middle">b</text>  <text x="604" y="328" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">c</text>  <rect x="830" y="96" width="336" height="204" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>  <text x="998" y="150" font-size="28" font-weight="700" fill="#4ade80" text-anchor="middle">r = 2 cm</text>  <text x="998" y="192" font-size="28" font-weight="700" fill="#7dd3fc" text-anchor="middle">R = 5 cm</text>  <text x="998" y="234" font-size="19" font-weight="400" fill="#a3