<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="52" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Altitude From Projections: p = 9, q = 16</text>
  <polygon points="275,480 925,480 509,168" fill="#ffffff" fill-opacity="0.04" stroke="none"/>
  <polygon points="275,480 925,480 509,168" fill="none" stroke="#f1c97d" stroke-width="8" stroke-linejoin="round"/>
  <line x1="509" y1="168" x2="509" y2="480" stroke="#4ade80" stroke-width="6" stroke-dasharray="10 8" stroke-linecap="round"/>
  <polyline points="494.6,187.2 513.8,201.6 528.2,182.4" fill="none" stroke="#ffffff" stroke-width="3"/>
  <polyline points="485,480 485,456 509,456" fill="none" stroke="#ffffff" stroke-width="3"/>
  <circle cx="275.0" cy="480.0" r="9" fill="#f1c97d"/>
  <circle cx="925.0" cy="480.0" r="9" fill="#f1c97d"/>
  <circle cx="509.0" cy="168.0" r="9" fill="#f1c97d"/>
  <circle cx="509.0" cy="480.0" r="7" fill="#4ade80"/>
  <text x="255.0" y="512.0" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="945.0" y="512.0" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="509.0" y="136.0" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="533.0" y="474.0" font-size="20" font-weight="700" fill="#4ade80" text-anchor="middle">D</text>
  <text x="392.0" y="514.0" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="middle">p = 9</text>
  <text x="717.0" y="514.0" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="middle">q = 16</text>
  <text x="473.0" y="324.0" font-size="26" font-weight="700" fill="#4ade80" text-anchor="middle">h = 12</text>
  <text x="390" y="300" font-size="22" font-weight="700" fill="#7dd3fc" text-anchor="middle">a = 15</text>
  <text x="700" y="300" font-size="22" font-weight="700" fill="#7dd3fc" text-anchor="middle">b = 20</text>
  <rect x="24" y="110" width="280" height="230" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>
  <text x="164" y="166" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">h² = p × q</text>
  <text x="164" y="210" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">h² = 9 × 16 = 144</text>
  <text x="164" y="252" font-size="22" font-weight="700" fill="#4ade80" text-anchor="middle">h = √144 = 12</text>
  <text x="600" y="560" font-size="22" fill="#a3a3a3" text-anchor="middle">The altitude is the geometric mean of the projections:</text>
  <text x="600" y="590" font-size="22" fill="#a3a3a3" text-anchor="middle">sqrt(9 x 16) = 12.</text>
</svg>
