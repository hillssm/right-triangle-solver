<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="52" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Altitude From the Sides: Main Diagram</text>
  <polygon points="160,470 910,470 430,110" fill="#ffffff" fill-opacity="0.04" stroke="none"/>
  <polygon points="160,470 910,470 430,110" fill="none" stroke="#f1c97d" stroke-width="8" stroke-linejoin="round"/>
  <line x1="430" y1="110" x2="430" y2="470" stroke="#4ade80" stroke-width="6" stroke-dasharray="10 8" stroke-linecap="round"/>
  <polyline points="415.6,129.2 434.8,143.6 449.2,124.4" fill="none" stroke="#ffffff" stroke-width="3"/>
  <polyline points="406,470 406,446 430,446" fill="none" stroke="#ffffff" stroke-width="3"/>
  <circle cx="160.0" cy="470.0" r="9" fill="#f1c97d"/>
  <circle cx="910.0" cy="470.0" r="9" fill="#f1c97d"/>
  <circle cx="430.0" cy="110.0" r="9" fill="#f1c97d"/>
  <circle cx="430.0" cy="470.0" r="7" fill="#4ade80"/>
  <text x="140.0" y="500.0" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="930.0" y="500.0" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="430.0" y="78.0" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="454.0" y="464.0" font-size="20" font-weight="700" fill="#4ade80" text-anchor="middle">D</text>
  <text x="267" y="290" font-size="30" font-weight="700" fill="#7dd3fc" text-anchor="middle">a</text>
  <text x="698" y="290" font-size="30" font-weight="700" fill="#7dd3fc" text-anchor="middle">b</text>
  <text x="535" y="534" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">c</text>
  <text x="398" y="290" font-size="30" font-weight="700" fill="#4ade80" text-anchor="middle">h</text>
  <rect x="24" y="110" width="300" height="180" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>
  <text x="174" y="166" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">h = (a × b) / c</text>
  <text x="174" y="210" font-size="19" fill="#a3a3a3" text-anchor="middle">two area formulas</text>
  <text x="174" y="244" font-size="19" fill="#a3a3a3" text-anchor="middle">ab/2 = ch/2</text>
  <rect x="866" y="110" width="310" height="300" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>
  <text x="890" y="158" font-size="22" font-weight="700" fill="#7dd3fc" text-anchor="start">a = AC</text>
  <text x="890" y="184" font-size="19" fill="#a3a3a3" text-anchor="start">first leg</text>
  <text x="890" y="218" font-size="22" font-weight="700" fill="#7dd3fc" text-anchor="start">b = BC</text>
  <text x="890" y="244" font-size="19" fill="#a3a3a3" text-anchor="start">second leg</text>
  <text x="890" y="278" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start">c = AB</text>
  <text x="890" y="304" font-size="19" fill="#a3a3a3" text-anchor="start">hypotenuse</text>
  <text x="890" y="338" font-size="22" font-weight="700" fill="#4ade80" text-anchor="start">h = CD</text>
  <text x="890" y="364" font-size="19" fill="#a3a3a3" text-anchor="start">altitude, ⊥ AB</text>
  <text x="600" y="550" font-size="22" fill="#a3a3a3" text-anchor="middle">Altitude CD drops from right angle C to hypotenuse AB;</text>
  <text x="600" y="580" font-size="22" fill="#a3a3a3" text-anchor="middle">h equals (a x b) / c</text>
</svg>
