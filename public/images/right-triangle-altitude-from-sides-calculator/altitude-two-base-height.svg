<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="52" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Two Base-Height Pairs, One Area</text>
  <polygon points="150,490 420,490 150,130" fill="#ffffff" fill-opacity="0.04" stroke="none"/>
  <polygon points="150,490 420,490 150,130" fill="none" stroke="#f1c97d" stroke-width="7" stroke-linejoin="round"/>
  <polyline points="174,490 174,466 150,466" fill="none" stroke="#ffffff" stroke-width="3"/>
  <circle cx="150.0" cy="490.0" r="8" fill="#f1c97d"/>
  <circle cx="420.0" cy="490.0" r="8" fill="#f1c97d"/>
  <circle cx="150.0" cy="130.0" r="8" fill="#f1c97d"/>
  <polygon points="695,480 1145,480 857,264" fill="#ffffff" fill-opacity="0.04" stroke="none"/>
  <polygon points="695,480 1145,480 857,264" fill="none" stroke="#f1c97d" stroke-width="7" stroke-linejoin="round"/>
  <line x1="857" y1="264" x2="857" y2="480" stroke="#4ade80" stroke-width="6" stroke-dasharray="10 8" stroke-linecap="round"/>
  <polyline points="842.6,283.2 861.8,297.6 876.2,278.4" fill="none" stroke="#ffffff" stroke-width="3"/>
  <polyline points="833,480 833,456 857,456" fill="none" stroke="#ffffff" stroke-width="3"/>
  <circle cx="695.0" cy="480.0" r="8" fill="#f1c97d"/>
  <circle cx="1145.0" cy="480.0" r="8" fill="#f1c97d"/>
  <circle cx="857.0" cy="264.0" r="8" fill="#f1c97d"/>
  <circle cx="857.0" cy="480.0" r="7" fill="#4ade80"/>
  <text x="600" y="330" font-size="72" font-weight="700" fill="#f1c97d" text-anchor="middle">=</text>
  <text x="600" y="368" font-size="20" fill="#a3a3a3" text-anchor="middle">same area</text>
  <text x="285" y="100" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">base = a, height = b</text>
  <text x="920" y="100" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">base = c, height = h</text>
  <text x="285" y="478" font-size="26" font-weight="700" fill="#7dd3fc" text-anchor="middle">a</text>
  <text x="126" y="310" font-size="26" font-weight="700" fill="#7dd3fc" text-anchor="middle">b</text>
  <text x="306" y="288" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">c</text>
  <text x="285" y="524" font-size="22" font-weight="700" fill="#f1c97d" text-anchor="middle">base = a</text>
  <text x="285" y="552" font-size="22" fill="#a3a3a3" text-anchor="middle">Area = ab/2</text>
  <text x="108" y="310" font-size="22" fill="#f1c97d" text-anchor="middle" transform="rotate(-90 108 310)">height = b</text>
  <text x="920" y="512" font-size="22" font-weight="700" fill="#f1c97d" text-anchor="middle">base = c</text>
  <text x="920" y="540" font-size="22" fill="#a3a3a3" text-anchor="middle">Area = ch/2</text>
  <text x="826" y="372" font-size="26" font-weight="700" fill="#4ade80" text-anchor="middle">h</text>
  <text x="800" y="372" font-size="20" fill="#a3a3a3" text-anchor="middle" transform="rotate(-90 800 372)">height = h</text>
  <text x="887.0" y="298.0" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="600" y="578" font-size="22" fill="#a3a3a3" text-anchor="middle">Same triangle, two base-height pairs:</text>
  <text x="600" y="608" font-size="22" fill="#a3a3a3" text-anchor="middle">area equals ab/2 and ch/2</text>
</svg>
