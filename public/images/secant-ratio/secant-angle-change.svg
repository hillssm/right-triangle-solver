<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="48" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">How Secant Changes as the Angle Changes</text>

  <line x1="400" y1="90" x2="400" y2="540" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="800" y1="90" x2="800" y2="540" stroke="#2a2a2a" stroke-width="2"/>

  <text x="200" y="122" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">A = 30°, sec ≈ 1.1547</text>
  <text x="200" y="480" font-size="19" fill="#d4d4d4" text-anchor="middle">b = √3, c = 2</text>
  <text x="200" y="512" font-size="21" font-weight="700" fill="#f1c97d" text-anchor="middle">sec(A) = 2/√3 ≈ 1.1547</text>
<line x1="110" y1="420" x2="290" y2="316" stroke="#f1c97d" stroke-width="8"/>
<line x1="110" y1="420" x2="290" y2="420" stroke="#38bdf8" stroke-width="8"/>
<line x1="290" y1="420" x2="290" y2="316" stroke="#a3a3a3" stroke-width="8"/>
<polyline points="266,420 266,396 290,396" fill="none" stroke="#ffffff" stroke-width="3"/>
<polyline points="144.0,420.0 143.9,417.0 143.5,414.1 142.8,411.2 141.9,408.4 140.8,405.6 139.4,403.0" fill="none" stroke="#ffffff" stroke-width="2.5"/>
<circle cx="110" cy="420" r="6" fill="#ffffff"/>
<circle cx="290" cy="420" r="6" fill="#ffffff"/>
<circle cx="290" cy="316" r="6" fill="#ffffff"/>
<text x="76" y="454" font-size="24" font-weight="700" fill="#ffffff">A</text>
<text x="300" y="308" font-size="24" font-weight="700" fill="#ffffff">B</text>
<text x="300" y="454" font-size="24" font-weight="700" fill="#ffffff">C</text>
  <text x="600" y="122" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">A = 45°, sec ≈ 1.4142</text>
  <text x="600" y="480" font-size="19" fill="#d4d4d4" text-anchor="middle">b = 1, c = √2</text>
  <text x="600" y="512" font-size="21" font-weight="700" fill="#f1c97d" text-anchor="middle">sec(A) = √2 ≈ 1.4142</text>
<line x1="125" y1="420" x2="275" y2="270" stroke="#f1c97d" stroke-width="8"/>
<line x1="125" y1="420" x2="275" y2="420" stroke="#38bdf8" stroke-width="8"/>
<line x1="275" y1="420" x2="275" y2="270" stroke="#a3a3a3" stroke-width="8"/>
<polyline points="251,420 251,396 275,396" fill="none" stroke="#ffffff" stroke-width="3"/>
<polyline points="159.0,420.0 158.7,415.6 157.8,411.2 156.4,407.0 154.4,403.0 152.0,399.3 149.0,396.0" fill="none" stroke="#ffffff" stroke-width="2.5"/>
<circle cx="125" cy="420" r="6" fill="#ffffff"/>
<circle cx="275" cy="420" r="6" fill="#ffffff"/>
<circle cx="275" cy="270" r="6" fill="#ffffff"/>
<text x="91" y="454" font-size="24" font-weight="700" fill="#ffffff">A</text>
<text x="285" y="262" font-size="24" font-weight="700" fill="#ffffff">B</text>
<text x="285" y="454" font-size="24" font-weight="700" fill="#ffffff">C</text>
  <text x="1000" y="122" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">A = 60°, sec = 2</text>
  <text x="1000" y="480" font-size="19" fill="#d4d4d4" text-anchor="middle">b = 1, c = 2</text>
  <text x="1000" y="512" font-size="21" font-weight="700" fill="#f1c97d" text-anchor="middle">sec(A) = 2/1 = 2</text>
<line x1="150" y1="420" x2="250" y2="247" stroke="#f1c97d" stroke-width="8"/>
<line x1="150" y1="420" x2="250" y2="420" stroke="#38bdf8" stroke-width="8"/>
<line x1="250" y1="420" x2="250" y2="247" stroke="#a3a3a3" stroke-width="8"/>
<polyline points="226,420 226,396 250,396" fill="none" stroke="#ffffff" stroke-width="3"/>
<polyline points="184.0,420.0 183.5,414.1 182.0,408.4 179.4,403.0 176.1,398.2 171.9,394.0 167.0,390.6" fill="none" stroke="#ffffff" stroke-width="2.5"/>
<circle cx="150" cy="420" r="6" fill="#ffffff"/>
<circle cx="250" cy="420" r="6" fill="#ffffff"/>
<circle cx="250" cy="247" r="6" fill="#ffffff"/>
<text x="116" y="454" font-size="24" font-weight="700" fill="#ffffff">A</text>
<text x="260" y="239" font-size="24" font-weight="700" fill="#ffffff">B</text>
<text x="260" y="454" font-size="24" font-weight="700" fill="#ffffff">C</text>
  <text x="600" y="580" font-size="19" fill="#d4d4d4" text-anchor="middle">As angle A grows, the adjacent side becomes a smaller share of the hypotenuse, so sec(A) increases.</text>

</svg>
