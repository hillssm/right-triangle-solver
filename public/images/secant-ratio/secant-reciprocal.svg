<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="48" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Cosine and Secant Are Reciprocal Ratios</text>

  <line x1="400" y1="90" x2="400" y2="470" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="800" y1="90" x2="800" y2="470" stroke="#2a2a2a" stroke-width="2"/>
  <text x="200" y="122" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Stage 1: Label the triangle</text>
  <text x="600" y="122" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Stage 2: Compute cosine</text>
  <text x="1000" y="122" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Stage 3: Flip to secant</text>
  <text x="400" y="300" font-size="44" fill="#f1c97d" text-anchor="middle">&#8594;</text>
  <text x="800" y="300" font-size="44" fill="#f1c97d" text-anchor="middle">&#8594;</text>
<line x1="80" y1="400" x2="320" y2="220" stroke="#f1c97d" stroke-width="8"/>
<line x1="80" y1="400" x2="320" y2="400" stroke="#38bdf8" stroke-width="8"/>
<line x1="320" y1="400" x2="320" y2="220" stroke="#a3a3a3" stroke-width="8"/>
<polyline points="296,400 296,376 320,376" fill="none" stroke="#ffffff" stroke-width="3"/>
<polyline points="114.0,400.0 113.8,396.4 113.2,392.8 112.3,389.2 110.9,385.9 109.2,382.6 107.2,379.6" fill="none" stroke="#ffffff" stroke-width="2.5"/>
<circle cx="80" cy="400" r="6" fill="#ffffff"/>
<circle cx="320" cy="400" r="6" fill="#ffffff"/>
<circle cx="320" cy="220" r="6" fill="#ffffff"/>
<text x="46" y="434" font-size="24" font-weight="700" fill="#ffffff">A</text>
<text x="330" y="212" font-size="24" font-weight="700" fill="#ffffff">B</text>
<text x="330" y="434" font-size="24" font-weight="700" fill="#ffffff">C</text>
<text x="192.0" y="298.0" font-size="19" fill="#f1c97d" text-anchor="middle">c = 5</text>
<text x="200.0" y="434" font-size="19" fill="#38bdf8" text-anchor="middle">b = 4</text>
<text x="334" y="310.0" font-size="19" fill="#a3a3a3" text-anchor="start">a = 3</text>
  <text x="600" y="280" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">cos(A) = 4/5 = 0.8</text>
  <text x="600" y="326" font-size="20" fill="#d4d4d4" text-anchor="middle">adjacent / hypotenuse</text>
  <text x="1000" y="280" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">sec(A) = 5/4 = 1.25</text>
  <text x="1000" y="326" font-size="20" fill="#d4d4d4" text-anchor="middle">hypotenuse / adjacent</text>
  <rect x="400" y="440" width="400" height="64" rx="10" fill="#1c1b1b" stroke="#f1c97d" stroke-width="1.5"/>
  <text x="600" y="480" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">sec(A) = 1 / cos(A)</text>
  <text x="600" y="548" font-size="20" fill="#d4d4d4" text-anchor="middle">The hypotenuse is 25% longer than the adjacent side.</text>

</svg>
