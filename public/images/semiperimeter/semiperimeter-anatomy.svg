<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="52" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Anatomy of a Right Triangle: Three Sides, One Semiperimeter</text>

<polygon points="320,560 880,140 880,560" fill="none" stroke="#f1c97d" stroke-width="14" stroke-linejoin="round" opacity="0.28"/>
<polygon points="320,560 880,140 880,560" fill="#ffffff" fill-opacity="0.05"/>
<line x1="880" y1="140" x2="880" y2="560" stroke="#4ade80" stroke-width="8" stroke-linecap="round"/>
<line x1="880" y1="560" x2="320" y2="560" stroke="#7dd3fc" stroke-width="8" stroke-linecap="round"/>
<line x1="320" y1="560" x2="880" y2="140" stroke="#f1c97d" stroke-width="9" stroke-linecap="round"/>
<circle cx="292" cy="562" r="9" fill="#f1c97d"/>
<text x="292" y="571" font-size="24" font-weight="700" fill="#131313" text-anchor="middle">A</text>
<circle cx="910" cy="562" r="9" fill="#f1c97d"/>
<text x="910" y="571" font-size="24" font-weight="700" fill="#131313" text-anchor="middle">C</text>
<circle cx="884" cy="110" r="9" fill="#f1c97d"/>
<text x="884" y="119" font-size="24" font-weight="700" fill="#131313" text-anchor="middle">B</text>
<text x="916" y="359.0" font-size="30" font-weight="700" fill="#4ade80" text-anchor="start">a</text>
<text x="600.0" y="608" font-size="30" font-weight="700" fill="#7dd3fc" text-anchor="middle">b</text>
<text x="556.0" y="340.0" font-size="30" font-weight="700" fill="#f1c97d" text-anchor="middle">c</text>
<polyline points="852,560 852,532 880,532" fill="none" stroke="#ffffff" stroke-width="3"/>
<polyline points="364.8,526.4 366.5,528.8 368.1,531.4 369.6,534.0 370.9,536.7 372.1,539.5 373.1,542.3 374.0,545.2 374.7,548.1 375.3,551.0 375.7,554.0 375.9,557.0 376.0,560.0" fill="none" stroke="#ffffff" stroke-width="4"/>
<polyline points="880.0,196.0 876.9,195.9 873.9,195.7 870.9,195.3 867.9,194.7 864.9,193.9 862.0,193.0 859.1,192.0 856.3,190.8 853.6,189.4 850.9,187.9 848.4,186.2 845.9,184.4 843.5,182.5 841.3,180.4 839.1,178.3 837.1,176.0 835.2,173.6" fill="none" stroke="#ffffff" stroke-width="4"/>
<text x="404" y="536" font-size="22" font-weight="400" fill="#ffffff" text-anchor="start">A (acute)</text>
<text x="672" y="210" font-size="22" font-weight="400" fill="#ffffff" text-anchor="start">B (acute)</text>
<text x="760" y="520" font-size="22" font-weight="400" fill="#ffffff" text-anchor="start">C = 90 deg</text>
<rect x="20" y="120" width="250" height="200" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>
<text x="40" y="162" font-size="22" font-weight="700" fill="#4ade80" text-anchor="start">a: leg</text>
<text x="40" y="196" font-size="19" font-weight="400" fill="#a3a3a3" text-anchor="start">one side of the</text>
<text x="40" y="222" font-size="19" font-weight="400" fill="#a3a3a3" text-anchor="start">right angle</text>
<text x="40" y="262" font-size="22" font-weight="700" fill="#7dd3fc" text-anchor="start">b: leg</text>
<text x="40" y="296" font-size="19" font-weight="400" fill="#a3a3a3" text-anchor="start">other side of the</text>
<rect x="930" y="120" width="250" height="200" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>
<text x="950" y="162" font-size="22" font-weight="700" fill="#f1c97d" text-anchor="start">c: hypotenuse</text>
<text x="950" y="196" font-size="19" font-weight="400" fill="#a3a3a3" text-anchor="start">longest side,</text>
<text x="950" y="222" font-size="19" font-weight="400" fill="#a3a3a3" text-anchor="start">opposite C</text>
<text x="950" y="262" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start">s = (a+b+c)/2</text>
<text x="950" y="296" font-size="19" font-weight="400" fill="#a3a3a3" text-anchor="start">half the perimeter</text>
</svg>
