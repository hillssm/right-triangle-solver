<circle cx="270" cy="410" r="8" fill="#f1c97d"/>
<text x="286" y="398" font-size="20" font-weight="700" fill="#f1c97d" text-anchor="start">center</text>
<line x1="270" y1="410" x2="330.0" y2="330.0" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
<text x="344.0" y="324.0" font-size="24" font-weight="700" fill="#4ade80" text-anchor="start">r = 1</text>
<circle cx="270.0" cy="510.0" r="7" fill="#7dd3fc"/>
<circle cx="170.0" cy="410.0" r="7" fill="#7dd3fc"/>
<circle cx="330.0" cy="330.0" r="7" fill="#7dd3fc"/>
<circle cx="166" cy="180" r="9" fill="#f1c97d"/>
<text x="166" y="189" font-size="24" font-weight="700" fill="#131313" text-anchor="middle">A</text>
<circle cx="600" cy="512" r="9" fill="#f1c97d"/>
<text x="600" y="521" font-size="24" font-weight="700" fill="#131313" text-anchor="middle">B</text>
<circle cx="142" cy="512" r="9" fill="#f1c97d"/>
<text x="142" y="521" font-size="24" font-weight="700" fill="#131313" text-anchor="middle">C</text>
<text x="126" y="368.0" font-size="26" font-weight="700" fill="#4ade80" text-anchor="start">a = 3</text>
<text x="370.0" y="556" font-size="26" font-weight="700" fill="#7dd3fc" text-anchor="middle">b = 4</text>
<text x="278.0" y="354.0" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="middle">c = 5</text>
<polyline points="146,510 146,486 170,486" fill="none" stroke="#ffffff" stroke-width="3"/>
<rect x="660" y="120" width="520" height="400" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>
<text x="700" y="180" font-size="24" font-weight="700" fill="#ffffff" text-anchor="start">For the 3-4-5 triangle:</text>
<text x="700" y="232" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="start">s = (3 + 4 + 5) / 2 = 6</text>
<text x="700" y="284" font-size="26" font-weight="700" fill="#ffffff" text-anchor="start">K = (3 x 4) / 2 = 6</text>
<text x="700" y="336" font-size="26" font-weight="700" fill="#4ade80" text-anchor="start">r = K / s = 6 / 6 = 1</text>
<text x="700" y="388" font-size="26" font-weight="700" fill="#ffffff" text-anchor="start">K = r x s</text>
<text x="700" y="440" font-size="20" font-weight="400" fill="#a3a3a3" text-anchor="start">The incircle touches all three sides.</text>
<text x="700" y="470" font-size="20" font-weight="400" fill="#a3a3a3" text-anchor="start">Its radius is the inradius r.</text>
</svg>
