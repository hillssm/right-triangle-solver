<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="52" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">How to Calculate the Semiperimeter: Step by Step</text>

<rect x="20" y="90" width="540" height="470" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>
<polygon points="100,500 440,245 440,500" fill="#ffffff" fill-opacity="0.05"/>
<line x1="440" y1="245" x2="440" y2="500" stroke="#4ade80" stroke-width="8" stroke-linecap="round"/>
<line x1="440" y1="500" x2="100" y2="500" stroke="#7dd3fc" stroke-width="8" stroke-linecap="round"/>
<line x1="100" y1="500" x2="440" y2="245" stroke="#f1c97d" stroke-width="9" stroke-linecap="round"/>
<circle cx="74" cy="502" r="9" fill="#f1c97d"/>
<text x="74" y="511" font-size="24" font-weight="700" fill="#131313" text-anchor="middle">A</text>
<circle cx="468" cy="502" r="9" fill="#f1c97d"/>
<text x="468" y="511" font-size="24" font-weight="700" fill="#131313" text-anchor="middle">C</text>
<circle cx="442" cy="217" r="9" fill="#f1c97d"/>
<text x="442" y="226" font-size="24" font-weight="700" fill="#131313" text-anchor="middle">B</text>
<text x="474" y="381.5" font-size="26" font-weight="700" fill="#4ade80" text-anchor="start">a = 3</text>
<text x="270.0" y="546" font-size="26" font-weight="700" fill="#7dd3fc" text-anchor="middle">b = 4</text>
<text x="174.0" y="372.5" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="middle">c = 5</text>
<polyline points="416,500 416,476 440,476" fill="none" stroke="#ffffff" stroke-width="3"/>
<rect x="600" y="90" width="580" height="470" rx="12" fill="#1c1b1b" stroke="#2e2c2c"/>
<rect x="640" y="130" width="500" height="110" rx="12" fill="#131313" stroke="#2e2c2c" stroke-width="2"/>
<circle cx="690" cy="185" r="22" fill="#f1c97d"/>
<text x="690" y="194" font-size="24" font-weight="700" fill="#131313" text-anchor="middle">1</text>
<text x="728" y="178" font-size="22" font-weight="400" fill="#a3a3a3" text-anchor="start">Add the three side lengths</text>
<text x="728" y="214" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start">P = 3 + 4 + 5 = 12</text>
<rect x="640" y="270" width="500" height="110" rx="12" fill="#131313" stroke="#2e2c2c" stroke-width="2"/>
<circle cx="690" cy="325" r="22" fill="#f1c97d"/>
<text x="690" y="334" font-size="24" font-weight="700" fill="#131313" text-anchor="middle">2</text>
<text x="728" y="318" font-size="22" font-weight="400" fill="#a3a3a3" text-anchor="start">Divide the total by two</text>
<text x="728" y="354" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start">s = 12 / 2</text>
<rect x="640" y="410" width="500" height="110" rx="12" fill="#131313" stroke="#f1c97d" stroke-width="2"/>
<circle cx="690" cy="465" r="22" fill="#f1c97d"/>
<text x="690" y="474" font-size="24" font-weight="700" fill="#131313" text-anchor="middle">3</text>
<text x="728" y="458" font-size="22" font-weight="400" fill="#a3a3a3" text-anchor="start">The semiperimeter</text>
<text x="728" y="494" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start">s = 6 units</text>
</svg>
