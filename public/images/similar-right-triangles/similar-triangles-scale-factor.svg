  <polyline points="666.0,500.0 666.0,484.0 650.0,484.0" fill="none" stroke="#ffffff" stroke-width="3"/>
  <text x="592.0" y="347.0" font-size="28" font-weight="700" fill="#7dd3fc" text-anchor="middle">a′ = 18</text>
  <text x="866.0" y="552.0" font-size="28" font-weight="700" fill="#f1c97d" text-anchor="middle">b′ = 24</text>
  <text x="906.0" y="276.0" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">c′ = 30</text>
