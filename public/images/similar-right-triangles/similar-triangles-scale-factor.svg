  <text x="120.0" y="508.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <polyline points="166.0,500.0 166.0,484.0 150.0,484.0" fill="none" stroke="#ffffff" stroke-width="3"/>
  <text x="92.0" y="449.0" font-size="28" font-weight="700" fill="#7dd3fc" text-anchor="middle">a = 6</text>
  <text x="230.0" y="552.0" font-size="28" font-weight="700" fill="#f1c97d" text-anchor="middle">b = 8</text>
  <text x="270.0" y="378.0" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">c = 10</text>
  <text x="230.0" y="585.0" font-size="26" font-weight="700" fill="#4ade80" text-anchor="middle">Original</text>
  <polygon points="1082.0,500.0 650.0,176.0 650.0,500.0" fill="#ffffff" fill-opacity="0.04" stroke="none"/>
  <polygon points="1082.0,500.0 650.0,176.0 650.0,500.0" fill="none" stroke="#7dd3fc" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="1082.0" cy="500.0" r="9" fill="#7dd3fc"/>
  <circle cx="650.0" cy="176.0" r="9" fill="#7dd3fc"/>
  <circle cx="650.0" cy="500.0" r="9" fill="#7dd3fc"/>
