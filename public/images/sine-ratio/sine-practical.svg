<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="48" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Four Practical Sine Calculations</text>

  <rect x="20" y="90" width="280" height="510" rx="10" fill="#1c1b1b" stroke="#3a3838" stroke-width="1.5"/>
  <text x="160" y="130" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Ladder</text>
  <text x="160" y="166" font-size="18" fill="#ffffff" text-anchor="middle">sin(A) = 4/5 = 0.8</text>
  <text x="160" y="194" font-size="15" fill="#f1c97d" text-anchor="middle">80% of the ladder is vertical</text>
  <line x1="60" y1="545" x2="260" y2="245" stroke="#38bdf8" stroke-width="7"/>
  <line x1="60" y1="545" x2="260" y2="545" stroke="#a3a3a3" stroke-width="7"/>
  <line x1="260" y1="545" x2="260" y2="245" stroke="#f1c97d" stroke-width="7"/>
  <polyline points="236,545 236,521 260,521" fill="none" stroke="#ffffff" stroke-width="3"/>
  <polyline points="94,545 93.8,541.8 93.4,538.6 92.6,535.5 91.6,532.4 90.3,529.5 88.7,526.7" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="60" cy="545" r="6" fill="#ffffff"/>
  <circle cx="260" cy="545" r="6" fill="#ffffff"/>
  <circle cx="260" cy="245" r="6" fill="#ffffff"/>
  <text x="36" y="579" font-size="20" font-weight="700" fill="#ffffff">A</text>
  <text x="272" y="579" font-size="20" font-weight="700" fill="#ffffff">B</text>
  <text x="272" y="237" font-size="20" font-weight="700" fill="#ffffff">C</text>
  <text x="248" y="400" font-size="17" fill="#f1c97d" text-anchor="end">a = 4 m</text>
  <text x="150" y="382" font-size="17" fill="#38bdf8" text-anchor="middle">c = 5 m</text>
  <text x="160" y="578" font-size="17" fill="#a3a3a3" text-anchor="middle">b</text>

  <rect x="315" y="90" width="280" height="510" rx="10" fill="#1c1b1b" stroke="#3a3838" stroke-width="1.5"/>
  <text x="455" y="130" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Ramp</text>
  <text x="455" y="166" font-size="18" fill="#ffffff" text-anchor="middle">sin(A) = 0.75/9.5</text>
  <text x="455" y="192" font-size="18" fill="#ffffff" text-anchor="middle">≈ 0.07895</text>
  <text x="455" y="218" font-size="15" fill="#f1c97d" text-anchor="middle">gentle 7.89% slope</text>
  <line x1="355" y1="545" x2="555" y2="245" stroke="#38bdf8" stroke-width="7"/>
  <line x1="355" y1="545" x2="555" y2="545" stroke="#a3a3a3" stroke-width="7"/>
  <line x1="555" y1="545" x2="555" y2="245" stroke="#f1c97d" stroke-width="7"/>
  <polyline points="531,545 531,521 555,521" fill="none" stroke="#ffffff" stroke-width="3"/>
  <polyline points="389,545 388.8,541.8 388.4,538.6 387.6,535.5 386.6,532.4 385.3,529.5 383.7,526.7" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="355" cy="545" r="6" fill="#ffffff"/>
  <circle cx="555" cy="545" r="6" fill="#ffffff"/>
  <circle cx="555" cy="245" r="6" fill="#ffffff"/>
  <text x="331" y="579" font-size="20" font-weight="700" fill="#ffffff">A</text>
  <text x="567" y="579" font-size="20" font-weight="700" fill="#ffffff">B</text>
  <text x="567" y="237" font-size="20" font-weight="700" fill="#ffffff">C</text>
  <text x="543" y="400" font-size="17" fill="#f1c97d" text-anchor="end">a = 0.75 m</text>
  <text x="445" y="382" font-size="17" fill="#38bdf8" text-anchor="middle">c = 9.5 m</text>
  <text x="455" y="578" font-size="17" fill="#a3a3a3" text-anchor="middle">b</text>

  <rect x="610" y="90" width="280" height="510" rx="10" fill="#1c1b1b" stroke="#3a3838" stroke-width="1.5"/>
  <text x="750" y="130" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Surveying</text>
  <text x="750" y="166" font-size="18" fill="#ffffff" text-anchor="middle">sin(A) = 30/50 = 0.6</text>
  <text x="750" y="194" font-size="15" fill="#f1c97d" text-anchor="middle">60% of the line is vertical</text>
  <line x1="650" y1="545" x2="850" y2="245" stroke="#38bdf8" stroke-width="7"/>
  <line x1="650" y1="545" x2="850" y2="545" stroke="#a3a3a3" stroke-width="7"/>
  <line x1="850" y1="545" x2="850" y2="245" stroke="#f1c97d" stroke-width="7"/>
  <polyline points="826,545 826,521 850,521" fill="none" stroke="#ffffff" stroke-width="3"/>
  <polyline points="684,545 683.8,541.8 683.4,538.6 682.6,535.5 681.6,532.4 680.3,529.5 678.7,526.7" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="650" cy="545" r="6" fill="#ffffff"/>
  <circle cx="850" cy="545" r="6" fill="#ffffff"/>
  <circle cx="850" cy="245" r="6" fill="#ffffff"/>
  <text x="626" y="579" font-size="20" font-weight="700" fill="#ffffff">A</text>
  <text x="862" y="579" font-size="20" font-weight="700" fill="#ffffff">B</text>
  <text x="862" y="237" font-size="20" font-weight="700" fill="#ffffff">C</text>
  <text x="838" y="400" font-size="17" fill="#f1c97d" text-anchor="end">a = 30 m</text>
  <text x="740" y="382" font-size="17" fill="#38bdf8" text-anchor="middle">c = 50 m</text>
  <text x="750" y="578" font-size="17" fill="#a3a3a3" text-anchor="middle">b</text>

  <rect x="905" y="90" width="280" height="510" rx="10" fill="#1c1b1b" stroke="#3a3838" stroke-width="1.5"/>
  <text x="1045" y="130" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Crane Boom</text>
  <text x="1045" y="166" font-size="18" fill="#ffffff" text-anchor="middle">sin(A) = 8/10 = 0.8</text>
  <text x="1045" y="194" font-size="15" fill="#f1c97d" text-anchor="middle">80% of the boom is vertical</text>
  <line x1="945" y1="545" x2="1145" y2="245" stroke="#38bdf8" stroke-width="7"/>
  <line x1="945" y1="545" x2="1145" y2="545" stroke="#a3a3a3" stroke-width="7"/>
  <line x1="1145" y1="545" x2="1145" y2="245" stroke="#f1c97d" stroke-width="7"/>
  <polyline points="1121,545 1121,521 1145,521" fill="none" stroke="#ffffff" stroke-width="3"/>
  <polyline points="979,545 978.8,541.8 978.4,538.6 977.6,535.5 976.6,532.4 975.3,529.5 973.7,526.7" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="945" cy="545" r="6" fill="#ffffff"/>
  <circle cx="1145" cy="545" r="6" fill="#ffffff"/>
  <circle cx="1145" cy="245" r="6" fill="#ffffff"/>
  <text x="921" y="579" font-size="20" font-weight="700" fill="#ffffff">A</text>
  <text x="1157" y="579" font-size="20" font-weight="700" fill="#ffffff">B</text>
  <text x="1157" y="237" font-size="20" font-weight="700" fill="#ffffff">C</text>
  <text x="1133" y="400" font-size="17" fill="#f1c97d" text-anchor="end">a = 8 m</text>
  <text x="1035" y="382" font-size="17" fill="#38bdf8" text-anchor="middle">c = 10 m</text>
  <text x="1045" y="578" font-size="17" fill="#a3a3a3" text-anchor="middle">b</text>
</svg>
