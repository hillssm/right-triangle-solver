<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Practical sine applications</title>
<desc>Two right triangles showing ladder height and ramp rise found with sine.</desc>
<polygon points="120,480 420,480 420,150" fill="rgba(241,201,125,0.07)" />
<line x1="420" y1="480" x2="420" y2="150" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
<line x1="120" y1="480" x2="420" y2="480" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.55" />
<line x1="120" y1="480" x2="420" y2="150" stroke="#f472b6" stroke-width="6" stroke-linecap="round" />
<polyline points="420,452 448,452 448,480" stroke="#ffffff" stroke-width="2.5" fill="none" />
<circle cx="120" cy="480" r="7" fill="#f1c97d" />
<circle cx="420" cy="480" r="7" fill="#f1c97d" />
<circle cx="420" cy="150" r="7" fill="#f1c97d" />
<path d="M 165.0 480.0 Q 161.6 462.8 151.8 448.2" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7" />
<text x="190" y="450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">65°</text>
<text x="285" y="560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">Ladder: 5 m, 65° -&gt; height ~4.53 m</text>
<text x="455" y="320" font-family="Noto Serif, Georgia, serif" font-size="34" fill="#fbbf24" text-anchor="middle" font-style="italic">a</text>
<text x="230" y="320" font-family="Noto Serif, Georgia, serif" font-size="34" fill="#f472b6" text-anchor="middle" font-style="italic">c</text>
<polygon points="700,480 1060,480 1060,330" fill="rgba(241,201,125,0.07)" />
<line x1="1060" y1="480" x2="1060" y2="330" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
<line x1="700" y1="480" x2="1060" y2="480" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.55" />
<line x1="700" y1="480" x2="1060" y2="330" stroke="#f472b6" stroke-width="6" stroke-linecap="round" />
<polyline points="1060,452 1088,452 1088,480" stroke="#ffffff" stroke-width="2.5" fill="none" />
<circle cx="700" cy="480" r="7" fill="#f1c97d" />
<circle cx="1060" cy="480" r="7" fill="#f1c97d" />
<circle cx="1060" cy="330" r="7" fill="#f1c97d" />
<path d="M 745.0 480.0 Q 744.2 471.4 741.7 463.1" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7" />
<text x="772" y="454" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">12°</text>
<text x="880" y="560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">Ramp: 150 m, 12° -&gt; rise ~31.19 m</text>
<text x="1090" y="410" font-family="Noto Serif, Georgia, serif" font-size="34" fill="#fbbf24" text-anchor="middle" font-style="italic">a</text>
<text x="830" y="410" font-family="Noto Serif, Georgia, serif" font-size="34" fill="#f472b6" text-anchor="middle" font-style="italic">c</text>
<text x="600" y="70" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#f1c97d" text-anchor="middle">Sine turns a slope length and angle into a vertical height.</text>
</svg>