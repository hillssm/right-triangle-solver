<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Visual explanation of the sine ratio</title>
<desc>Right triangle showing sin(A) equals opposite side a divided by hypotenuse c.</desc>
<polygon points="300,520 780,520 780,170" fill="rgba(241,201,125,0.07)"/>
<line x1="780" y1="520" x2="780" y2="170" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
<line x1="300" y1="520" x2="780" y2="520" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
<line x1="300" y1="520" x2="780" y2="170" stroke="#f472b6" stroke-width="7" stroke-linecap="round"/>
<polyline points="780,492 808,492 808,520" stroke="#ffffff" stroke-width="2.5" fill="none"/>
<circle cx="300" cy="520" r="7" fill="#f1c97d"/>
<circle cx="780" cy="520" r="7" fill="#f1c97d"/>
<circle cx="780" cy="170" r="7" fill="#f1c97d"/>
<text x="825" y="350" font-family="Noto Serif, Georgia, serif" font-size="44" fill="#fbbf24" text-anchor="middle" font-style="italic">a</text>
<text x="490" y="350" font-family="Noto Serif, Georgia, serif" font-size="44" fill="#f472b6" text-anchor="middle" font-style="italic">c</text>
<path d="M 355.0 520.0 Q 352.0 502.1 343.3 486.1" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7"/>
<text x="380" y="480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text>
<text x="600" y="80" font-family="Noto Serif, Georgia, serif" font-size="44" fill="#ffffff" text-anchor="middle">sin(A) = a / c</text>
<text x="600" y="125" font-family="Noto Serif, Georgia, serif" font-size="44" fill="#f1c97d" text-anchor="middle">a = c × sin(A)</text>
<text x="600" y="590" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#d0c5af" text-anchor="middle">Divide the opposite side by the hypotenuse, then sine converts the ratio back into side a.</text>
</svg>
