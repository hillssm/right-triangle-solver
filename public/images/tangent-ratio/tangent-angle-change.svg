<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="48" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">How Tangent Changes as the Angle Changes</text>
  <rect x="40" y="90" width="360" height="500" rx="10" fill="#1c1b1b" stroke="#f1c97d" stroke-width="1.5"/>
  <text x="220" y="124" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">A = 30°  (smaller angle)</text>
  <line x1="80" y1="510" x2="340" y2="360" stroke="#a3a3a3" stroke-width="7"/>
  <line x1="80" y1="510" x2="340" y2="510" stroke="#38bdf8" stroke-width="7"/>
  <line x1="340" y1="510" x2="340" y2="360" stroke="#f1c97d" stroke-width="7"/>
  <polyline points="316,510 316,486 340,486" fill="none" stroke="#ffffff" stroke-width="3"/>
  <polyline points="122.0,510.0 122.0,508.9 121.9,507.8 121.9,506.7 121.8,505.6 121.6,504.5 121.5,503.4 121.3,502.3 121.1,501.3 120.8,500.2 120.6,499.1 120.3,498.1 119.9,497.0 119.6,496.0 119.2,494.9 118.8,493.9 118.4,492.9 117.9,491.9 117.4,490.9 116.9,490.0 116.4,489.0" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="80" cy="510" r="6" fill="#ffffff"/>
  <circle cx="340" cy="510" r="6" fill="#ffffff"/>
  <circle cx="340" cy="360" r="6" fill="#ffffff"/>
  <text x="46" y="544" font-size="24" font-weight="700" fill="#ffffff">A</text>
  <text x="350" y="544" font-size="24" font-weight="700" fill="#ffffff">B</text>
  <text x="350" y="352" font-size="24" font-weight="700" fill="#ffffff">C</text>
  <text x="220" y="556" font-size="21" font-weight="700" fill="#f1c97d" text-anchor="middle">tan(A) ≈ 0.5774</text>
  <rect x="420" y="90" width="360" height="500" rx="10" fill="#1c1b1b" stroke="#f1c97d" stroke-width="1.5"/>
  <text x="600" y="124" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">A = 45°  (equal legs)</text>
  <line x1="460" y1="510" x2="660" y2="310" stroke="#a3a3a3" stroke-width="7"/>
  <line x1="460" y1="510" x2="660" y2="510" stroke="#38bdf8" stroke-width="7"/>
  <line x1="660" y1="510" x2="660" y2="310" stroke="#f1c97d" stroke-width="7"/>
  <polyline points="636,510 636,486 660,486" fill="none" stroke="#ffffff" stroke-width="3"/>
  <polyline points="502.0,510.0 502.0,508.4 501.9,506.7 501.7,505.1 501.5,503.4 501.2,501.8 500.8,500.2 500.4,498.6 499.9,497.0 499.4,495.5 498.8,493.9 498.1,492.4 497.4,490.9 496.6,489.5 495.8,488.1 494.9,486.7 494.0,485.3 493.0,484.0 491.9,482.7 490.8,481.5 489.7,480.3" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="460" cy="510" r="6" fill="#ffffff"/>
  <circle cx="660" cy="510" r="6" fill="#ffffff"/>
  <circle cx="660" cy="310" r="6" fill="#ffffff"/>
  <text x="426" y="544" font-size="24" font-weight="700" fill="#ffffff">A</text>
  <text x="670" y="544" font-size="24" font-weight="700" fill="#ffffff">B</text>
  <text x="670" y="302" font-size="24" font-weight="700" fill="#ffffff">C</text>
  <text x="600" y="556" font-size="21" font-weight="700" fill="#f1c97d" text-anchor="middle">tan(A) = 1</text>
  <rect x="800" y="90" width="360" height="500" rx="10" fill="#1c1b1b" stroke="#f1c97d" stroke-width="1.5"/>
  <text x="980" y="124" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">A = 60°  (larger angle)</text>
  <line x1="840" y1="510" x2="990" y2="250" stroke="#a3a3a3" stroke-width="7"/>
  <line x1="840" y1="510" x2="990" y2="510" stroke="#38bdf8" stroke-width="7"/>
  <line x1="990" y1="510" x2="990" y2="250" stroke="#f1c97d" stroke-width="7"/>
  <polyline points="966,510 966,486 990,486" fill="none" stroke="#ffffff" stroke-width="3"/>
  <polyline points="882.0,510.0 881.9,507.8 881.8,505.6 881.5,503.4 881.1,501.3 880.6,499.1 879.9,497.0 879.2,494.9 878.4,492.9 877.4,490.9 876.4,489.0 875.2,487.1 874.0,485.3 872.6,483.6 871.2,481.9 869.7,480.3 868.1,478.8 866.4,477.4 864.7,476.0 862.9,474.8 861.0,473.6" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="840" cy="510" r="6" fill="#ffffff"/>
  <circle cx="990" cy="510" r="6" fill="#ffffff"/>
  <circle cx="990" cy="250" r="6" fill="#ffffff"/>
  <text x="806" y="544" font-size="24" font-weight="700" fill="#ffffff">A</text>
  <text x="1000" y="544" font-size="24" font-weight="700" fill="#ffffff">B</text>
  <text x="1000" y="242" font-size="24" font-weight="700" fill="#ffffff">C</text>
  <text x="980" y="556" font-size="21" font-weight="700" fill="#f1c97d" text-anchor="middle">tan(A) ≈ 1.7321</text>
  <text x="600" y="614" font-size="17" fill="#d4d4d4" text-anchor="middle">As angle A grows, the opposite side becomes a longer share of the adjacent side, so tan(A) rises.</text>
</svg>
