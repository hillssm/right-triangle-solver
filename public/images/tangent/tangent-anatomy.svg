<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Anatomy of a right triangle for tangent</title>
<desc>Right triangle with angle A at bottom-right, opposite leg a vertical, adjacent leg b horizontal, hypotenuse c sloping.</desc>
<rect x="0" y="0" width="1200" height="630" fill="#131313"/>
<polygon points="330,500 870,500 870,170" fill="rgba(241,201,125,0.07)"/>
<line x1="870" y1="500" x2="870" y2="170" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
<line x1="330" y1="500" x2="870" y2="500" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
<line x1="330" y1="500" x2="870" y2="170" stroke="#f472b6" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
<polyline points="842,500 842,472 870,472" stroke="#ffffff" stroke-width="2.5" fill="none"/>
<circle cx="330" cy="500" r="8" fill="#f1c97d"/>
<circle cx="870" cy="500" r="8" fill="#f1c97d"/>
<circle cx="870" cy="170" r="8" fill="#f1c97d"/>
<text x="912" y="340" font-family="Noto Serif, Georgia, serif" font-size="44" fill="#fbbf24" text-anchor="middle" font-style="italic">a</text>
<text x="912" y="372" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#d0c5af" text-anchor="middle">opposite</text>
<text x="600" y="548" font-family="Noto Serif, Georgia, serif" font-size="44" fill="#38bdf8" text-anchor="middle" font-style="italic">b</text>
<text x="600" y="580" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#d0c5af" text-anchor="middle">adjacent</text>
<text x="560" y="330" font-family="Noto Serif, Georgia, serif" font-size="40" fill="#f472b6" text-anchor="middle" font-style="italic">c</text>
<text x="560" y="362" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#d0c5af" text-anchor="middle">hypotenuse</text>
<path d="M 812.0 500.0 Q 809.5 478.2 799.4 460.3" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.8"/>
<text x="775" y="448" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text>
<text x="820" y="235" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">B</text>
<text x="795" y="462" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#ffffff" text-anchor="middle">90°</text>
<text x="600" y="90" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="27" fill="#f1c97d" text-anchor="middle">tangent uses the opposite side a and the adjacent side b</text>
</svg>
