<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Tangent in real life: finding height from distance and angle</title>
<desc>Building height example: stand 25 m away, angle of elevation 38 degrees, height = 25 x tan(38) = 19.53 m.</desc>
<rect x="0" y="0" width="1200" height="630" fill="#131313"/>
<text x="600" y="65" font-family="Noto Serif, Georgia, serif" font-size="32" fill="#ffffff" text-anchor="middle">Building height from 25 m away, angle 38°</text>
<rect x="880" y="180" width="90" height="320" fill="#2a2929" stroke="#f1c97d" stroke-width="2"/>
<rect x="895" y="200" width="18" height="18" fill="#f1c97d" opacity="0.5"/>
<rect x="920" y="200" width="18" height="18" fill="#f1c97d" opacity="0.5"/>
<rect x="895" y="228" width="18" height="18" fill="#f1c97d" opacity="0.5"/>
<rect x="920" y="228" width="18" height="18" fill="#f1c97d" opacity="0.5"/>
<rect x="895" y="256" width="18" height="18" fill="#f1c97d" opacity="0.5"/>
<rect x="920" y="256" width="18" height="18" fill="#f1c97d" opacity="0.5"/>
<polygon points="180,500 880,500 880,180" fill="rgba(241,201,125,0.07)"/>
<line x1="880" y1="500" x2="880" y2="180" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
<line x1="180" y1="500" x2="880" y2="500" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
<line x1="180" y1="500" x2="880" y2="180" stroke="#f472b6" stroke-width="3" stroke-dasharray="10,8" stroke-linecap="round" opacity="0.7"/>
<polyline points="852,500 852,472 880,472" stroke="#ffffff" stroke-width="2.5" fill="none"/>
<circle cx="180" cy="500" r="8" fill="#f1c97d"/>
<circle cx="880" cy="500" r="8" fill="#f1c97d"/>
<path d="M 238.0 500.0 Q 234.5 470.2 219.4 444.3" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.8"/>
<text x="255" y="425" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">38°</text>
<text x="920" y="345" font-family="Noto Serif, Georgia, serif" font-size="34" fill="#fbbf24" text-anchor="middle" font-style="italic">a = 19.53 m</text>
<text x="530" y="548" font-family="Noto Serif, Georgia, serif" font-size="34" fill="#38bdf8" text-anchor="middle" font-style="italic">b = 25 m</text>
<text x="600" y="590" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#d0c5af" text-anchor="middle">a = 25 x tan(38°) = 25 x 0.7813 = 19.53 m</text>
</svg>
