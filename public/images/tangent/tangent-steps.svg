<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Step-by-step tangent calculation</title>
<desc>Worked example: b = 10 m, A = 30 degrees, find a = 10 x tan(30) = 5.77 m.</desc>
<rect x="0" y="0" width="1200" height="630" fill="#131313"/>
<text x="600" y="70" font-family="Noto Serif, Georgia, serif" font-size="32" fill="#ffffff" text-anchor="middle">Example: b = 10 m, A = 30°</text>
<polygon points="150,500 560,500 560,263" fill="rgba(241,201,125,0.07)"/>
<line x1="560" y1="500" x2="560" y2="263" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
<line x1="150" y1="500" x2="560" y2="500" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
<line x1="150" y1="500" x2="560" y2="263" stroke="#f472b6" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
<polyline points="532,500 532,472 560,472" stroke="#ffffff" stroke-width="2.5" fill="none"/>
<circle cx="150" cy="500" r="8" fill="#f1c97d"/>
<circle cx="560" cy="500" r="8" fill="#f1c97d"/>
<circle cx="560" cy="263" r="8" fill="#f1c97d"/>
<text x="600" y="390" font-family="Noto Serif, Georgia, serif" font-size="38" fill="#fbbf24" text-anchor="middle" font-style="italic">a = ?</text>
<text x="355" y="548" font-family="Noto Serif, Georgia, serif" font-size="36" fill="#38bdf8" text-anchor="middle" font-style="italic">b = 10 m</text>
<path d="M 504.0 500.0 Q 501.5 478.2 491.4 460.3" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.8"/>
<text x="467" y="448" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">A = 30°</text>
<text x="880" y="180" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#f1c97d" text-anchor="middle">Step 1: a = b x tan(A)</text>
<text x="880" y="240" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#d0c5af" text-anchor="middle">Step 2: a = 10 x tan(30°)</text>
<text x="880" y="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#d0c5af" text-anchor="middle">Step 3: tan(30°) = 0.5774</text>
<text x="880" y="360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#d0c5af" text-anchor="middle">Step 4: a = 10 x 0.5774</text>
<text x="880" y="440" font-family="Noto Serif, Georgia, serif" font-size="40" fill="#fbbf24" text-anchor="middle">a = 5.77 m</text>
<text x="880" y="505" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#8a8272" text-anchor="middle">check: tan(30°) = a / b = 0.5774</text>
</svg>
