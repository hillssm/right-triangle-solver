<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Manrope, Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#131313"/>
  <text x="600" y="58" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Seven Calculator Modes</text>

  <rect x="150" y="100" width="900" height="470" rx="14" fill="#1c1b1b" stroke="#2e2c2c"/>
  <text x="200.0" y="158.0" font-size="26" font-weight="700" fill="#7dd3fc" text-anchor="start">Known a</text>
  <text x="470.0" y="158.0" font-size="28" font-weight="700" fill="#f1c97d" text-anchor="middle">→</text>
  <text x="520.0" y="158.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="start">Long leg</text>
  <text x="1010.0" y="158.0" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="end">b = a√3</text>
  <line x1="180" y1="189" x2="1020" y2="189" stroke="#2e2c2c" stroke-width="1"/>
  <text x="200.0" y="220.0" font-size="26" font-weight="700" fill="#7dd3fc" text-anchor="start">Known a</text>
  <text x="470.0" y="220.0" font-size="28" font-weight="700" fill="#f1c97d" text-anchor="middle">→</text>
  <text x="520.0" y="220.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="start">Hypotenuse</text>
  <text x="1010.0" y="220.0" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="end">c = 2a</text>
  <line x1="180" y1="251" x2="1020" y2="251" stroke="#2e2c2c" stroke-width="1"/>
  <text x="200.0" y="282.0" font-size="26" font-weight="700" fill="#7dd3fc" text-anchor="start">Known c</text>
  <text x="470.0" y="282.0" font-size="28" font-weight="700" fill="#f1c97d" text-anchor="middle">→</text>
  <text x="520.0" y="282.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="start">Short leg</text>
  <text x="1010.0" y="282.0" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="end">a = c / 2</text>
  <line x1="180" y1="313" x2="1020" y2="313" stroke="#2e2c2c" stroke-width="1"/>
  <text x="200.0" y="344.0" font-size="26" font-weight="700" fill="#7dd3fc" text-anchor="start">Known b</text>
  <text x="470.0" y="344.0" font-size="28" font-weight="700" fill="#f1c97d" text-anchor="middle">→</text>
  <text x="520.0" y="344.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="start">Short leg</text>
  <text x="1010.0" y="344.0" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="end">a = b / √3</text>
  <line x1="180" y1="375" x2="1020" y2="375" stroke="#2e2c2c" stroke-width="1"/>
  <text x="200.0" y="406.0" font-size="26" font-weight="700" fill="#7dd3fc" text-anchor="start">Known c</text>
  <text x="470.0" y="406.0" font-size="28" font-weight="700" fill="#f1c97d" text-anchor="middle">→</text>
  <text x="520.0" y="406.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="start">Long leg</text>
  <text x="1010.0" y="406.0" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="end">b = c√3 / 2</text>
  <line x1="180" y1="437" x2="1020" y2="437" stroke="#2e2c2c" stroke-width="1"/>
  <text x="200.0" y="468.0" font-size="26" font-weight="700" fill="#7dd3fc" text-anchor="start">Known a</text>
  <text x="470.0" y="468.0" font-size="28" font-weight="700" fill="#f1c97d" text-anchor="middle">→</text>
  <text x="520.0" y="468.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="start">Area</text>
  <text x="1010.0" y="468.0" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="end">A = a²√3 / 2</text>
  <line x1="180" y1="499" x2="1020" y2="499" stroke="#2e2c2c" stroke-width="1"/>
  <text x="200.0" y="530.0" font-size="26" font-weight="700" fill="#7dd3fc" text-anchor="start">Known a</text>
  <text x="470.0" y="530.0" font-size="28" font-weight="700" fill="#f1c97d" text-anchor="middle">→</text>
  <text x="520.0" y="530.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="start">Perimeter</text>
  <text x="1010.0" y="530.0" font-size="26" font-weight="700" fill="#f1c97d" text-anchor="end">P = a(3 + √3)</text>
</svg>

