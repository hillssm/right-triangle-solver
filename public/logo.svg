<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="gold" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A00" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2C8" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Triangle (Thick luxury border) -->
  <path d="M 40 200 L 200 200 L 40 40 Z" fill="rgba(212, 175, 55, 0.05)" stroke="url(#gold)" stroke-width="12" stroke-linejoin="bevel" filter="url(#glow)"/>
  
  <!-- Inner geometric split -->
  <path d="M 60 180 L 160 180 L 60 80 Z" fill="url(#gold)" opacity="0.9"/>
  
  <!-- Precision Altitude Line -->
  <line x1="60" y1="180" x2="110" y2="130" stroke="#131313" stroke-width="6" stroke-linecap="round" />
  
  <!-- Luxury Right Angle Square -->
  <path d="M 40 165 L 75 165 L 75 200" fill="none" stroke="url(#goldLight)" stroke-width="5" stroke-linejoin="miter"/>
</svg>
